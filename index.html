}
function recordSeasonResult(ms){
  if(!ms || !ms.finished || typeof ms.seasonGame!=='number' || ms.seasonRecorded) return;
  const s=ensureSeason();
  const p=pTot(ms), n=nTot(ms);
  const outcome = ms.result ? ms.result.outcome : (p>n?'win': p<n?'lose':'draw');
  s.results[ms.seasonGame]={opp:ms.oppId, p, n, outcome};
  ms.seasonRecorded=true;
  let i=0; while(i<s.schedule.length && s.results[i]) i++;

function cineRunnerMovements(before,after,batterName,runs){
  const b = Array.isArray(before) ? before : [null,null,null];
  const a = Array.isArray(after) ? after : [null,null,null];
  const moves=[];
  let scoringLeft = Math.max(0,Number(runs)||0);
  [2,1,0].forEach(i=>{
    const name=b[i];
    if(!name) return;
    const ni=a.indexOf(name);
    if(ni>=0) moves.push({runner:name,from:i+1,to:ni+1});
    else if(scoringLeft>0){ moves.push({runner:name,from:i+1,to:'home'}); scoringLeft--; }
    else moves.push({runner:name,from:i+1,to:'out'});
  });
  if(batterName){
    const bi=a.indexOf(batterName);
    if(bi>=0) moves.push({runner:batterName,from:'batter',to:bi+1});
    else if(scoringLeft>0){ moves.push({runner:batterName,from:'batter',to:'home'}); scoringLeft--; }
    else moves.push({runner:batterName,from:'batter',to:'out'});
  }
  return moves;
}
function formatBaseState(bases){
  const b = Array.isArray(bases) ? bases : [null,null,null];
  const on = [];
  if(b[0]) on.push('1塁');
  if(b[1]) on.push('2塁');
  if(b[2]) on.push('3塁');
  if(on.length===3) return '満塁';
  return on.length ? on.join('・') : '走者なし';
}
function formatRunnerMovements(moves,kind){
  if(!Array.isArray(moves) || !moves.length) return kind==='scored' ? 'なし' : 'なし';
  const baseName=v=>v==='batter'?'打者':v==='home'?'本塁':v==='out'?'アウト':`${v}塁`;
  const filtered = kind==='scored' ? moves.filter(m=>m.to==='home') : moves.filter(m=>m.to!=='home' && m.to!=='out');
  if(!filtered.length) return 'なし';
  return filtered.map(m=>{
    const runner = m.from==='batter' ? '打者' : `${m.from}塁走者${m.runner}`;
    return kind==='scored' ? runner : `${runner} → ${baseName(m.to)}`;
  }).join(' / ');
}
function createBattedBallInfo(resultId,bt){
  if(!['1B','2B','3B'].includes(resultId)) return null;
  const r = rnd();
  let fieldZone='CF', traj='liner', depth='shallow';
  if(resultId==='2B'){
    if(r<0.28){
      fieldZone = 'LC';
      depth = rnd()<0.72 ? 'deep' : 'medium';
      traj = rnd()<0.72 ? 'liner' : 'fly';
    }else if(r<0.56){
      fieldZone = 'RC';
      depth = rnd()<0.72 ? 'deep' : 'medium';
      traj = rnd()<0.72 ? 'liner' : 'fly';
    }else if(r<0.78){
      fieldZone = pick(['LF','RF']);
      depth = 'deep';
      traj = 'liner';
    }else{
      fieldZone = pick(['LC','RC','CF']);
      depth = 'deep';
      traj = rnd()<0.55 ? 'fly' : 'liner';
    }
  }else if(resultId==='3B'){
    if(r<0.36) fieldZone = 'RC';
    else if(r<0.72) fieldZone = 'LC';
    else fieldZone = pick(['RF','LF']);
    depth = 'deep';
    traj = ['RF','LF'].includes(fieldZone) ? 'liner' : (rnd()<0.62 ? 'liner' : 'fly');
  }else if(r<0.12){
    fieldZone = pick(['IF_L','IF_C','IF_R']);
    traj = 'grounder';
    depth = 'infield';
  }else if(r<0.30){
    fieldZone = pick(['LF','CF','RF']);
    traj = rnd()<0.55 ? 'fly' : 'liner';
    depth = 'shallow';
  }else{
    const zones = ['LF','LC','CF','RC','RF'];
    fieldZone = zones[Math.floor(rnd()*zones.length)];
    traj = rnd()<0.22 ? 'grounder' : 'liner';
    depth = rnd()<0.42 ? 'medium' : 'shallow';
  }
  const meta = cineFieldMeta(fieldZone);
  return {fieldZone,dir:meta.dir,traj,depth,battedBallType:traj,batterPower:bt&&bt.power};
}
function singleHitText(ballInfo,runs){

  else if(zone==='LC') text = '左中間へのヒット';
  else if(zone==='RC') text = '右中間へのヒット';

  else if(zone==='IF_R') text = '一二塁間への内野安打';
  if((traj==='fly' || traj==='liner') && depth==='shallow' && ['LF','CF','RF'].includes(zone)) text = text.replace('前ヒット','前へのポテンヒット');
  return runs>0 ? `${text}で${runs}点追加` : text;
}
function extraBaseHitText(resultId,ballInfo,runs){

/* ===== 6. 探索エンジン ===================================== */
function aptFactor(planet,pids){
  let sum=0;
  for(const pid of pids){
    const pl=getPlayer(pid);
    let sc=0;
    for(const [bk,pk,w] of planet.apt){
      const v = pl.isPitcher? pl.ab[pk] : pl.ab[bk];
      sc+=(v||0)*w;
    }
    if(pl.type===planet.type) sc*=1.1;
    sum+=sc;
  }
  const avg=clampN(sum/pids.length,0,100);
  return 0.8+avg/100*0.5;
}
function unlockedDrops(planetId){
  const sr=save.planetProgress[planetId].surveyRate;
  return PLANETS[planetId].drops.filter(d=>sr>=d.u);
}
function startExpedition(planetId,pids){
  const pl=PLANETS[planetId];
  const ex={
    planetId, party:pids.slice(), apt:aptFactor(pl,pids),
    step:0, total:rint(5,8),
    results:[], pend:null,
    gains:{}, survey:0,
    finished:false, retreated:false, result:null,
  };
  save.activeExpedition=ex;
  save.lastParty=pids.slice();
  persist();
}
function gainMat(ex,mid,qty){ ex.gains[mid]=(ex.gains[mid]||0)+qty; }
function dropOnce(ex){
  const sr=save.planetProgress[ex.planetId].surveyRate;
  const ent=wpick(unlockedDrops(ex.planetId));
  const qty=Math.max(1,Math.round(rint(ent.min,ent.max)*ex.apt*(1+sr*0.002)));
  gainMat(ex,ent.m,qty);
  return {mid:ent.m,qty};
}
function openExploreEffect(desc){
  const ex=save.activeExpedition;
  if(!ex) return;
  const pl=PLANETS[ex.planetId];
  UI.modal={kind:'exploreEffect',res:{desc, gains:ex.gains, survey:ex.survey, planet:pl.name}};
  render();
}
function stepExpedition(){
  const ex=save.activeExpedition;
  if(!ex || ex.finished || ex.pend) return;
  ex.step++; ex.survey+=BAL.surveyStep;
  const pl=PLANETS[ex.planetId];
  const r=rnd();
  if(r<0.25){
    const okP=clampN(0.35+(ex.apt-0.8)*1.2,0.35,0.9);
    ex.pend={
      text:pick(pl.events),
      okP,
      options:[
        {id:'safe',label:'安全に調査する',hint:'素材を確実に獲得 / 調査率+'+BAL.surveySafe+'%'},
        {id:'deep',label:'深部へ進む',hint:'レア素材の可能性(成功率'+Math.round(okP*100)+'%)'},
        {id:'data',label:'データだけ回収する',hint:'素材なし / 調査率+'+BAL.surveyData+'%'},
      ],
    };
    ex.results.push({step:ex.step,text:'❖ '+ex.pend.text,ev:true});
    persist();
    UI.modal={kind:'exploreChoice',pend:ex.pend,planet:pl.name};
    render();
    return;
  }
  let message='';
  if(r<0.45){
    message=pick(STEP_NOTHING);
    ex.results.push({step:ex.step,text:message});
  }
  else{
    const d=dropOnce(ex);
    message=MATERIALS[d.mid].name+' ×'+d.qty+' を採取';
    ex.results.push({step:ex.step,text:message});
  }
  if(ex.step>=ex.total) finishExpedition(true);
  persist();
  openExploreEffect(message);
}
function chooseExpedition(optId){
  const ex=save.activeExpedition;
  if(!ex || !ex.pend) return;
  const pl=PLANETS[ex.planetId];
  let txt='';
  if(optId==='safe'){
    const bases=pl.drops.filter(d=>d.u===0);
    const ent=pick(bases);
    const qty=2+(ex.apt>1.05?1:0);
    gainMat(ex,ent.m,qty);
    ex.survey+=BAL.surveySafe;
    txt='慎重に調査。'+MATERIALS[ent.m].name+' ×'+qty+' を確保（調査率+'+BAL.surveySafe+'%）';
  }
  else if(optId==='deep'){
    if(rnd()<ex.pend.okP){
      const un=unlockedDrops(ex.planetId);
      const rare=un.reduce((a,b)=>MATERIALS[a.m].r>=MATERIALS[b.m].r?a:b);
      const qty=rint(2,3);
      gainMat(ex,rare.m,qty);
      txt='深部調査に成功！ '+MATERIALS[rare.m].name+' ×'+qty+' を発見！';
    }else{
      if(rnd()<0.5){
        const bases=pl.drops.filter(d=>d.u===0);
        const ent=pick(bases);
        gainMat(ex,ent.m,1);
        txt='深部で迷ったが、'+MATERIALS[ent.m].name+' ×1 だけ拾って引き返した。';
      }else{
        txt='深部は崩落していた。収穫なし。';
      }
    }
  }
  else{
    ex.survey+=BAL.surveyData;
    txt='周辺データをスキャン（調査率+'+BAL.surveyData+'%）';
  }
  ex.pend=null;
  ex.results.push({step:ex.step,text:'→ '+txt});
  if(ex.step>=ex.total) finishExpedition(true);
  persist();
  UI.modal={kind:'exploreEffect',res:{desc:txt,gains:ex.gains,survey:ex.survey,planet:pl.name}};
  render();
}
function retreatExpedition(){
  const ex=save.activeExpedition;
  if(!ex || ex.finished) return;
  ex.pend=null;
  finishExpedition(false);
  persist();
}
function finishExpedition(completed){
  const ex=save.activeExpedition;
  if(!ex || ex.finished) return;
  ex.finished=true; ex.retreated=!completed;
  const keep = completed? 1 : BAL.retreatKeep;
  const final={};
  for(const mid of Object.keys(ex.gains)){
    const q=Math.ceil(ex.gains[mid]*keep);
    if(q>0){ final[mid]=q; save.inventory.materials[mid]=(save.inventory.materials[mid]||0)+q; }
  }
  const sGain=ex.survey+(completed?BAL.surveyDone:0);
  const prog=save.planetProgress[ex.planetId];
  const before=prog.surveyRate;
  prog.surveyRate=Math.min(100,before+sGain);
  const unlocked=[];
  for(const th of [30,60]){
    if(before<th && prog.surveyRate>=th){
      const ent=PLANETS[ex.planetId].drops.find(d=>d.u===th);
      unlocked.push('調査率'+th+'%達成！ 新素材「'+MATERIALS[ent.m].name+'」の反応を検知');
    }
  }
  ex.result={completed,final,sGain,rate:prog.surveyRate,unlocked};
  if(Object.keys(final).length){
    const found = Object.entries(final).map(([mid,q])=>`${MATERIALS[mid].name} ×${q}`).join(' / ');
    addNews(`探索完了: ${PLANETS[ex.planetId].name} で ${found} を獲得`);
  }
}
function closeExpedition(){ save.activeExpedition=null; persist(); render(); }

/* ===== 7. スカウト/育成/施設 =============================== */
function doScout(){
  if(save.activeMatch && !save.activeMatch.finished){ toast('試合中はスカウトできません'); return; }
  if(save.team.credits<SCOUT_COST){ toast('クレジットが足りません'); return; }
  save.team.credits-=SCOUT_COST;
  const r=rnd();
  const rar = r<0.15?3 : r<0.50?2 : 1;
  const cand=SCOUT_POOL.filter(id=>PLAYER_MASTER[id].rarity===rar);
  const mid=pick(cand);
  let res;
  if(save.scout.pulledIds.includes(mid)){
    const td=SCOUT_DUPE_TD[rar];
    save.inventory.trainingData+=td;
    res={mid,rar,dupe:true,td};
  }else{
    save.scout.pulledIds.push(mid);
    save.players.push(instantiate(mid));
    res={mid,rar,dupe:false};
  }
  persist(); // 演出前に保存(引き直し防止)
  UI.modal={kind:'scoutResult',res};
  addNews(`${PLAYER_MASTER[mid].name} をスカウト${res.dupe?'し、訓練データに変換':'しました'}`);
  render();
}
function needExp(level){ return 40+(level-1)*30; }
function levelCost(level){ return 60+level*25; }
function canLevelUp(p){
  return p.level<LEVCAP[p.rarity] && p.exp>=needExp(p.level) && save.team.credits>=levelCost(p.level);
}
function levelUp(pid){
  const p=getPlayer(pid);
  if(!p || !canLevelUp(p)){ toast('経験値またはクレジットが不足しています'); return; }
  p.exp-=needExp(p.level);
  save.team.credits-=levelCost(p.level);
  p.level++;
  const g=GROWTH[p.role], cap=ABCAP[p.rarity];
  for(const k of Object.keys(g)){
    if(p.ab[k]!==undefined) p.ab[k]=Math.min(cap,p.ab[k]+g[k]);
  }
  persist();
  toast(p.name+' が Lv'+p.level+' に成長！');
  render();
}
function useTraining(pid){
  const p=getPlayer(pid);
  if(!p || save.inventory.trainingData<1){ toast('訓練データがありません'); return; }
  save.inventory.trainingData--;
  p.exp+=BAL.tdExp;
  persist(); render();
}
function facCost(fid){
  const f=FACILITIES[fid], lv=save.facilities[fid];
  if(lv>=f.max) return null;
  return f.costs[lv+1];
}
function canUpgrade(fid){
  const c=facCost(fid);
  if(!c) return false;
  if(save.team.credits<c.cr) return false;
  for(const m of Object.keys(c.mats)) if((save.inventory.materials[m]||0)<c.mats[m]) return false;
  return true;
}
function upgradeFacility(fid){
  if(!canUpgrade(fid)){ toast('強化に必要な素材かクレジットが不足しています'); return; }
  const c=facCost(fid);
  save.team.credits-=c.cr;
  for(const m of Object.keys(c.mats)) save.inventory.materials[m]-=c.mats[m];
  save.facilities[fid]++;
  persist();
  const lv=save.facilities[fid];
  toast(FACILITIES[fid].name+' が Lv'+lv+' になりました'+(lv>=FACILITIES[fid].max?'（最大）':''));
  render();
}
function sellPrice(mid){ return Math.round(SELL_BASE[MATERIALS[mid].r]*(1+0.1*(save.facilities.workshop-1))); }
function sellMaterial(mid){
  if((save.inventory.materials[mid]||0)<1) return;
  save.team.credits += sellPrice(mid);
  save.inventory.materials[mid] -= 1;
  persist();
  toast(MATERIALS[mid].name + ' を売却しました');
  render();
}

function toggleExpParty(pid){
  const idx = UI.expParty.indexOf(pid);
  if(idx >= 0){ UI.expParty[idx] = null; }
  else {
    const empty = UI.expParty.indexOf(null);
    if(empty >= 0){ UI.expParty[empty] = pid; }
    else { toast('パーティは最大3人までです'); return; }
  }
  render();
}
function startExpeditionParty(){
  const party = UI.expParty.filter(Boolean);
  if(party.length < 1){ toast('パーティを1人以上選んでください'); return; }
  startExpedition(UI.expPlanet, party);
  render();
}

function resetToDefaultSave(){
  if(!confirm('セーブデータを初期状態に戻します。よろしいですか？')) return;
  if(!confirm('現在の進行状況は消えます。開発用リセットを実行しますか？')) return;

function canEditLineup(){
  if(save.activeMatch && !save.activeMatch.finished){
    toast('試合中は編成を変更できません');
    return false;
  }
  return true;
}
function lineupKey(item){ return item ? item.type+':'+item.key : ''; }
function lineupRoleName(role){
  return {pinchHitter:'代打',pinchRunner:'代走',defenseSub:'守備固め',starter:'先発',relief1:'中継ぎ1',relief2:'中継ぎ2',closer:'抑え'}[role] || role;
}
function lineupPickLabel(item){
  if(!item) return '';
  if(item.type==='starter') return 'スタメン '+(item.key+1);
  if(item.type==='bench') return '控え '+(item.key+1);
  if(item.type==='freeBatter') return '野手候補';
  if(item.type==='pitcher') return lineupRoleName(item.key);
  if(item.type==='freePitcher') return '投手候補';
  return '';
}
function changeStarterPosition(idx,pos){
  if(!canEditLineup()) return;
  const L=save.team.lineup;
  const pid=L.battingOrder[idx];
  if(!pid) return;
  L.positions[pid]=pos;
  persist(); render();
}
function lineupSelect(type,key){
  if(!canEditLineup()) return;
  const next={type,key};
  const cur=UI.lineupPick;
  if(!cur){ UI.lineupPick=next; render(); return; }
  if(lineupKey(cur)===lineupKey(next)){ UI.lineupPick=null; render(); return; }
  applyLineupSwap(cur,next);
  UI.lineupPick=null;
  persist(); render();
}
function applyLineupSwap(a,b){
  const L=save.team.lineup;
  const isBatter=t=>['starter','bench','freeBatter'].includes(t);
  const isPitcher=t=>['pitcher','freePitcher'].includes(t);
  if(isBatter(a.type) && isBatter(b.type)) return swapBatterSlot(a,b);
  if(isPitcher(a.type) && isPitcher(b.type)) return swapPitcherSlot(a,b);
  toast('野手枠と投手枠は入れ替えできません');
}
function batterSlotPid(item){
  const L=save.team.lineup;
  if(item.type==='starter') return L.battingOrder[item.key];
  if(item.type==='bench') return L.bench[item.key] && L.bench[item.key].pid;
  if(item.type==='freeBatter') return item.key;
  return null;
}
function setBatterSlot(item,pid,oldPid){
  const L=save.team.lineup;
  if(item.type==='starter'){
    const prev=L.battingOrder[item.key];
    const pos=L.positions[prev] || (getPlayer(pid).pos[0] || 'DH');
    L.battingOrder[item.key]=pid;
    delete L.positions[prev];
    L.positions[pid]=pos;
  }else if(item.type==='bench'){
    L.bench[item.key].pid=pid;
  }
}
function swapBatterSlot(a,b){
  const pa=batterSlotPid(a), pb=batterSlotPid(b);
  if(!pa || !pb) return;
  if(a.type==='starter' && b.type==='starter'){
    const tmp=save.team.lineup.battingOrder[a.key];
    save.team.lineup.battingOrder[a.key]=save.team.lineup.battingOrder[b.key];
    save.team.lineup.battingOrder[b.key]=tmp;
    return;
  }
  setBatterSlot(a,pb,pa);
  setBatterSlot(b,pa,pb);
}
function pitcherSlotPid(item){
  const P=save.team.lineup.pitchers;
  if(item.type==='pitcher') return P[item.key];
  if(item.type==='freePitcher') return item.key;
  return null;
}
function setPitcherSlot(item,pid){
  if(item.type==='pitcher') save.team.lineup.pitchers[item.key]=pid;
}
function swapPitcherSlot(a,b){
  const pa=pitcherSlotPid(a), pb=pitcherSlotPid(b);
  if(!pa || !pb) return;
  setPitcherSlot(a,pb);
  setPitcherSlot(b,pa);
}

      <div class="slot ${pickKey===lineupKey({type:'pitcher',key:role})?'sel':''}" onclick="lineupSelect('pitcher','${role}')">

        <div><div class="nm">${esc(p?p.name:'未設定')}</div><div class="mut">${p?esc(ROLE_INFO[p.role]||p.role):'—'}</div></div>
        <div class="tail"><span class="rolechip">${esc(lineupRoleName(role))}</span></div>

  main.innerHTML = `
    <section class="panel"><div class="ph"><div><span class="eyebrow">LINEUP</span><h2>編成</h2></div><div class="sub">${save.activeMatch && !save.activeMatch.finished ? '試合中は変更不可' : '保存済み'}</div></div>
      <p class="note">${esc(pickNote)}</p>
      <div class="lineup-layout">
        <div>
          <h3 class="sec">スタメン / 打順</h3>
          ${starters}
        </div>
        <div>
          <h3 class="sec">控え野手</h3>
          ${bench}
          <h3 class="sec">未使用野手</h3>
          <div class="lineup-pool">${freeB}</div>
        </div>
      </div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">PITCHERS</span><h2>投手起用</h2></div></div>
      <div class="lineup-layout">
        <div>${pitcherHtml}</div>
        <div><h3 class="sec">未使用投手</h3><div class="lineup-pool">${freeP}</div></div>
      </div>

    const trot=Math.round(Math.atan2(dy,dx)*180/Math.PI);
    const trailStyle=`--tl-len:${tlen}%;--tl-rot:${trot}deg;--pd:${pd}s;--fly:${flyDur}s`;
    const mStyle=`--fx:${relX}%;--fy:${relY}%;--tx:${t.x}%;--ty:${t.y}%;--mx:${mx.toFixed(1)}%;--my:${my.toFixed(1)}%;--pd:${pd}s;--fly:${flyDur}s`;
    html += `<span class="lpf-trail ${jg}${p.final?' final':''}" style="${trailStyle}"></span>`;
    html += `<span class="lpf-pitch ${sh} ${jg} traj-${traj}${p.final?' final':''}" style="${mStyle}" title="${esc(p.no+'球目 '+p.call+' '+p.type+' '+p.speed+'km/h')}"></span>`;
  });
  return {html, timing:tm};
}
// 打球の着弾点(%): 打球線・着弾・コールアウト・守備反応・返球の共通座標ソース
function livePAImpactPoint(evt){
  // 内野ゴロは処理した野手の位置を着弾点に(文・打球・守備・コールアウトを一致)
  if(evt && evt.fieldedBy && evt.traj==='grounder' && LIVE_FIELDER_POS[evt.fieldedBy]){
    const p=LIVE_FIELDER_POS[evt.fieldedBy]; return {x:p[0], y:p[1]};
  }
  const zone=(evt && evt.fieldZone) || 'CF';
  const base=LIVE_ZONE_LAND[zone] || LIVE_ZONE_LAND.CF;
  let x=base[0], y=base[1];
  const depth=evt && evt.depth;
  if(depth==='deep' || depth==='overFence'){ y-=6; x=50+(x-50)*1.12; }
  else if(depth==='shallow'){ y+=6; x=50+(x-50)*0.9; }
  return {x:+x.toFixed(1), y:+y.toFixed(1)};
}
// %ベースの打球(軌道線+ボール+着弾)。本塁→着弾点。守備/コールアウトと同一座標。
function livePABattedFx(evt, animate, tm){
  const ball=liveSafeBallFromEvent(evt);
  if(!ball) return '';
  const traj=ball.traj||evt.traj||'liner';
  const imp=livePAImpactPoint(evt);
  const hx=50, hy=84;
  const dx=imp.x-hx, dy=imp.y-hy;
  const len=Math.max(1,Math.sqrt(dx*dx+dy*dy)).toFixed(1);
  const rot=Math.round(Math.atan2(dy,dx)*180/Math.PI);
  // 高さはZ方向の放物線(--peakz)で表現。地面の軌道(中間点)は直進にする。
  const peakz = traj==='homer'?84 : traj==='fly'?60 : traj==='liner'?22 : traj==='grounder'?0 : 32;
  const mx=((hx+imp.x)/2).toFixed(1), my=((hy+imp.y)/2).toFixed(1);
  const id=evt.resultId;
  const hit=['1B','2B','3B','HR'].includes(id);
  const bc = id==='HR'?'var(--imp)' : hit?'var(--cy)':'rgba(231,243,255,.9)';
  const pw = clampN(((evt.batterPower||50)-40)/38,0,1).toFixed(2); // パワーで打球発光を強める
  const bdelay=(tm.ballDelay||0.65).toFixed(2), ldelay=(tm.landDelay||1.25).toFixed(2);
  const bdur=Math.max(0.3,(Number(tm.landDelay||1.25)-Number(tm.ballDelay||0.65))).toFixed(2);
  const style=`--hx:${hx}%;--hy:${hy}%;--tx:${imp.x}%;--ty:${imp.y}%;--mx:${mx}%;--my:${my}%;--len:${len}%;--rot:${rot}deg;--bc:${bc};--pw:${pw};--peakz:${peakz}px;--bdelay:${bdelay}s;--ldelay:${ldelay}s;--bdur:${bdur}s`;
  return `<span class="lpb-trace ${esc(traj)}" style="${style}"></span><span class="lpb-shadow ${esc(traj)}" style="${style}"></span><span class="lpb-ball ${esc(traj)}" style="${style}"></span><span class="lpb-land ${esc(traj)}" style="${style}"></span>`;
}
// 返球線(表示専用): 外野打球後、runnerMovements から返球先を推定
function livePAReturnThrow(evt, animate, tm){
  const zone=evt && evt.fieldZone;
  if(!['LF','LC','CF','RC','RF'].includes(zone||'')) return ''; // 内野は省略
  const moves=Array.isArray(evt.runnerMovements)?evt.runnerMovements:[];
  let target=null;
  const toHome=moves.find(m=>m && m.to==='home');
  const toThird=moves.find(m=>m && (m.to===3 || m.to==='3'));
  const outMove=moves.find(m=>m && (m.to==='out' || m.result==='out'));
  if(toHome) target={x:50,y:84};
  else if(toThird) target={x:22,y:57};
  else if(outMove){ const p=livePAPoint(outMove.to==='out'?'out':outMove.to); target={x:parseFloat(p.x),y:parseFloat(p.y)}; }
  else return '';
  const imp=livePAImpactPoint(evt);
  const dx=target.x-imp.x, dy=target.y-imp.y;
  const len=Math.max(1,Math.sqrt(dx*dx+dy*dy)).toFixed(1);
  const rot=Math.round(Math.atan2(dy,dx)*180/Math.PI);
  const delay=(tm.throwDelay||1.45).toFixed(2);
  return `<span class="lpt-throw" style="left:${imp.x}%;top:${imp.y}%;--len:${len}%;--rot:${rot}deg;--tdelay:${delay}s"></span>`;
}
// 守備の送球(表示専用): 内野ゴロ→一塁 / 併殺→二塁(封殺)→一塁 / 外野安打→本塁・三塁返球。判定は結果に従う。
function livePADefense(evt, animate, tm){
  if(!animate) return '';
  const id=evt.resultId, zone=evt.fieldZone||'', traj=evt.traj, rtext=evt.resultText||'';
  if(id==='HR') return ''; // 柵越え本塁打は返球なし
  const BASE={home:[50,84], b1:[78,57], b2:[50,28], b3:[22,57]};
  const imp=livePAImpactPoint(evt);
  const t0=(typeof tm.throwDelay==='number'?tm.throwDelay:1.45);
  const seg=(from,to,delay)=>{
    const dx=to[0]-from[0], dy=to[1]-from[1];
    const len=Math.max(1,Math.sqrt(dx*dx+dy*dy)).toFixed(1);
    const rot=Math.round(Math.atan2(dy,dx)*180/Math.PI);
    return `<span class="lpt-throw" style="left:${from[0]}%;top:${from[1]}%;--len:${len}%;--rot:${rot}deg;--tdelay:${delay.toFixed(2)}s"></span>`;
  };
  const tag=(pos,delay,text,kind)=>`<span class="lpf-callout ${kind}" style="left:${pos[0]}%;top:${pos[1]}%;--cd:${delay.toFixed(2)}s">${text}</span>`;
  let html='';
  if(/併殺/.test(rtext)){ // ゲッツー: 処理野手→二塁(封殺)→一塁
    html+=seg([imp.x,imp.y],BASE.b2,t0)+tag(BASE.b2,t0+0.28,'OUT','out');
    html+=seg(BASE.b2,BASE.b1,t0+0.36)+tag(BASE.b1,t0+0.66,'OUT','out');
  }else if(id==='OUT' && traj==='grounder'){ // 内野ゴロ: 処理野手→一塁
    html+=seg([imp.x,imp.y],BASE.b1,t0)+tag(BASE.b1,t0+0.3,'OUT','out');
  }else if(['LF','LC','CF','RC','RF'].includes(zone)){ // 外野: 走者の進塁に合わせ返球
    const moves=Array.isArray(evt.runnerMovements)?evt.runnerMovements:[];
    const outMove=moves.find(m=>m&&(m.to==='out'||m.result==='out'));
    const toHome=moves.find(m=>m&&m.to==='home');
    const toThird=moves.find(m=>m&&(m.to===3||m.to==='3'));
    if(outMove){ const p=livePAPoint(outMove.to==='out'?'out':outMove.to); const tp=[parseFloat(p.x),parseFloat(p.y)]; html+=seg([imp.x,imp.y],tp,t0)+tag(tp,t0+0.3,'OUT','out'); }
    else if(toHome){ html+=seg([imp.x,imp.y],BASE.home,t0)+tag(BASE.home,t0+0.3,'SAFE','safe'); }
    else if(toThird){ html+=seg([imp.x,imp.y],BASE.b3,t0)+tag(BASE.b3,t0+0.3,'SAFE','safe'); }
  }
  return html;
}
function livePANoBallCallout(evt, animate, tm){
  if(!animate || !evt) return '';
  const id = evt.resultId || evt.result;
  const label = id === 'K' ? 'K' : id === 'BB' ? 'WALK' : id === 'HBP' ? 'HBP' : id === 'OUT' ? 'OUT' : '';
  if(!label) return '';
  const kind = id === 'K' || id === 'OUT' ? 'out' : 'safe';
  const pos = id === 'HBP' ? [60,77] : [50,77];
  const cd = ((tm && tm.labelDelay) || 0.9).toFixed(2);
  return `<span class="lpf-callout ${kind}" style="left:${pos[0]}%;top:${pos[1]}%;--cd:${cd}s">${esc(label)}</span>`;
}
function livePAStatValue(value, unit=''){
  if(value === null || value === undefined || value === '' || value === '-') return `<b>-</b>`;
  return `<b>${esc(String(value))}${unit?`<small>${esc(unit)}</small>`:''}</b>`;
}
// 中継風スタットバー(表示専用)。既存evt/配球チャートから読める値を優先し、不明値は -。
function livePAStatBar(evt, hasBall, chart){
  if(!hasBall) return ''; // 打球がない打席ではスタットバーを出さない
  const fin = chart && chart.final;
  const pw = Number(evt && evt.batterPower);
  const sp = Number(evt && evt.batterSpeed);
  const batted = Number.isFinite(pw) ? Math.round(118 + (pw-40)*0.95 + (evt.resultId==='HR'?12:0)) : null;
  const runSpeed = Number.isFinite(sp) ? Math.round(24 + (sp-40)*0.22) : null;
  const reach = Number.isFinite(sp) ? (4.5 - (sp-40)*0.018).toFixed(2) : null;
  const pitchSpeed = fin && fin.speed ? fin.speed : null;
  const cell = (label,val,unit) => (val===null||val===undefined||val==='') ? '' :
    `<div><span>${label}</span><b>${esc(String(val))}<small>${unit}</small></b></div>`;
  const cells = cell('打球速度',batted,'km/h')+cell('走者速度',runSpeed,'km/h')+cell('一塁到達',reach,'s')+cell('球速',pitchSpeed,'km/h');
  return cells ? `<div class="lpv-statbar">${cells}</div>` : '';
}
// 配球チャート(小さめの補助表示): ゾーン＋球マーク＋メタ＋簡易ログ
function livePAMiniChart(chart, evt){

// 守備位置(フィールド%座標・固定) / 打球到達点 / 反応する守備
const LIVE_FIELDER_POS = {
  P:[50,50], C:[50,91], '1B':[69,55], '2B':[61,40], SS:[39,40], '3B':[31,55],
  LF:[27,25], CF:[50,15], RF:[73,25]
};
const LIVE_ZONE_LAND = {
  LF:[27,27], LC:[39,19], CF:[50,16], RC:[61,19], RF:[73,27],
  IF_L:[33,52], IF_C:[50,48], IF_R:[67,52]
};
const LIVE_ZONE_REACT = {
  LF:['LF','SS'], LC:['CF','LF'], CF:['CF'], RC:['CF','RF'], RF:['RF','2B'],
  IF_L:['3B','SS'], IF_C:['SS','2B'], IF_R:['1B','2B']
};
// 守備陣チップ(表示専用)。打球方向に応じて近い守備が動く。安打は届かず/凡打は捕る。
function livePAFielders(evt, hasBall, animate, reactDelay, ms){
  const order=['P','C','1B','2B','3B','SS','LF','CF','RF'];
  const zone = hasBall ? (evt.fieldZone || 'CF') : null;
  const imp = zone ? livePAImpactPoint(evt) : null;
  const land = imp ? [imp.x, imp.y] : null;
  let react = (zone && animate) ? (LIVE_ZONE_REACT[zone] || []).slice() : [];
  // 処理野手が判明している場合はその野手を最優先で反応させる(結果文と一致)
  if(zone && animate && evt.fieldedBy && LIVE_FIELDER_POS[evt.fieldedBy]){
    react = react.filter(p=>p!==evt.fieldedBy); react.unshift(evt.fieldedBy);
  }
  const id = evt.resultId;
  let primaryF=0, secondF=0;
  if(hasBall && animate){
    if(id==='1B'||id==='2B'||id==='3B'){ primaryF=0.62; secondF=0.42; } // 追うが届かない
    else if(id==='HR'){ primaryF=0.45; secondF=0.30; }                  // フェンス方向へ届かない
    else { primaryF=1.0; secondF=0.68; }                                // 凡打アウト: 捕る
  }
  return order.map(pos=>{
    const base=LIVE_FIELDER_POS[pos];
    const ri=react.indexOf(pos);
    if(ri>=0 && land){
      const f = ri===0 ? primaryF : secondF;
      const rx=+(base[0]+(land[0]-base[0])*f).toFixed(1);
      const ry=+(base[1]+(land[1]-base[1])*f).toFixed(1);
      const style=`--bx:${base[0]}%;--by:${base[1]}%;--rx:${rx}%;--ry:${ry}%;--rd:${(reactDelay||0).toFixed(2)}s;--fly:.48s;left:${base[0]}%;top:${base[1]}%`;
      const cls = `lpf-fielder react${ri===0?' primary':''}`;
      return `<span class="${esc(cls)}" style="${style}" title="${esc(pos)}">${livePAFielderChipHtml(ms,evt,pos,cls)}</span>`;
    }
    const cls = `lpf-fielder${pos==='P'||pos==='C'?' primary':''}`;
    return `<span class="${esc(cls)}" style="left:${base[0]}%;top:${base[1]}%" title="${esc(pos)}">${livePAFielderChipHtml(ms,evt,pos,cls)}</span>`;
  }).join('');
}
function renderLivePAStage(evt,opts){

function liveFSBaseText(bases){

function liveFSDetailBallText(evt){

  const parts = [zone[evt.fieldZone], depth[evt.depth], traj[evt.traj]].filter(Boolean);

function liveFSDetailBallRows(evt){

    const stRows = standings.map((t,i)=>`<div class="st-row${t.id==='us'?' us':''}"><span class="st-rank">${i+1}</span><span class="st-name">${esc(t.name)}</span><span class="st-wl num">${t.w}勝${t.l}敗${t.d?t.d+'分':''}</span><span class="st-pts num">${t.pts}</span></div>`).join('');
    const nextOpp = (!s.done && s.idx<s.schedule.length) ? s.schedule[s.idx] : null;
    const seasonAction = s.done
      ? `<button class="btn pri" onclick="nextSeason()">次のシーズンへ ▶</button>`
      : `<button class="btn pri" onclick="startSeasonGame()">第${s.idx+1}節 vs ${esc(NPC_TEAMS[nextOpp].name)} に出場</button>`;
    const options = Object.keys(NPC_TEAMS).map(id => `
      <button class="btn${UI.oppSel===id?' pri':''}" onclick="selectOpp('${id}')">${esc(NPC_TEAMS[id].name)}</button>`).join('');
    main.innerHTML = `
      <section class="panel"><div class="ph"><div><span class="eyebrow">SEASON ${s.no}</span><h2>銀河リーグ 順位表</h2></div><div class="sub">${rec.w}勝${rec.l}敗${rec.d?rec.d+'分':''} / 第${Math.min(s.idx+1,s.schedule.length)}節 (全${s.schedule.length}節)</div></div>
        <div class="standings"><div class="st-row st-head"><span class="st-rank">#</span><span class="st-name">チーム</span><span class="st-wl">成績</span><span class="st-pts">勝点</span></div>${stRows}</div>
        ${s.done?'<p class="note">全日程終了。次のシーズンへ進めます。</p>':''}
        <div class="btnrow">${seasonAction}</div>
      </section>
      <section class="panel"><div class="ph"><div><span class="eyebrow">練習試合</span><h2>対戦相手を選ぶ</h2></div><div class="sub">順位に影響しません</div></div>${options}
        <div class="btnrow"><button class="btn" onclick="startMatch(UI.oppSel)">練習試合開始</button></div>
      </section>
    `;
    return;
  }
  const ms = save.activeMatch;
  const pScore = pTot(ms);
  const nScore = nTot(ms);
  const score = `${pScore} - ${nScore}`;
  const isLead = pScore > nScore;
  const oppTeam = NPC_TEAMS[ms.oppId];
  // イニング表示
  const mbHalf = !ms.finished && typeof ms.score.p[ms.inning-1] === 'number' ? '裏' : '表';
  const inningText = ms.finished ? '試合終了' : `${ms.inning}回${mbHalf}`;
  const outsText = ms.finished ? '' : `${ms.outs}OUT`;
  // 試合終了結果
  const result = ms.finished ? `<div class="mb-result-wrap"><div class="mb-result-label ${ms.result.outcome==='win'?'win':ms.result.outcome==='lose'?'lose':'draw'}">${esc(ms.result.outcome==='win'?'🏆 WIN':ms.result.outcome==='lose'?'LOSE':'DRAW')}</div><div class="mb-result-stat"><span>最終スコア</span><strong>${score}</strong></div><div class="mb-result-stat"><span>相手チーム</span><strong>${esc(ms.result.oppName)}</strong></div><div class="mb-result-stat"><span>MVP</span><strong>${esc(ms.result.mvp||'—')}</strong></div><div class="mb-result-stat"><span>獲得CR</span><strong>+${ms.result.credits}</strong></div><div class="btnrow" style="margin-top:10px"><button class="btn pri" onclick="closeMatch()">試合を閉じる</button></div></div>` : '';
  // PA カード(フィールドビュー込み)
  const paCard = renderLastPACard(ms);
  // 常時表示の試合進行コントロール(直近打席の有無に関係なく必ず出す)
  const liveControls = ms.finished
    ? `<button class="btn pri" onclick="closeMatch()">試合を閉じる</button>`
    : `<button class="btn pri" onclick="UI.liveFxBurst=false;advanceOnePA()">次の打席へ ▶</button>`
      + `<button class="btn" onclick="UI.liveFxBurst=true;advanceToInningEnd()">イニング終了まで</button>`
      + `<button class="btn" onclick="UI.liveFxBurst=true;advanceToGameEnd()">試合終了まで</button>`
      + `<button class="btn" onclick="openLiveFullscreen()">全画面LIVE</button>`;
  // 演出レベルコントロール
  const fxControls = ['off','simple','full'].map(l=>`<button class="btn sm${liveFxLevel()===l?' pri':''}" onclick="setLiveFxLevel('${l}')">${liveFxLabel(l)}</button>`).join('');
  // ログ(直近エントリをテロップ風に)
  const logItems = ms.log.slice(-12);
  const logHtml = logItems.map(item => {
    const tagText = item.half!=='sys' ? halfLabel(item.inn,item.half) : '';
    const isImpact = /◆|ホームラン|逆転|同点|サヨナラ|勝利|得点/.test(item.text);
    return `<div class="mb-log-entry${isImpact?' impact':''}"><span class="mb-inn-tag">${esc(tagText)}</span>${esc(item.text)}</div>`;
  }).join('');
  main.innerHTML = `
    <div class="match-broadcast">
      ${!ms.finished ? `
      <div class="mb-scorebar">
        <div class="mb-team away">
          <small>AWAY</small>
          <b>${esc(oppTeam.name)}</b>
        </div>
        <div class="mb-score-center">
          <div class="mb-scorebox${isLead?' lead':''}">
            <span>${nScore}</span><i>-</i><span>${pScore}</span>
          </div>
          <div class="mb-situation">
            <span class="mb-live">LIVE</span>
            <span class="mb-inn">${inningText}</span>
            ${outsText?`<span class="mb-outs">${outsText}</span>`:''}
          </div>
        </div>
        <div class="mb-team home">
          <small>HOME</small>
          <b>${esc(save.team.name)}</b>
        </div>
      </div>` : ''}
      <div class="mb-controls">${liveControls}</div>
      ${result}
      ${paCard}
      <div class="mb-log-bar">${logHtml||'<div class="mb-log-entry">まだプレイされていません。</div>'}</div>
      <div class="mb-fx-bar"><span>演出:</span>${fxControls}</div>
    </div>
  `;
}

      if(evt.cine){
        html = renderCinematicStage(evt,ms);

        const effectBg = evt.type==='pinch' ? 'background:radial-gradient(circle at top, rgba(196,77,255,.18), transparent);' : evt.type==='homerun' ? 'background:radial-gradient(circle at top left, rgba(255,196,77,.18), transparent);' : '';

      </div>
    `;
  } else if(UI.modal.kind==='exploreChoice'){

        <div class="effect-card">
          <div class="effect-row"><span>遭遇</span><strong>${esc(pend.text)}</strong></div>

        <div class="ph"><div><span class="eyebrow">探索演出</span><h2>${esc(res.planet||'探索')}</h2></div></div>

      </div>
    `;
  } else if(UI.modal.kind==='matchResult'){
    const ms = save.activeMatch;

    const label = out.outcome==='win' ? 'WIN' : out.outcome==='lose' ? 'LOSE' : 'DRAW';
    const styleClass = out.outcome==='win' ? 'win' : out.outcome==='lose' ? 'lose' : 'draw';
    const score = ms ? `${pTot(ms)} - ${nTot(ms)}` : `${out.p||0} - ${out.n||0}`;

          <div class="rarity">${stars(pl.rarity)}</div>
          ${newTag}
          <div class="pl-name">${esc(pl.name)}</div>
          <div class="pl-details">${rarityChip(pl.rarity)}${typeChip(pl.type)}<span class="chip">${esc(roleName(pl.role))}</span><span class="mut">${esc(pl.pos.join('/'))}</span></div>
          <div class="pl-trait">${esc(typeTrait(pl.type))} / ${esc(roleTrait(pl.role))}</div>
          <p class="note">${esc(pl.pf)}</p>
        </div>
        <div class="btnrow"><button class="btn pri" onclick="closeModal()">閉じる</button></div>
      </div>
    `;
  }
  else {
    html = `<div class="mback" onclick="closeModal()"></div><div class="mbox"><p>情報がありません。</p><div class="btnrow"><button class="btn pri" onclick="closeModal()">閉じる</button></div></div>`;
  }
  root.className='show'; root.innerHTML=html;
}

  html += '</div>';
  html += '<div class="panel"><div class="ph"><div><span class="eyebrow">FACILITY</span><h2>施設レベル</h2></div></div>';
  html += `<div class="kv"><b>トレーニング場</b><span>Lv${save.facilities.training}</span></div>`;
  html += `<div class="kv"><b>データ解析室</b><span>Lv${save.facilities.analytics}</span></div>`;
  html += `<div class="kv"><b>素材工房</b><span>Lv${save.facilities.workshop}</span></div>`;
  html += '</div>';
  html += `<div class="panel"><div class="ph"><div><span class="eyebrow">FOCUS</span><h2>注目選手</h2></div></div><div class="side-mini">${focus}</div></div>`;
  side.innerHTML = html;
}

function render(){
  if(!save) save = loadSave();
  renderNav();
  if(UI.screen==='home') renderHome();
  else if(UI.screen==='lineup') renderLineup();
  else if(UI.screen==='players') renderPlayers();
  else if(UI.screen==='base') renderBase();
  else if(UI.screen==='match') renderMatch();
  else if(UI.screen==='explore') renderExplore();
  else if(UI.screen==='scout') renderScout();
  else if(UI.screen==='save') renderSave();
  else renderHome();
  renderSide();
  renderHRCinematic();
  renderLiveFullscreen();
  renderModal();
}

function toast(message){
  const toastEl = document.getElementById('toast');
  if(!toastEl) return;
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(UI.toastTimer);
  UI.toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2400);
}

document.addEventListener('DOMContentLoaded', ()=>{
  save = loadSave();
  render();
});
</script>
</body>
</html>
