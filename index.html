<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>銀河ベースボールGM v0.1</title>
<style>
/* ============================================================
   デザイントークン
   黒/濃紺ベース + シアン/青/紫の発光。ゴールドは重要演出のみ。
============================================================ */
:root{
  --bg:#05080f;
  --bg2:#0a1020;
  --panel:#0c1424;
  --panel2:#101b30;
  --line:rgba(72,180,255,.16);
  --line2:rgba(72,180,255,.32);
  --cy:#3fd9ff;
  --bl:#5a8bff;
  --pu:#a47bff;
  --tx:#d9e6f7;
  --mut:#7d90b0;
  --imp:#ffc44d;       /* ゴールド: 重要演出専用 */
  --imp2:#ff8a3d;      /* オレンジ: 重要演出専用 */
  --ok:#54e0a5;
  --warn:#ff7a6b;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(1px 1px at 12% 22%, rgba(190,225,255,.5), transparent 60%),
    radial-gradient(1px 1px at 68% 12%, rgba(190,225,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 64%, rgba(164,123,255,.4), transparent 60%),
    radial-gradient(1px 1px at 30% 80%, rgba(63,217,255,.35), transparent 60%),
    radial-gradient(1200px 700px at 70% -10%, #101d3a 0%, transparent 60%),
    linear-gradient(180deg,#070b16 0%, var(--bg) 100%);
  color:var(--tx);
  font-size:14px;
  line-height:1.55;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  overflow:hidden;
}
#app{
  display:grid;
  grid-template-columns:172px 1fr 312px;
  gap:10px;
  height:100dvh;
  padding:10px;
  padding-left:max(10px, env(safe-area-inset-left));
  padding-right:max(10px, env(safe-area-inset-right));
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
/* ---------- 左ナビ ---------- */
#nav{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.brand{
  border:1px solid var(--line2);border-radius:10px;padding:10px 10px 8px;
  background:linear-gradient(160deg,#0e1830,#0a1222);
}
.brand .eyebrow{font-size:9px;letter-spacing:.32em;color:var(--cy);font-family:var(--num)}
.brand .ttl{font-size:15px;font-weight:800;letter-spacing:.04em;line-height:1.3;
  background:linear-gradient(90deg,var(--cy),var(--bl) 55%,var(--pu));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .cr{margin-top:6px;font-family:var(--num);font-size:13px;color:var(--tx)}
.brand .cr small{color:var(--mut);font-size:10px;letter-spacing:.1em}
.navbtn{
  text-align:left;border:1px solid var(--line);border-radius:10px;
  background:rgba(12,20,36,.85);color:var(--tx);
  padding:11px 12px;font-size:13.5px;cursor:pointer;position:relative;
  display:flex;align-items:center;gap:8px;min-height:44px;width:100%;
}
.navbtn .ic{width:18px;text-align:center;opacity:.9}
.navbtn.on{
  border-color:var(--cy);color:#eaf8ff;
  background:linear-gradient(90deg, rgba(63,217,255,.14), rgba(90,139,255,.05));
  box-shadow:0 0 10px rgba(63,217,255,.18), inset 0 0 10px rgba(63,217,255,.06);
}
.badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:9px;letter-spacing:.1em;color:#06222c;background:var(--cy);
  border-radius:8px;padding:1px 7px;font-weight:700;
  box-shadow:0 0 8px rgba(63,217,255,.6);
}
.navfoot{margin-top:auto;font-size:10px;color:var(--mut);padding:4px 6px;line-height:1.5}
/* ---------- パネル共通 ---------- */
#main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
#side{overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{
  border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(170deg, var(--panel2), var(--panel));
  padding:14px;margin-bottom:10px;
}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ph .eyebrow{font-size:9px;letter-spacing:.3em;color:var(--cy);font-family:var(--num)}
.ph h2{font-size:15px;font-weight:800;letter-spacing:.05em}
.ph .sub{margin-left:auto;font-size:11px;color:var(--mut)}
h3.sec{font-size:12px;color:var(--bl);letter-spacing:.12em;margin:12px 0 6px;font-weight:700}
.mut{color:var(--mut);font-size:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.imp{color:var(--imp);text-shadow:0 0 8px rgba(255,196,77,.45)}
/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line2);border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#13223e,#0d1729);color:var(--tx);
  padding:10px 16px;font-size:13.5px;min-height:44px;font-weight:600;
}
.btn.pri{
  border-color:var(--cy);color:#04141c;font-weight:800;
  background:linear-gradient(180deg,#6fe6ff,#2db4dd);
  box-shadow:0 0 14px rgba(63,217,255,.35);
}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,122,107,.55);background:linear-gradient(180deg,#3a1720,#1b0d14);color:#ffd8d2;}
.btn.sm{min-height:34px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.35;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ---------- カード/チップ ---------- */
.chip{
  display:inline-block;font-size:10px;border:1px solid var(--line2);
  border-radius:6px;padding:1px 7px;color:var(--cy);letter-spacing:.06em;vertical-align:1px;
}
.chip.t-flame{color:#ff8d72;border-color:rgba(255,141,114,.4)}
.chip.t-ice{color:#7ad9ff;border-color:rgba(122,217,255,.4)}
.chip.t-machine{color:#9fb4ff;border-color:rgba(159,180,255,.4)}
.chip.t-gravity{color:#c08bff;border-color:rgba(192,139,255,.4)}
.chip.t-phantom{color:#ff9be0;border-color:rgba(255,155,224,.4)}
.stars{color:var(--imp);font-size:11px;letter-spacing:.1em}
.card{
  border:1px solid var(--line);border-radius:10px;background:rgba(10,17,32,.7);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
}
.news-item{
  border:1px solid rgba(72,180,255,.16);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  background:linear-gradient(180deg,rgba(63,217,255,.06),rgba(9,15,28,.95));
  font-size:13px;line-height:1.6;
}
.player-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.player-card{border:1px solid rgba(72,180,255,.16);border-radius:14px;background:linear-gradient(180deg,rgba(63,217,255,.08),rgba(9,15,28,.95));padding:12px;}
.player-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.player-top .badge{position:static;transform:none;background:rgba(255,196,77,.12);color:var(--imp);font-size:11px;padding:3px 8px;border-radius:999px;}
.player-name{font-size:16px;font-weight:800;margin-bottom:4px}
.player-title{font-size:12px;color:var(--mut);margin-bottom:8px}
.player-note{font-size:12px;color:var(--tx);line-height:1.5}
.players-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:10px;align-items:start}
.players-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.player-row{border:1px solid var(--line);border-radius:10px;background:rgba(9,15,28,.75);padding:10px;cursor:pointer;min-width:0}
.player-row.sel{border-color:var(--cy);box-shadow:0 0 12px rgba(63,217,255,.25);background:linear-gradient(90deg,rgba(63,217,255,.12),rgba(9,15,28,.75))}
.player-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.player-row-name{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:11px;margin-bottom:6px}
.player-exp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;font-family:var(--num);font-size:11px;margin:6px 0}
.stat-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px;font-size:11px;color:var(--mut)}
.stat-mini b{color:var(--tx);font-family:var(--num);font-weight:700}
.player-detail{position:sticky;top:0}
.detail-title{font-size:20px;font-weight:900;line-height:1.2;margin:4px 0 8px;overflow-wrap:anywhere}
.stat-block{display:grid;gap:6px;margin-top:10px}
.stat-block .gr .lbl{width:74px}
@media (max-width:980px){.players-layout{grid-template-columns:1fr}.player-detail{position:static}.players-list{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.players-list{grid-template-columns:1fr}}
.base-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:10px;align-items:start}
.facility-list,.material-list{display:grid;gap:8px}
.facility-card,.base-material-card{border:1px solid var(--line);border-radius:10px;background:rgba(9,15,28,.75);padding:12px;min-width:0}
.facility-head,.material-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.facility-name,.material-name{font-size:15px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.facility-state{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.need-list{display:grid;gap:4px;margin-top:8px}
.need-item{display:flex;justify-content:space-between;gap:10px;font-size:12px;border-bottom:1px dashed rgba(72,180,255,.08);padding-bottom:3px}
.need-item.ok{color:var(--ok)}
.need-item.miss{color:var(--warn)}
.status-pill{font-size:10.5px;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;color:var(--cy);white-space:nowrap}
.status-pill.ok{border-color:rgba(84,224,165,.45);color:var(--ok)}
.status-pill.miss{border-color:rgba(255,122,107,.45);color:var(--warn)}
.status-pill.max{border-color:rgba(255,196,77,.5);color:var(--imp)}
.material-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.material-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--mut)}
.material-meta b{color:var(--tx);font-family:var(--num)}
@media (max-width:1180px){.base-layout{grid-template-columns:1fr}}
@media (max-width:760px){.material-list{grid-template-columns:1fr}}
.side-mini{border:1px solid rgba(72,180,255,.12);border-radius:10px;background:rgba(9,15,28,.58);padding:9px 10px;margin-top:8px}
.side-player{display:grid;gap:3px;border-bottom:1px dashed rgba(72,180,255,.1);padding:7px 0}
.side-player:first-child{padding-top:0}
.side-player:last-child{border-bottom:none;padding-bottom:0}
.side-player-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.side-player-name{font-weight:800;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-player-tag{font-size:10px;color:var(--cy);font-family:var(--num);white-space:nowrap}
.side-player-meta{font-size:11px;color:var(--mut);line-height:1.45}
.card.sel{border-color:var(--cy);box-shadow:0 0 10px rgba(63,217,255,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* ---------- スロット(編成) ---------- */
.slot{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;background:rgba(9,15,28,.75);padding:8px 10px;margin-bottom:6px;
  min-height:48px;cursor:pointer;
}
.slot .no{font-family:var(--num);color:var(--bl);width:20px;text-align:right;font-size:13px}
.slot .nm{font-weight:700;font-size:13.5px}
.slot .pos{
  font-family:var(--num);font-size:11px;border:1px solid var(--line2);border-radius:6px;
  padding:2px 7px;color:var(--cy);cursor:pointer;min-width:36px;text-align:center;
}
.slot .warnp{color:var(--warn);font-size:11px}
.slot .tail{margin-left:auto;display:flex;align-items:center;gap:6px}
.slot.sel{border-color:var(--cy);box-shadow:0 0 12px rgba(63,217,255,.28);background:linear-gradient(90deg,rgba(63,217,255,.12),rgba(9,15,28,.75))}
.lineup-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}
.lineup-pool{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lineup-pool .btn{justify-content:flex-start;min-height:40px;padding:8px 10px;font-size:12px}
.pos-select{background:#08111f;color:var(--tx);border:1px solid var(--line2);border-radius:7px;min-height:30px;padding:3px 6px;font-family:var(--num)}
@media (max-width:760px){.lineup-layout{grid-template-columns:1fr}.lineup-pool{grid-template-columns:1fr}}
.rolechip{
  font-size:10.5px;border:1px solid rgba(164,123,255,.45);color:var(--pu);
  border-radius:6px;padding:2px 8px;cursor:pointer;
}
/* ---------- ゲージ ---------- */
.gauge{height:8px;border-radius:5px;background:#0a1222;border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--cy));border-radius:5px}
.gauge.low i{background:linear-gradient(90deg,#a04a3c,var(--warn))}
.gr{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.gr .lbl{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gauge{flex:1}
.gr .val{width:34px;text-align:right}
/* ---------- スコアボード ---------- */
.broadcast{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
  font-family:var(--num);font-size:10px;letter-spacing:.28em;color:var(--cy);
}
.broadcast .live{
  background:linear-gradient(90deg,var(--bl),var(--pu));color:#fff;
  transform:skewX(-12deg);padding:2px 10px;border-radius:3px;letter-spacing:.2em;font-weight:700;
}
.broadcast .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
table.sb{width:100%;border-collapse:collapse;font-family:var(--num);font-size:12.5px}
table.sb th,table.sb td{
  border:1px solid var(--line);padding:4px 2px;text-align:center;min-width:24px;
}
table.sb th{color:var(--mut);font-weight:400;font-size:10px}
table.sb td.tm{text-align:left;padding-left:8px;min-width:86px;font-family:inherit;font-size:12px;font-weight:700}
table.sb td.rh{color:var(--cy);font-weight:700}
table.sb td.cur{background:rgba(63,217,255,.12)}
/* ---------- ダイヤモンド ---------- */
.field{position:relative;width:170px;height:130px;margin:10px auto 4px}
.fline{
  position:absolute;left:50%;top:62%;width:92px;height:92px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid rgba(63,217,255,.35);
  background:linear-gradient(135deg, rgba(63,217,255,.05), transparent);
}
.base{
  position:absolute;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid var(--cy);background:#0a1222;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx);
}
.base.on{background:var(--cy);box-shadow:0 0 14px rgba(63,217,255,.9);}
.fmeta{text-align:center;font-size:12px;color:var(--mut);display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.field-card{border:1px solid rgba(63,217,255,.14);border-radius:14px;padding:12px;background:linear-gradient(180deg,rgba(63,217,255,.06),rgba(10,17,32,.96));margin:10px 0}
.field-card .fmeta{font-size:12px;color:var(--tx);}
.reward-card{border:1px solid rgba(255,196,77,.18);border-radius:12px;background:rgba(255,196,77,.06);padding:10px;margin:10px 0;color:#fff;font-size:13px}
.log-sep{padding:8px 0 4px;color:var(--cy);font-size:12px;font-weight:700;border-bottom:1px solid rgba(63,217,255,.16);margin-top:10px}
.log-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(63,217,255,.15);color:var(--cy);margin-right:6px}
.log p{padding:8px 0 6px;border-bottom:1px dashed rgba(72,180,255,.08);transition:color .2s,transform .2s}
.log{
  font-size:12px;line-height:1.65;max-height:46vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text;
  padding-right:4px;
}
.log p{padding:8px 0 6px;border-bottom:1px dashed rgba(72,180,255,.08);transition:color .2s,transform .2s}
.log p strong{color:var(--tx)}
.log p.impact{color:#b9f7ff;font-weight:700;text-shadow:0 0 8px rgba(63,217,255,.35)}
.log p.impact::before{content:'◆';margin-right:6px;color:var(--imp)}
.log p.sysl{color:var(--pu)}
.log p.final{padding-bottom:10px;margin-top:4px;border-color:rgba(255,196,77,.25)}
.tip-list{display:grid;gap:8px;margin-top:8px}
.tip-item{border:1px solid rgba(72,180,255,.16);border-radius:10px;background:linear-gradient(180deg,rgba(63,217,255,.08),rgba(12,20,36,.9));padding:12px;display:flex;align-items:flex-start;gap:10px}
.tip-item .marker{width:8px;height:8px;border-radius:50%;background:var(--cy);margin-top:5px;flex-shrink:0}
.tip-item strong{display:block;color:#eaf8ff;margin-bottom:4px}
.match-result{border:1px solid rgba(255,196,77,.25);border-radius:14px;padding:14px;background:rgba(255,221,146,.06);box-shadow:0 0 18px rgba(255,196,77,.15)}
.match-result .label{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:rgba(255,196,77,.12);color:var(--imp);font-weight:700;margin-bottom:10px}
.match-result .label.win{background:rgba(63,217,255,.18);color:#b9f7ff}
.match-result .label.lose{background:rgba(255,122,107,.14);color:var(--warn)}
.match-result .label.draw{background:rgba(148,132,255,.14);color:var(--pu)}
.match-result .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,196,77,.18)}
.match-result .stat:last-child{border-bottom:none}
.pa-card{border:1px solid rgba(63,217,255,.28);border-radius:12px;background:linear-gradient(180deg,rgba(63,217,255,.1),rgba(9,15,28,.96));padding:12px;margin:10px 0;box-shadow:0 0 14px rgba(63,217,255,.1)}
.pa-card .pa-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.pa-card .pa-head strong{font-size:15px;color:#eef7ff}
.pa-card .pa-result{font-size:16px;font-weight:900;color:var(--imp);line-height:1.35;margin:8px 0}
.live-result-banner{display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;margin:4px 0 8px;padding:8px 12px;border-radius:8px;border:1px solid rgba(63,217,255,.24);background:linear-gradient(90deg,rgba(63,217,255,.14),rgba(255,255,255,.04));font-family:var(--num);font-size:clamp(24px,3.6vw,38px);font-weight:950;line-height:1;letter-spacing:0;color:#f3fdff;text-shadow:0 0 16px rgba(63,217,255,.42);box-shadow:inset 0 0 20px rgba(63,217,255,.06);animation:liveResultPop .42s ease-out var(--pa-callout-delay,var(--result-delay,1.9s)) both}
.live-result-banner.gold{border-color:rgba(255,196,77,.56);background:linear-gradient(90deg,rgba(255,196,77,.24),rgba(255,138,61,.08));color:var(--imp);text-shadow:0 0 18px rgba(255,196,77,.58);box-shadow:0 0 18px rgba(255,196,77,.16),inset 0 0 24px rgba(255,196,77,.08)}
.live-result-banner.out{border-color:rgba(255,122,107,.5);background:linear-gradient(90deg,rgba(255,122,107,.2),rgba(255,255,255,.03));color:#ffd8d2;text-shadow:0 0 16px rgba(255,122,107,.46)}
.live-result-banner.safe{border-color:rgba(84,224,165,.42);background:linear-gradient(90deg,rgba(84,224,165,.18),rgba(63,217,255,.08));color:#eafff7;text-shadow:0 0 16px rgba(84,224,165,.38)}
@keyframes liveResultPop{0%{opacity:0;transform:translateY(7px) scale(.88)}60%{opacity:1;transform:translateY(0) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
.pa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:12px}
.pa-grid .kv{border-bottom:1px dashed rgba(72,180,255,.1)}
.pa-move{font-size:12px;color:#d9e6f7;line-height:1.6;margin-top:8px}
.pa-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.live-pa-stage.anim-simple .lpv-pitch{animation-duration:.32s}
/* --- フィールド内ピッチトンネル(主役) --- */
.live-pa-szone{position:absolute;left:36%;top:63%;width:28%;height:21.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:1px solid rgba(210,235,255,.5);border-radius:2px;background:rgba(63,217,255,.06);box-shadow:inset 0 0 12px rgba(63,217,255,.14);z-index:3;pointer-events:none}
.live-pa-szone span{border-right:1px solid rgba(210,235,255,.13);border-bottom:1px solid rgba(210,235,255,.13)}
.live-pa-szone span:nth-child(3n){border-right:none}.live-pa-szone span:nth-child(n+7){border-bottom:none}
.live-pa-mound{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff8dc 0 28%,#d39555 29% 62%,rgba(80,42,18,.82) 63%);box-shadow:0 2px 6px rgba(0,0,0,.38),0 0 8px rgba(255,215,144,.34);z-index:5;pointer-events:none}
/* 判定=色 (球種ではなく判定で色分け) */
.j-strike{--jc:#3fd9ff}.j-ball{--jc:#ffcf3a}.j-foul{--jc:#a47bff}.j-inplay{--jc:#eaf8ff}.j-out{--jc:#ff7a6b}.j-hbp{--jc:#ff9d5c}.j-score{--jc:#ffc44d}
/* 軌道線(残像) */
.lpf-trail{position:absolute;left:50%;top:50%;height:0;width:var(--tl-len,30%);border-top:1.5px solid var(--jc,#3fd9ff);transform:rotate(var(--tl-rot,90deg));transform-origin:left center;opacity:.28;z-index:3;pointer-events:none;animation:lpfTrail var(--fly,.4s) ease-out var(--pd,0s) both}
.lpf-trail.final{border-top-width:2px}
@keyframes lpfTrail{0%{opacity:0;clip-path:inset(0 100% 0 0)}25%{opacity:.5}100%{opacity:.28;clip-path:inset(0 0 0 0)}}
/* 球マーク: 形=球種 / 色=判定 */
.lpf-pitch{position:absolute;left:var(--tx);top:var(--ty);width:14px;height:14px;transform:translate(-50%,-50%);background:var(--jc,#3fd9ff);z-index:6;pointer-events:none;filter:drop-shadow(0 0 3px var(--jc,#3fd9ff));animation:lpvPitch var(--fly,.4s) cubic-bezier(.3,.55,.32,1) var(--pd,0s) both}
.lpf-pitch.final{width:18px;height:18px;z-index:7;filter:drop-shadow(0 0 6px var(--jc,#ffc44d))}
.sh-straight{border-radius:50%}
.sh-sinker{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.sh-slider{clip-path:polygon(0 50%,100% 0,100% 100%)}
.sh-curve{clip-path:polygon(50% 100%,0 0,100% 0)}
.sh-fork{clip-path:polygon(50% 100%,6% 16%,26% 0,50% 50%,74% 0,94% 16%)}
.sh-change{background:transparent;border:2.5px solid var(--jc,#3fd9ff);border-radius:50%}
.sh-change::after{content:'';position:absolute;left:50%;top:50%;width:36%;height:36%;border-radius:50%;transform:translate(-50%,-50%);background:var(--jc,#3fd9ff)}
.live-pa-stage.anim-off .lpf-pitch{animation:none}
.live-pa-stage.anim-simple .lpf-pitch,.live-pa-stage.anim-simple .lpf-trail{animation-duration:.3s}
/* --- 配球チャート(小さめの脇役) --- */
.lpa-aside{display:flex;flex-direction:column;gap:7px;min-width:0}
.lpa-zonewrap{position:relative;width:100%;max-width:158px;aspect-ratio:1;margin:0 auto}
.lpa-zone{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);border-radius:6px;overflow:hidden;background:rgba(3,8,16,.6);border:1px solid rgba(72,180,255,.18)}
.lpa-cell{border-right:1px solid rgba(72,180,255,.06);border-bottom:1px solid rgba(72,180,255,.06)}
.lpa-cell.s{background:rgba(63,217,255,.06)}
.lpa-mark{position:absolute;width:11px;height:11px;transform:translate(-50%,-50%);background:var(--jc,#3fd9ff);filter:drop-shadow(0 0 2px var(--jc,#3fd9ff));z-index:2}
.lpa-mark.final{width:15px;height:15px;z-index:3;filter:drop-shadow(0 0 4px var(--jc,#ffc44d))}
.lpa-list{display:grid;gap:2px;font-size:10px}
.lpa-row{display:grid;grid-template-columns:15px 1fr 1fr 32px;gap:5px;align-items:center;border-bottom:1px dashed rgba(72,180,255,.08);padding:1px 0}
.lpa-row.f{font-weight:800;color:#fff}
.lpa-row .num{text-align:right}
.lpa-no{font-family:var(--num);color:var(--mut)}
.lpa-call{color:var(--jc,#cfe6ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpa-ty{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* --- 守備陣・打者走者・結果コールアウト(表示専用) --- */
.lpf-fielder{position:absolute;left:var(--bx,50%);top:var(--by,50%);transform:translate(-50%,-50%);min-width:26px;min-height:30px;display:grid;place-items:center;font-family:var(--num);font-size:8px;font-weight:800;color:#bcd0ea;z-index:4;pointer-events:none}
.lpf-fielder .lpf-avatar{position:relative;display:grid;place-items:center;min-width:24px;min-height:26px;padding:2px 4px;border-radius:10px 10px 12px 12px;background:linear-gradient(180deg,rgba(35,78,124,.96),rgba(9,21,42,.94));border:1px solid rgba(140,200,255,.5);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 10px rgba(63,217,255,.16);animation:lpfIdle 2.4s ease-in-out infinite}
.lpf-fielder .chip-no{font-size:11px;font-weight:950;line-height:1;color:#fff}
.lpf-fielder .chip-pos{font-size:8px;line-height:1;color:#9edcff;letter-spacing:.02em}
.lpf-fielder .chip-name{display:none;position:absolute;left:50%;top:100%;transform:translate(-50%,2px);max-width:56px;padding:1px 5px;border-radius:999px;background:rgba(3,8,16,.9);border:1px solid rgba(120,200,255,.24);font-family:var(--sans);font-size:8px;color:#eaf8ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpf-fielder.primary .lpf-avatar,.lpf-fielder.react.primary .lpf-avatar{border-color:rgba(255,215,106,.72);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 16px rgba(255,196,77,.38)}
.lpf-fielder.react .lpf-avatar{border-color:rgba(63,217,255,.72);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 14px rgba(63,217,255,.32)}
.live-pa-stage.anim-full .lpf-fielder[title="P"].primary .lpf-avatar{animation:lpfIdle 2.4s ease-in-out infinite,lpfPitcherCue .46s ease-out var(--pa-pitcher-delay,0s) both}
.live-pa-stage.anim-full .live-pa-home{animation:lpfBatterCue .42s ease-out var(--pa-pitcher-delay,0s) both}
.mode-full .lpf-fielder .chip-name,.mode-cine .lpf-fielder.primary .chip-name{display:block}
.lpf-fielder.react{animation:lpfFielderMove var(--fly,.48s) cubic-bezier(.3,.6,.3,1) var(--rd,0s) both}
@keyframes lpfFielderMove{0%{left:var(--bx);top:var(--by)}100%{left:var(--rx);top:var(--ry)}}
@keyframes lpfIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes lpfPitcherCue{0%{filter:brightness(1);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 10px rgba(255,196,77,.12)}42%{filter:brightness(1.35);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 22px rgba(255,196,77,.62)}100%{filter:brightness(1);box-shadow:0 5px 9px rgba(0,0,0,.38),0 0 16px rgba(255,196,77,.38)}}
@keyframes lpfBatterCue{0%{box-shadow:0 0 10px rgba(255,255,255,.22)}48%{box-shadow:0 0 20px rgba(255,196,77,.74);background:#fff4c2}100%{box-shadow:0 0 10px rgba(255,255,255,.22)}}
.live-pa-stage.anim-off .lpf-fielder.react{animation:none;left:var(--bx);top:var(--by)}
.lpf-callout{position:absolute;transform:translate(-50%,-50%);font-family:var(--num);font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;z-index:8;pointer-events:none;opacity:0;animation:lpfCallout .5s ease-out var(--cd,1s) both}
.lpf-callout.hit{color:#04141c;background:var(--cy);box-shadow:0 0 10px rgba(63,217,255,.6)}
.lpf-callout.out{color:#1d0504;background:var(--warn);box-shadow:0 0 10px rgba(255,122,107,.6)}
.lpf-callout.hr{color:#1d1300;background:var(--imp);box-shadow:0 0 14px rgba(255,196,77,.7)}
.lpf-callout.safe{color:#04141c;background:var(--ok);box-shadow:0 0 10px rgba(84,224,165,.6)}
@keyframes lpfCallout{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.live-pa-stage.anim-off .lpf-callout{opacity:1;animation:none}
/* 走者チップを少し大きく見やすく */
.live-pa-runner{font-size:10px;max-width:78px}
.live-pa-move-chip{font-size:10px}
/* ライブ窓直下の操作ボタン(スクロール不要) */
.pa-live-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.pa-live-actions .btn{flex:1 1 auto;min-width:96px}
/* --- %ベース打球(共通座標: 打球線/着弾/守備/コールアウトと一致) --- */
.lpb-trace{position:absolute;left:var(--hx,50%);top:var(--hy,84%);height:0;width:var(--len,40%);border-top:2px solid var(--bc,#eaf8ff);transform:rotate(var(--rot,-90deg));transform-origin:left center;opacity:.55;z-index:4;pointer-events:none;box-shadow:0 0 6px var(--bc,#eaf8ff);animation:lpbTrace var(--bdur,.6s) ease-out var(--bdelay,.65s) both}
.lpb-trace.grounder{border-top-style:dashed;opacity:.45}
.lpb-ball{position:absolute;left:var(--tx,50%);top:var(--ty,40%);width:9px;height:9px;border-radius:50%;background:#fff7d1;transform:translate(-50%,-50%);z-index:6;pointer-events:none;box-shadow:0 0 10px rgba(255,247,209,.85);opacity:1;animation:lpbBall3d var(--bdur,.6s) cubic-bezier(.2,.7,.35,1) var(--bdelay,.65s) both}
.lpb-shadow{position:absolute;left:var(--tx,50%);top:var(--ty,40%);width:12px;height:5px;border-radius:50%;background:rgba(0,0,0,.5);transform:translate(-50%,-50%);filter:blur(1px);opacity:.42;z-index:3;pointer-events:none;animation:lpbShadow var(--bdur,.6s) ease-out var(--bdelay,.65s) both}
.lpb-shadow.grounder{opacity:.3}
@keyframes lpbShadow{0%{left:var(--hx);top:var(--hy);opacity:0}15%{opacity:.42}100%{left:var(--tx);top:var(--ty);opacity:.42}}
.lpb-land{position:absolute;left:var(--tx,50%);top:var(--ty,40%);width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:var(--bc,#eaf8ff);transform:translate(-50%,-50%);z-index:5;pointer-events:none;opacity:.82;animation:lpbLand .4s ease-out var(--ldelay,1.25s) both}
@keyframes lpbTrace{0%{opacity:0;clip-path:inset(0 100% 0 0)}25%{opacity:.9}100%{opacity:.55;clip-path:inset(0 0 0 0)}}
@keyframes lpbBall3d{0%{left:var(--hx);top:var(--hy);opacity:0;transform:translate(-50%,-50%) translateZ(0)}12%{opacity:1}50%{left:var(--mx);top:var(--my);transform:translate(-50%,-50%) translateZ(var(--peakz,40px))}100%{left:var(--tx);top:var(--ty);opacity:1;transform:translate(-50%,-50%) translateZ(0)}}
@keyframes lpbLand{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
/* 返球線 */
.lpt-throw{position:absolute;height:0;width:var(--len,30%);border-top:2px dashed rgba(120,200,255,.85);transform:rotate(var(--rot,0deg));transform-origin:left center;opacity:0;z-index:5;pointer-events:none;box-shadow:0 0 6px rgba(120,200,255,.5);animation:lptThrow .42s ease-out var(--tdelay,1.45s) both}
@keyframes lptThrow{0%{opacity:0;clip-path:inset(0 100% 0 0)}30%{opacity:1}100%{opacity:.55;clip-path:inset(0 0 0 0)}}
.live-pa-stage.anim-off .lpt-throw{opacity:.5}
.live-pa-field.is-score{box-shadow:inset 0 0 26px rgba(255,196,77,.22)}
.live-pa-field.is-score .live-pa-home{background:var(--imp);border-color:#fff2bd;box-shadow:0 0 18px rgba(255,196,77,.78)}
/* --- 3Dフィールド(放送カメラ風の傾き。面ごと傾けて座標/アニメは不変) --- */
.live-pa-field.field3d{transform:rotateX(22deg);transform-style:preserve-3d;overflow:visible;transform-origin:50% 80%;margin-top:4px;margin-bottom:-7%;box-shadow:0 18px 30px rgba(0,0,0,.45),inset 0 0 26px rgba(63,217,255,.06)}
.live-pa-field.field3d.is-score{box-shadow:0 18px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(255,196,77,.24)}
.live-pa-stage.mode-cine{perspective:1300px}
.mode-cine .live-pa-field.field3d{transform:rotateX(26deg);margin-bottom:-9%;box-shadow:0 26px 44px rgba(0,0,0,.5),inset 0 0 34px rgba(63,217,255,.08)}
/* フェーズ2: 人(野手・走者)を地面から起こすビルボード(カメラ正対)。地面要素は寝かせたまま。 */
.field3d .lpf-fielder{transform:translate(-50%,-86%) translateZ(7px) rotateX(-22deg);transform-origin:50% 100%}
.field3d .live-pa-runner{transform:translate(-50%,-86%) translateZ(9px) rotateX(-22deg);transform-origin:50% 100%}
.mode-cine .field3d .lpf-fielder{transform:translate(-50%,-86%) translateZ(7px) rotateX(-26deg)}
.mode-cine .field3d .live-pa-runner{transform:translate(-50%,-86%) translateZ(9px) rotateX(-26deg)}
.field3d .lpf-fielder::after,.field3d .live-pa-runner::after{content:'';position:absolute;left:50%;bottom:-4px;width:13px;height:4px;border-radius:50%;background:rgba(0,0,0,.5);transform:translateX(-50%);filter:blur(1px);z-index:-1;pointer-events:none}
@media (max-width:760px){.live-pa-field.field3d{transform:rotateX(18deg);margin-bottom:-5%}.mode-cine .live-pa-field.field3d{transform:rotateX(20deg)}}
/* --- キャラ感: 走者チップ強化 --- */
.live-pa-move-chip{animation-duration:var(--rdur,.52s)}
.live-pa-move-chip.ours{border-color:rgba(63,217,255,.7);color:#eafcff}
.live-pa-move-chip.batter{border-color:rgba(255,196,77,.85);color:#fff7e0;background:rgba(42,30,8,.92);box-shadow:0 0 11px rgba(255,196,77,.5)}
.live-pa-move-chip.star{box-shadow:0 0 13px rgba(164,123,255,.62)}
.live-pa-move-chip.star::before{content:'';position:absolute;inset:-3px;border-radius:999px;border:1px solid rgba(164,123,255,.55);opacity:.7;pointer-events:none}
/* 接触フラッシュ(パワーで強さが変わる) */
.lpb-contact{position:absolute;left:50%;top:82%;width:calc(14px + var(--pw,0)*16px);height:calc(14px + var(--pw,0)*16px);border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,247,209,.95),rgba(255,196,77,.25) 55%,transparent 72%);opacity:0;z-index:6;pointer-events:none;animation:lpbContact .3s ease-out var(--cdelay,.34s) both}
@keyframes lpbContact{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:calc(.5 + var(--pw,0)*.5);transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
/* 捕球フラッシュ(アウト時、着弾点で光る) */
.lpb-catch{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(120,200,255,.9);box-shadow:0 0 12px rgba(120,200,255,.6);opacity:0;z-index:6;pointer-events:none;animation:lpbCatch .42s ease-out var(--kdelay,.9s) both}
@keyframes lpbCatch{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}45%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
/* パワー打者の打球発光 */
.lpb-ball{box-shadow:0 0 calc(8px + var(--pw,0)*12px) rgba(255,247,209,.85)}
/* 重要場面フラッシュ(cinematicのみ) */
.lpf-flash{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 70%,rgba(255,196,77,.5),transparent 60%)}
.lpf-flash.score{background:radial-gradient(circle at 50% 70%,rgba(63,217,255,.42),transparent 60%)}
.lpf-flash.hr,.lpf-flash.score{animation:lpfFlash .75s ease-out .5s both}
@keyframes lpfFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* --- 重要場面(cinematic)モード: 大きく・明るく --- */
.cine-fieldwrap{display:flex;justify-content:center;width:100%}
.live-pa-stage.mode-cine{border:none;background:transparent;padding:0;width:100%;margin:0}
.live-pa-stage.mode-cine .live-pa-field{max-width:min(58vh,460px)}
.live-pa-stage.mode-full{position:relative;border:none;background:transparent;padding:0;width:100%;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);align-items:stretch;justify-content:stretch;gap:8px;perspective:1500px;min-height:0}
.live-pa-stage.mode-full .live-pa-field{width:auto;height:auto;aspect-ratio:1;max-width:min(58vh,500px);max-height:58vh;margin:0 auto;border-radius:50%}
.live-pa-stage.replay-no-batted-ball{perspective-origin:50% 58%}
.live-pa-stage.replay-no-batted-ball .live-pa-field.field3d{transform:rotateX(18deg);transform-origin:50% 72%;margin:0 auto;max-width:min(54vh,470px);max-height:54vh}
.live-pa-stage.replay-no-batted-ball .lpb-trace,.live-pa-stage.replay-no-batted-ball .lpb-shadow,.live-pa-stage.replay-no-batted-ball .lpb-ball,.live-pa-stage.replay-no-batted-ball .lpb-land,.live-pa-stage.replay-no-batted-ball .lpb-contact,.live-pa-stage.replay-no-batted-ball .lpb-catch,.live-pa-stage.replay-no-batted-ball .lpt-throw{display:none!important}
.live-pa-stage.replay-no-batted-ball .live-pa-szone{border-color:rgba(255,255,255,.62);box-shadow:0 0 18px rgba(63,217,255,.22),inset 0 0 12px rgba(63,217,255,.18);background:rgba(3,8,18,.42)}
.live-pa-stage.replay-no-batted-ball .live-pa-pitch-line{border-top-width:2px;opacity:.86}
.live-pa-stage.replay-no-batted-ball .lpf-callout{left:50%!important;top:74%!important;font-size:15px;padding:4px 14px}
.mode-full.replay-no-batted-ball .live-pa-field.field3d{transform:rotateX(18deg);transform-origin:50% 72%;max-width:min(54vh,480px);max-height:54vh;margin:0 auto}
.mode-full .lpf-replay-frame{position:relative;width:100%;height:100%;min-height:min(390px,52vh);border:1px solid rgba(63,217,255,.18);border-radius:18px;overflow:hidden;background:radial-gradient(80% 74% at 50% 18%,rgba(63,217,255,.12),transparent 58%),linear-gradient(180deg,rgba(1,4,11,.98),rgba(4,10,20,.96));box-shadow:0 22px 48px rgba(0,0,0,.42),inset 0 0 32px rgba(63,217,255,.06)}
.mode-full .lpf-camera{position:absolute;inset:0;display:grid;place-items:center;transform:none;animation:none}
.mode-full .live-pa-field.field3d{transform:rotateX(26deg);transform-origin:50% 82%;margin:0 auto;background:radial-gradient(ellipse at 50% 80%,rgba(184,113,54,.5) 0 20%,transparent 21%),radial-gradient(ellipse at 50% 46%,rgba(29,118,82,.5) 0 58%,transparent 59%),linear-gradient(180deg,rgba(2,7,16,.96),rgba(4,18,26,.97));box-shadow:0 22px 44px rgba(0,0,0,.55),inset 0 0 40px rgba(63,217,255,.1)}
.mode-full .lpf-fence{border-top-width:11px;box-shadow:0 -2px 0 rgba(117,238,255,.32),inset 0 16px 22px rgba(0,0,0,.34)}
.mode-full .lpf-grass{opacity:.66;background-size:auto}
.mode-full .lpf-dirt{background:linear-gradient(135deg,rgba(190,122,58,.52),rgba(118,74,38,.24));box-shadow:inset 0 0 24px rgba(65,35,14,.24)}
.mode-full .lpf-foul-line{border-top-width:2px}
.mode-full .lpf-mound-ring{width:44px;height:28px}
.mode-full .live-pa-mound{width:13px;height:13px}
.mode-full .lpf-stadium-light{opacity:.46}
.mode-full .live-pa-base{width:22px;height:22px}
.mode-full .live-pa-home{font-size:10px;padding:2px 6px}
.mode-full .lpv-statbar{max-width:680px;margin:0 auto}
.mode-full .lpv-statbar b{font-size:24px}
.mode-full .lpf-callout{font-size:17px;padding:3px 14px}
.mode-full .live-pa-move-chip{font-size:13px;padding:5px 10px;max-width:96px}
.mode-full .live-pa-runner{font-size:12px;max-width:96px;min-width:36px}
.mode-full .lpf-fielder .lpf-avatar{min-width:32px;min-height:34px}
.mode-full .lpf-fielder .chip-no{font-size:14px}
.mode-full .lpf-fielder .chip-pos{font-size:9px}
.mode-full .lpf-fielder .chip-name{font-size:9px;max-width:72px}
.mode-full .live-pa-runner .chip-no{font-size:13px}
.mode-full .live-pa-runner .chip-name{font-size:9px;max-width:78px}
.mode-full .lpb-trace{border-top-width:6px;opacity:.78;box-shadow:0 0 18px var(--bc)}
.mode-full .lpb-trace.fly,.mode-full .lpb-trace.homer{border-top-width:5px}
.mode-full .lpb-ball{width:18px;height:18px;box-shadow:0 0 26px rgba(255,247,209,.98)}

.pitch-card{margin-top:10px;border-top:1px solid rgba(72,180,255,.14);padding-top:10px;display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:start}

.scout-card{border:1px solid rgba(255,196,77,.2);border-radius:14px;background:linear-gradient(180deg,rgba(255,196,77,.06),rgba(12,20,36,.9));padding:16px;margin:12px 0;position:relative;overflow:hidden}
.scout-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right, rgba(255,196,77,.22), transparent 35%);opacity:.8;pointer-events:none}
.scout-card .rarity{font-family:var(--num);letter-spacing:.18em;color:var(--imp);margin-bottom:8px}
.scout-card .newtag{display:inline-block;padding:3px 8px;border-radius:999px;background:rgba(63,217,255,.18);color:#b9f7ff;font-size:11px;font-weight:700;margin-bottom:8px}
.scout-card .dupetag{display:inline-block;padding:3px 8px;border-radius:999px;background:rgba(255,122,107,.18);color:var(--warn);font-size:11px;font-weight:700;margin-bottom:8px}

/* --- 選手アイデンティティ表示(P1) --- */
.rchip{display:inline-block;font-family:var(--num);font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.06em;border:1px solid var(--line2);color:var(--mut);vertical-align:1px}

.standings{display:grid;gap:3px;margin:6px 0}

.cine-bigr{position:relative;z-index:2;grid-column:1/-1;margin:-2px 0 2px;font-family:var(--num);font-size:clamp(32px,6vw,68px);line-height:.95;font-weight:950;text-align:center;color:#f3fdff;text-shadow:0 0 22px rgba(63,217,255,.46);letter-spacing:0;pointer-events:none;animation:cineBigResult .42s ease-out 1.65s both}
.cine-bigr.gold{color:var(--imp);text-shadow:0 0 26px rgba(255,196,77,.66)}
.cine-bigr.out{color:#ffd8d2;text-shadow:0 0 22px rgba(255,122,107,.58)}
.cine-bigr.safe{color:#efffff;text-shadow:0 0 22px rgba(84,224,165,.42)}
@keyframes cineBigResult{0%{opacity:0;transform:translateY(8px) scale(.86)}60%{opacity:1;transform:translateY(0) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
.cine-current{font-family:var(--num);font-size:18px;color:#dff8ff;font-weight:900;}
.cine-subline{font-size:13px;color:#c9d8ee;line-height:1.55;overflow-wrap:anywhere;}
.cine-field{position:relative;z-index:1;align-self:center;justify-self:center;width:236px;height:236px;border-radius:50%;overflow:hidden;background:
  radial-gradient(ellipse at 50% 77%, rgba(157,106,54,.42) 0 23%, transparent 24%),
  radial-gradient(ellipse at 50% 43%, rgba(38,126,92,.38) 0 61%, transparent 62%),
  radial-gradient(circle at 50% 66%, rgba(63,217,255,.12), transparent 58%),
  linear-gradient(180deg,rgba(6,28,32,.9),rgba(5,13,26,.95));border:1px solid rgba(63,217,255,.16);}
.cine-field::before{content:'';position:absolute;left:12%;top:10%;width:76%;height:72%;border-top:2px solid rgba(63,217,255,.16);border-radius:50%;pointer-events:none;}
.cine-field::after{content:'';position:absolute;left:50%;top:83%;width:158px;height:158px;transform:translate(-50%,-50%) rotate(45deg);border-left:1px solid rgba(210,235,255,.28);border-top:1px solid rgba(210,235,255,.28);pointer-events:none;}
.cine-fence{position:absolute;left:7%;top:5%;width:86%;height:86%;border-top:4px solid rgba(255,196,77,.28);border-radius:50%;box-shadow:0 -5px 18px rgba(255,196,77,.08);pointer-events:none;}
.cine-field.has-homer .cine-fence{animation:fenceFlash .9s ease-out both;}
.cine-foul{position:absolute;left:50%;top:84%;width:116px;height:1px;transform-origin:left center;background:linear-gradient(90deg,rgba(210,235,255,.42),rgba(210,235,255,.03));pointer-events:none;}
.cine-foul.left{transform:rotate(-132deg);}
.cine-foul.right{transform:rotate(-48deg);}
.cine-depth{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);border:1px dashed rgba(63,217,255,.1);border-radius:50%;pointer-events:none;}
.cine-depth.infield{width:126px;height:86px;top:64%;}
.cine-depth.outfield{width:196px;height:154px;top:48%;}
.cine-zone{position:absolute;font-family:var(--num);font-size:10px;color:rgba(217,230,247,.36);font-weight:800;letter-spacing:.08em;}
.cine-zone.lf{left:20%;top:25%;}.cine-zone.cf{left:50%;top:12%;transform:translateX(-50%);}.cine-zone.rf{right:20%;top:25%;}
.cine-infield{position:absolute;left:50%;top:57%;width:128px;height:128px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(210,235,255,.22);background:linear-gradient(135deg,rgba(157,106,54,.42),rgba(255,196,77,.05));}
.cine-mound{position:absolute;left:50%;top:54%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,196,77,.35);background:rgba(255,196,77,.12);}
.cine-home{position:absolute;left:50%;top:84%;transform:translate(-50%,-50%);font-family:var(--num);font-size:10px;color:#dff8ff;background:rgba(3,6,12,.8);border:1px solid rgba(210,235,255,.25);border-radius:5px;padding:2px 5px;}
.cine-base{position:absolute;width:22px;height:22px;border-radius:4px;transform:translate(-50%,-50%) rotate(45deg);background:rgba(210,230,255,.13);border:1px solid rgba(210,230,255,.28);display:flex;align-items:center;justify-content:center;}
.cine-base::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-45deg);font-family:var(--num);font-size:9px;color:var(--mut);font-weight:800;}
.cine-base.b1{left:78%;top:57%;}
.cine-base.b2{left:50%;top:28%;}
.cine-base.b3{left:22%;top:57%;}
.cine-base.on{width:34px;height:34px;background:var(--cy);border-color:rgba(63,217,255,.9);box-shadow:0 0 20px rgba(63,217,255,.76);}
.cine-base.on::after{content:'RUN';color:#04141c;font-size:9px;}
.cine-run-name{position:absolute;font-size:10px;color:#dff8ff;background:rgba(3,6,12,.76);border:1px solid rgba(63,217,255,.18);border-radius:999px;padding:1px 6px;max-width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cine-run-name.r1{left:74%;top:69%;}.cine-run-name.r2{left:50%;top:16%;transform:translateX(-50%);}.cine-run-name.r3{right:74%;top:69%;}
.cine-run-chip{position:absolute;z-index:5;left:var(--fx,50%);top:var(--fy,84%);transform:translate(-50%,-50%);max-width:76px;padding:2px 7px;border-radius:999px;border:1px solid rgba(63,217,255,.45);background:rgba(3,8,16,.88);box-shadow:0 0 12px rgba(63,217,255,.34);color:#eefbff;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:cineRunnerMove 1.08s cubic-bezier(.2,.78,.24,1) var(--delay,0s) both;}
.cine-run-chip.score{border-color:rgba(255,196,77,.72);box-shadow:0 0 16px rgba(255,196,77,.48);animation-name:cineRunnerScore;}
.cine-run-chip.out{opacity:.86;animation-name:cineRunnerOut;}
.cine-run-chip.homer{animation-name:cineRunnerHomer;animation-duration:1.55s;}
.cine-home-flash{position:absolute;z-index:4;left:50%;top:84%;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,196,77,.2);box-shadow:0 0 24px rgba(255,196,77,.68);pointer-events:none;animation:cineHomeFlash .72s ease-out var(--delay,.9s) both;}
.cine-ball{position:absolute;z-index:6;left:50%;top:84%;width:11px;height:11px;border-radius:50%;background:#fff7d1;box-shadow:0 0 16px rgba(255,196,77,.92);transform:translate(-50%,-50%);pointer-events:none;animation:cineBallFlight .62s cubic-bezier(.16,.72,.34,1) both;}
.cine-ball.grounder{width:9px;height:9px;background:var(--imp);animation-duration:.52s;}
.cine-ball.fly,.cine-ball.homer{animation-duration:.82s;}
.cine-traj{position:absolute;z-index:2;left:50%;top:84%;width:4px;height:4px;pointer-events:none;}
.cine-traj::before{content:'';position:absolute;left:0;top:0;width:var(--len,118px);height:0;border-top:3px solid rgba(255,196,77,.86);border-radius:999px;box-shadow:0 0 12px rgba(255,196,77,.45);transform:rotate(var(--rot,-90deg));transform-origin:left center;}
.cine-traj::after{content:'';position:absolute;left:calc(var(--x,0px) - 6px);top:calc(var(--y,-118px) - 6px);width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 15px rgba(255,196,77,.9);}
.cine-traj.batted::before{animation:ballTrace .7s ease-out both;}
.cine-traj.batted::after{animation:ballPop .7s ease-out both;}
.cine-traj.batted.grounder::before{border-top-style:dashed;border-color:rgba(255,196,77,.68);box-shadow:0 0 8px rgba(255,196,77,.3);}
.cine-traj.batted.grounder::after{width:9px;height:9px;background:var(--imp);}
.cine-traj.batted.liner::before{border-top-width:3px;border-color:rgba(255,242,185,.9);}
.cine-traj.batted.fly::before{height:var(--arc,34px);border-top:2px solid rgba(255,196,77,.9);border-radius:50% 50% 0 0;transform:rotate(var(--rot,-90deg)) scaleY(.72);}
.cine-traj.batted.homer::before{height:var(--arc,58px);border-top:3px solid rgba(255,196,77,.95);border-radius:55% 55% 0 0;transform:rotate(var(--rot,-90deg)) scaleY(.9);}
.cine-traj.batted.homer::after{background:var(--imp);box-shadow:0 0 22px rgba(255,196,77,1);}
.cine-traj.k::before{border-color:rgba(63,217,255,.9);transform:rotate(90deg);width:76px;}
.cine-traj.k::after{left:-4px;top:auto;bottom:-4px;background:var(--cy);}
.cine-traj.steal{left:78%;top:57%;}
.cine-traj.steal::before{border-color:rgba(84,224,165,.9);transform:rotate(-135deg);width:88px;}
.cine-traj.steal::after{left:-67px;top:auto;bottom:61px;background:var(--ok);}
.cine-traj.dp{left:22%;top:57%;}
.cine-traj.dp::before{border-color:rgba(255,122,107,.9);transform:rotate(0deg);width:130px;}
.cine-traj.dp::after{left:122px;top:auto;bottom:-4px;background:var(--warn);}
.cine-traj.score-glow::before{display:none;}
.cine-traj.score-glow::after{left:-21px;top:auto;bottom:-22px;width:44px;height:44px;background:rgba(255,196,77,.22);box-shadow:0 0 28px rgba(255,196,77,.7);}
.cine-landing{position:absolute;z-index:3;left:calc(50% + var(--x,0px) - 7px);top:calc(84% + var(--y,-118px) - 7px);width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.78);background:rgba(255,196,77,.2);box-shadow:0 0 18px rgba(255,196,77,.62);pointer-events:none;animation:landingPulse .9s ease-out both;}
.cine-landing.grounder{width:11px;height:11px;background:rgba(255,196,77,.14);box-shadow:0 0 10px rgba(255,196,77,.44);}
.cine-landing.liner,.cine-landing.fly{box-shadow:0 0 18px rgba(255,196,77,.68);}
.cine-landing.homer{width:22px;height:22px;border-color:rgba(255,196,77,.9);background:rgba(255,196,77,.24);box-shadow:0 0 28px rgba(255,196,77,.9);}
.cine-landing::after{content:'落下点';position:absolute;left:13px;top:-7px;font-size:9px;color:#fff;background:rgba(3,6,12,.7);border-radius:999px;padding:1px 5px;white-space:nowrap;}
@keyframes ballTrace{0%{opacity:0}100%{opacity:1}}
@keyframes ballPop{0%,55%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes cineRunnerMove{0%{left:var(--fx);top:var(--fy);opacity:0;transform:translate(-50%,-50%) scale(.86)}12%{opacity:1}100%{left:var(--tx);top:var(--ty);opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cineRunnerScore{0%{left:var(--fx);top:var(--fy);opacity:0;transform:translate(-50%,-50%) scale(.86)}12%,76%{opacity:1}82%{left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) scale(1.08)}100%{left:var(--tx);top:var(--ty);opacity:0;transform:translate(-50%,-50%) scale(.58)}}
@keyframes cineRunnerOut{0%{left:var(--fx);top:var(--fy);opacity:0;transform:translate(-50%,-50%) scale(.86)}16%,58%{opacity:.9}100%{left:var(--tx);top:var(--ty);opacity:0;transform:translate(-50%,-50%) scale(.72)}}
@keyframes cineRunnerHomer{0%{left:var(--fx);top:var(--fy);opacity:0;transform:translate(-50%,-50%) scale(.86)}8%{opacity:1}28%{left:var(--hx1);top:var(--hy1)}50%{left:var(--hx2);top:var(--hy2)}72%{left:var(--hx3);top:var(--hy3);opacity:1}86%{left:50%;top:84%;opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{left:50%;top:84%;opacity:0;transform:translate(-50%,-50%) scale(.58)}}
@keyframes cineBallFlight{0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.72)}8%{opacity:1}58%{transform:translate(-50%,-50%) translate(var(--mx,0px),var(--my,-96px)) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) translate(var(--x,0px),var(--y,-118px)) scale(.88)}}
@keyframes cineHomeFlash{0%,45%{opacity:0;transform:translate(-50%,-50%) scale(.4)}62%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
@keyframes landingPulse{0%,45%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes fenceFlash{0%{border-top-color:rgba(255,196,77,.28);box-shadow:0 -5px 18px rgba(255,196,77,.08)}40%{border-top-color:rgba(255,196,77,.95);box-shadow:0 -6px 28px rgba(255,196,77,.58)}100%{border-top-color:rgba(255,196,77,.42);box-shadow:0 -5px 18px rgba(255,196,77,.16)}}
.cine-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

@keyframes lfsDataIn{0%{opacity:0;transform:translateX(14px) scale(.98)}100%{opacity:1;transform:translateX(0) scale(1)}}
.ball-replay{position:relative;overflow:hidden;min-height:210px;border:1px solid rgba(255,196,77,.28);border-radius:10px;background:radial-gradient(70% 58% at 50% 80%,rgba(34,126,90,.18),transparent 60%),radial-gradient(80% 70% at 50% 18%,rgba(63,217,255,.08),transparent 62%),linear-gradient(180deg,#01040b,#050811 58%,#02040a);box-shadow:inset 0 0 24px rgba(255,196,77,.05)}
.ball-replay-camera{position:absolute;inset:0;transform-origin:50% 72%;animation:ballReplayCamera 1.45s ease-out .18s both}
.ball-replay-field{position:absolute;left:50%;bottom:-10%;width:92%;height:60%;transform:translateX(-50%) perspective(440px) rotateX(58deg);transform-origin:50% 100%;border-radius:50% 50% 18% 18%;background:radial-gradient(ellipse at 50% 68%,rgba(174,113,54,.54) 0 18%,transparent 19%),radial-gradient(ellipse at 50% 44%,rgba(31,122,88,.64) 0 62%,rgba(8,44,42,.56) 63%,transparent 64%);border-top:2px solid rgba(120,238,255,.26);box-shadow:0 -8px 30px rgba(0,0,0,.55),inset 0 0 28px rgba(63,217,255,.08)}
.ball-replay-field::before,.ball-replay-field::after{content:'';position:absolute;left:50%;bottom:17%;width:44%;border-top:1px solid rgba(255,247,216,.5);transform-origin:left center}
.ball-replay-field::before{transform:rotate(-42deg)}.ball-replay-field::after{transform:rotate(-138deg)}
.ball-replay-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.ball-replay-path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:ballReplayDraw 1.05s cubic-bezier(.16,.78,.24,1) .2s forwards}
.ball-replay-path.pitch{stroke:rgba(210,245,255,.78);stroke-width:1.1;filter:drop-shadow(0 0 3px rgba(63,217,255,.52));animation-duration:.52s}
.ball-replay-path.hit{stroke:rgba(255,196,77,.98);stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(255,196,77,.75));animation-delay:.58s}
.ball-replay-path.glow{stroke:rgba(255,196,77,.34);stroke-width:6;filter:none}
.ball-replay-ball{fill:#fff7d1;stroke:#fff;stroke-width:.35;filter:drop-shadow(0 0 5px rgba(255,196,77,.92))}

.ball-replay-impact{position:absolute;left:50%;top:72%;z-index:4;width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,247,209,.9),rgba(255,196,77,.24) 48%,transparent 72%);opacity:0;animation:ballReplayFlash .34s ease-out .55s both;pointer-events:none}

.ball-replay-result{position:absolute;left:10px;right:10px;bottom:8px;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid rgba(255,196,77,.22);border-radius:8px;background:rgba(3,8,18,.76);padding:6px 8px;font-size:11px;color:#dff6ff}

function rnd(){ // mulberry32: save.rngState を進める
  let t = save.rngState = (save.rngState + 0x6D2B79F5) | 0;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rint(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function wpick(items){ // items: [{w,...}]
  const tot=items.reduce((s,x)=>s+x.w,0); let r=rnd()*tot;
  for(const x of items){ r-=x.w; if(r<=0) return x; }
  return items[items.length-1];
}

function zeroBat(){return {games:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,runs:0,bb:0,hbp:0,so:0,sb:0,cs:0,sf:0,gidp:0};}

function defaultSave(){
  const s={

    inventory:{materials:{},trainingData:0},

  };

}
function normalizeSave(s){
  const d=defaultSave();
  if(!s.team) s.team=d.team;
  if(!s.team.lineup) s.team.lineup=d.team.lineup;
  if(!s.team.pitchingPolicy) s.team.pitchingPolicy=d.team.pitchingPolicy;
  if(typeof s.team.credits!=='number') s.team.credits=d.team.credits;
  if(!s.team.name) s.team.name=d.team.name;
  if(!s.inventory) s.inventory={materials:{},trainingData:0};
  if(!s.inventory.materials) s.inventory.materials={};
  if(typeof s.inventory.trainingData!=='number') s.inventory.trainingData=0;
  if(!s.facilities) s.facilities={training:1,analytics:0,workshop:1};
  for(const fid of Object.keys(d.facilities)) if(typeof s.facilities[fid]!=='number') s.facilities[fid]=d.facilities[fid];
  if(!s.planetProgress) s.planetProgress=d.planetProgress;
  for(const pid of Object.keys(d.planetProgress)) if(!s.planetProgress[pid]) s.planetProgress[pid]={surveyRate:0};
  if(!s.scout) s.scout={pulledIds:[]};
  if(!Array.isArray(s.scout.pulledIds)) s.scout.pulledIds=[];
  if(!Array.isArray(s.recentResults)) s.recentResults=[];
  if(!Array.isArray(s.news)) s.news=[];
  if(!s.season || !Array.isArray(s.season.schedule) || !Array.isArray(s.season.results)) s.season=defaultSeason();
  if(!Array.isArray(s.players)) s.players=d.players;
  for(const p of s.players){
    const m=PLAYER_MASTER[p.id];
    if(m){
      if(!p.name) p.name=m.name;
      if(typeof p.rarity!=='number') p.rarity=m.rarity;
      if(!p.role) p.role=m.role;
      if(!p.type) p.type=m.type;
      if(!Array.isArray(p.pos)) p.pos=m.pos.slice();
      if(typeof p.isPitcher!=='boolean') p.isPitcher=!!m.pitcher;
      if(!p.pf) p.pf=m.pf;
    }
    if(typeof p.level!=='number') p.level=1;
    if(typeof p.exp!=='number') p.exp=0;
    if(!p.ab) p.ab={};
    if(m && m.ab) for(const k of Object.keys(m.ab)) if(typeof p.ab[k]!=='number') p.ab[k]=m.ab[k];
    if(p.isPitcher && !p.sp) p.sp=zeroPit();
    if(!p.isPitcher && !p.sb_) p.sb_=zeroBat();
  }
  return s;
}
function persist(){
  if(typeof localStorage==='undefined') return;
  save.updatedAt=new Date().toISOString();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch(e){ toast('保存に失敗しました(容量超過の可能性)。設定からバックアップしてください'); }
}
function loadSave(){
  if(typeof localStorage==='undefined') return defaultSave();
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultSave();
    const s=JSON.parse(raw);
    if(!s || s.schemaVersion!==1 || !Array.isArray(s.players)) return defaultSave();
    return normalizeSave(s);
  }catch(e){ return defaultSave(); }
}
function importJson(text){
  try{
    const s=JSON.parse(text);
    if(!s || s.schemaVersion!==1 || !s.team || !Array.isArray(s.players)) throw 0;
    save=normalizeSave(s); persist(); UI.sel=null; UI.modal=null;
    toast('セーブデータを読み込みました'); render();
  }catch(e){ toast('読み込めません。データ形式を確認してください'); }
}

function batView(r){

  const avg=r.ab>0? r.h/r.ab : NaN;

  const obp=obpD>0? (r.h+r.bb+r.hbp)/obpD : NaN;

function teamPower(){

function teamPowerBreakdown(){

    pitching:avgNums(pitchers.map(p=>(p.ab.velocity+p.ab.breaking+p.ab.control+p.ab.stamina+p.ab.mental)/5)),
    defense:avgNums(batters.map(p=>(p.ab.defense+p.ab.arm)/2)),
  };
}
function materialSummary(){
  let total=0, rare=0;
  for(const mid of Object.keys(MATERIALS)){
    const count=materialCount(mid);
    total+=count;
    if(MATERIALS[mid].r>=2) rare+=count;
  }
  return {total,rare};
}
function playerOverall(p){
  const keys=p.isPitcher ? ['velocity','breaking','control','stamina','mental'] : ['contact','power','speed','defense','arm','eye'];
  return keys.reduce((s,k)=>s+(p.ab[k]||0),0)/keys.length;
}
function sideFocusPlayers(){
  const batters=save.players.filter(p=>!p.isPitcher);
  const pitchers=save.players.filter(p=>p.isPitcher);
  const items=[];
  const topPower=batters.slice().sort((a,b)=>b.ab.power-a.ab.power)[0];
  if(topPower) items.push({label:'最高パワー',p:topPower,meta:`PWR ${topPower.ab.power} / CON ${topPower.ab.contact}`});
  const topSpeed=batters.slice().sort((a,b)=>b.ab.speed-a.ab.speed)[0];
  if(topSpeed && !items.some(x=>x.p.id===topSpeed.id)) items.push({label:'最高走力',p:topSpeed,meta:`SPD ${topSpeed.ab.speed} / DEF ${topSpeed.ab.defense}`});
  const ace=pitchers.slice().sort((a,b)=>playerOverall(b)-playerOverall(a))[0];
  if(ace) items.push({label:'エース',p:ace,meta:`VEL ${ace.ab.velocity} / CTL ${ace.ab.control}`});
  return items.slice(0,3);
}
function trainMult(){ return 1+0.1*save.facilities.training; }
function fatF(pct){ return pct>=50?1: pct>=25?0.95: pct>=10?0.85:0.72; }
function freeBatters(){
  const used=new Set(save.team.lineup.battingOrder.concat(save.team.lineup.bench.map(b=>b.pid)));
  return save.players.filter(p=>!p.isPitcher && !used.has(p.id));
}
function freePitchers(){
  const P=save.team.lineup.pitchers;
  const used=new Set([P.starter,P.relief1,P.relief2,P.closer]);
  return save.players.filter(p=>p.isPitcher && !used.has(p.id));
}

/* ===== 5. 試合エンジン ===================================== */
function startMatch(oppId){
  const L=save.team.lineup;
  const ms={
    oppId, chunk:0, inning:1, outs:0,
    bases:[null,null,null],
    score:{p:[],n:[]}, hits:{p:0,n:0},
    order:L.battingOrder.slice(), positions:Object.assign({},L.positions),
    bench:L.bench.map(b=>({pid:b.pid,role:b.role,used:false})),
    batIdx:{p:0,n:0},
    pitcher:L.pitchers.starter,
    stamina:{}, npcStamina:100,
    usedPitchers:[L.pitchers.starter],
    starterLocked:false, decisionUsed:false, pendingDecision:null,
    pstats:{}, bstats:{}, benchEvents:[],
    log:[], finished:false, result:null,
    half:'top', lastPAEvent:null,
  };
  for(const k of ['starter','relief1','relief2','closer']) ms.stamina[L.pitchers[k]]=100;
  for(const pid of ms.order) ensureB(ms,pid);
  ensureP(ms,ms.pitcher);
  mlog(ms,0,'sys','PLAY BALL！ vs '+NPC_TEAMS[oppId].name,false);
  save.activeMatch=ms;
  persist();
  render();
}
function ensureB(ms,pid){ if(!ms.bstats[pid]) ms.bstats[pid]={pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,runs:0,bb:0,hbp:0,so:0,sb:0,cs:0,sf:0,gidp:0}; return ms.bstats[pid]; }
function ensureP(ms,pid){ if(!ms.pstats[pid]) ms.pstats[pid]={outs:0,h:0,r:0,bb:0,so:0,hr:0}; return ms.pstats[pid]; }
function mlog(ms,inn,half,text,hl,bases){ ms.log.push({inn,half,text,hl:!!hl,bases:bases||''}); }
function tot(arr){ return arr.reduce((s,v)=>s+(typeof v==='number'?v:0),0); }
function pTot(ms){ return tot(ms.score.p); }
function nTot(ms){ return tot(ms.score.n); }
function halfLabel(inn,half){ return half==='sys'? '' : '【'+inn+'回'+(half==='top'?'表':'裏')+'】'; }

function switchPitcher(ms,pid,why){
  ms.pitcher=pid;
  if(!ms.usedPitchers.includes(pid)) ms.usedPitchers.push(pid);
  ensureP(ms,pid);
  mlog(ms,ms.inning,'sys','【継投】'+getPlayer(pid).name+'がマウンドへ('+why+')',false);
  cineCaptureChange(ms,'継投',getPlayer(pid).name,why);
}
function pAvail(ms,pid){ return pid && !ms.usedPitchers.includes(pid); }

function autoPitchCheck(ms){
  const P=save.team.lineup.pitchers, pol=save.team.pitchingPolicy;
  const i=ms.inning, lead=pTot(ms)-nTot(ms), cur=ms.pitcher, st=ms.stamina[cur];
  if(pol.useCloserOnLead && i>=9 && lead>=1 && lead<=3 && pAvail(ms,P.closer) && cur!==P.closer){
    switchPitcher(ms,P.closer,'抑え投入'); return;
  }
  if(pol.preset==='earlyRelief' && i>=7 && cur===P.starter && pAvail(ms,P.relief1)){
    switchPitcher(ms,P.relief1,'早めの継投'); return;
  }
  const startLimit = ms.starterLocked?12 : (pol.preset==='longStarter'?20:35);
  if(cur===P.starter && st<startLimit && pAvail(ms,P.relief1)){
    switchPitcher(ms,P.relief1,'スタミナ低下'); return;
  }
  const relLimit = pol.preset==='longStarter'?20:35;
  if(cur===P.relief1 && st<relLimit && pAvail(ms,P.relief2)){
    switchPitcher(ms,P.relief2,'スタミナ低下'); return;
  }
}
function defenseSubCheck(ms){
  if(ms.inning!==8) return;
  if(pTot(ms)<=nTot(ms)) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='defenseSub');
  if(!slot) return;
  const cand=getPlayer(slot.pid);
  let worstIdx=-1,worst=999;
  ms.order.forEach((pid,idx)=>{
    if(ms.positions[pid]==='DH') return;
    const d=getPlayer(pid).ab.defense;
    if(d<worst){worst=d;worstIdx=idx;}
  });
  if(worstIdx<0 || cand.ab.defense < worst+BAL.dsDiff) return;
  const outPid=ms.order[worstIdx];
  ms.positions[cand.id]=ms.positions[outPid]; delete ms.positions[outPid];
  ms.order[worstIdx]=cand.id; slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'守備固め',inP:cand.name,outP:getPlayer(outPid).name});
  mlog(ms,ms.inning,'sys','【守備固め】'+cand.name+'('+getPlayer(outPid).name+'に代えて)',false);
  cineCaptureChange(ms,'守備固め',cand.name,getPlayer(outPid).name+'に代えて');
}
function pinchHitCheck(ms){
  if(ms.inning<7) return;
  const diff=pTot(ms)-nTot(ms);
  if(diff>0 || diff<-3) return;
  if(!ms.bases[1] && !ms.bases[2]) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='pinchHitter');
  if(!slot) return;
  const idx=ms.batIdx.p%9, curPid=ms.order[idx];
  const cur=getPlayer(curPid), cand=getPlayer(slot.pid);
  if(cand.ab.contact+cand.ab.power < cur.ab.contact+cur.ab.power+BAL.phDiff) return;
  ms.positions[cand.id]=ms.positions[curPid]; delete ms.positions[curPid];
  ms.order[idx]=cand.id; slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'代打',inP:cand.name,outP:cur.name});
  mlog(ms,ms.inning,'sys','【代打】'+cand.name+'('+cur.name+'に代えて)',false);
  cineCaptureChange(ms,'代打',cand.name,cur.name+'に代えて');
}
function pinchRunCheck(ms,batPid){
  if(ms.inning<7) return;
  const diff=Math.abs(pTot(ms)-nTot(ms));
  if(diff>2) return;
  const bi=ms.bases.findIndex(r=>r && r.pid===batPid);
  if(bi<0) return;
  const runner=ms.bases[bi];
  if(runner.speed>=60) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='pinchRunner');
  if(!slot) return;
  const cand=getPlayer(slot.pid);
  if(cand.ab.speed < runner.speed+BAL.prDiff) return;
  const idx=ms.order.indexOf(batPid);
  if(idx>=0){
    ms.positions[cand.id]=ms.positions[batPid]; delete ms.positions[batPid];
    ms.order[idx]=cand.id;
  }
  ms.bases[bi]={pid:cand.id,name:cand.name,speed:cand.ab.speed,side:'p'};
  slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'代走',inP:cand.name,outP:runner.name});
  mlog(ms,ms.inning,'sys','【代走】'+cand.name+'('+runner.name+'に代えて)',false);
  cineCaptureChange(ms,'代走',cand.name,runner.name+'に代えて');
}

// 凡打: 結果文・打球方向(fieldZone)・処理野手(fieldedBy)を一致させる
const OUT_FIELD_PLAYS=[
  {pos:'SS', text:'ショートゴロ', zone:'IF_L', traj:'grounder'},
  {pos:'2B', text:'セカンドゴロ', zone:'IF_R', traj:'grounder'},
  {pos:'3B', text:'サードゴロ', zone:'IF_L', traj:'grounder'},
  {pos:'1B', text:'ファーストゴロ', zone:'IF_R', traj:'grounder'},
  {pos:'P',  text:'ピッチャーゴロ', zone:'IF_C', traj:'grounder'},
  {pos:'CF', text:'センターフライ', zone:'CF', traj:'fly'},
  {pos:'LF', text:'レフトフライ', zone:'LF', traj:'fly'},
  {pos:'RF', text:'ライトフライ', zone:'RF', traj:'fly'},
];
function resolvePA(bt,pit,fat){
  const pv=(pit.velocity*0.5+pit.breaking*0.5)*fat;
  const pc=pit.control*fat;
  const role=bt.role; // 役割特性(自軍打者のみ)。係数の微調整のみで rnd() の呼び出し回数・順序は不変。
  let kP=clampN(0.16+(pv-bt.contact)*0.0022,0.07,0.34);
  let bbP=clampN(0.08+(bt.eye-pc)*0.0018,0.025,0.17);
  const hbpP=0.008;
  if(role==='average') kP=clampN(kP*0.88,0.05,0.34);        // アベレージ: 三振少なめ
  else if(role==='slugger') kP=clampN(kP*1.06,0.07,0.36);   // スラッガー: 三振やや多め
  if(role==='balanced'||role==='average') bbP=clampN(bbP*1.05,0.025,0.18); // 選球眼系: 四球やや増
  const r=rnd();
  if(r<kP) return 'K';
  if(r<kP+bbP) return 'BB';
  if(r<kP+bbP+hbpP) return 'HBP';
  let hitP=clampN(0.30+(bt.contact-pv)*0.0022,0.18,0.44);
  if(role==='average') hitP=clampN(hitP*1.04,0.18,0.46);    // アベレージ: 安打やや増
  if(rnd()<hitP){
    const r2=rnd();
    let hrP=clampN(0.04+(bt.power-45)*0.005,0.02,0.32);
    let tpP=0.015+bt.speed*0.0004;
    const dbP=0.16+bt.power*0.0012;
    if(role==='slugger') hrP=clampN(hrP*1.2,0.02,0.40);     // スラッガー: 本塁打増
    else if(role==='speedster') tpP=tpP*1.6;                // 俊足: 三塁打増
    if(r2<hrP) return 'HR';
    if(r2<hrP+tpP) return '3B';
    if(r2<hrP+tpP+dbP) return '2B';
    return '1B';
  }
  return 'OUT';
}

function doPA(ms,half){
  const playerBat = half==='bottom';
  const opp=oppData(ms.oppId);
  const baseState = ms.bases.map(r=>r? (r.side==='p'?getPlayer(r.pid).name:r.name) : '-').join(' / ');
  const scoreBefore = pTot(ms) - nTot(ms);
  const scoreBeforeSnap = cineScoreSnap(ms);
  const basesBeforeSnap = cineBasesSnap(ms);
  const outsBefore = ms.outs;
  // 投手側
  let pit,fat,pitPid=null,pitRole='starter',pitSta;
  if(playerBat){ pit=opp.pit; pitSta=opp.pit.stamina; fat=fatF(ms.npcStamina); }
  else{
    const pl=getPlayer(ms.pitcher);
    pit=pl.ab; pitSta=pl.ab.stamina; pitPid=pl.id; pitRole=pl.role; fat=fatF(ms.stamina[pitPid]);
  }
  // 打者側(代打チェック→決定)
  if(playerBat) pinchHitCheck(ms);
  let bt;
  if(playerBat){
    const pid=ms.order[ms.batIdx.p%9]; const pl=getPlayer(pid);
    bt={pid,name:pl.name,contact:pl.ab.contact,power:pl.ab.power,speed:pl.ab.speed,eye:pl.ab.eye,side:'p',role:pl.role};
  }else{
    const b=opp.bats[ms.batIdx.n%9];
    bt={pid:null,name:b.name,contact:b.contact,power:b.power,speed:b.speed,eye:b.eye,side:'n'};
  }
  const bs = playerBat? ensureB(ms,bt.pid) : null;
  const ps = (!playerBat && pitPid)? ensureP(ms,pitPid) : null;

  // 盗塁試行(1塁のみ・2アウト未満・俊足)
  const B=ms.bases;
  if(B[0] && !B[1] && !B[2] && ms.outs<2 && B[0].speed>=68 && rnd()<0.08){
    const stealRunner = B[0];
    const ok=rnd()<clampN(0.45+B[0].speed*0.004,0.5,0.85);
    if(ok){
      mlog(ms,ms.inning,half,B[0].name+'が二盗成功！',false);
      if(B[0].side==='p') ensureB(ms,B[0].pid).sb++;
      B[1]=B[0]; B[0]=null;
      cineCaptureSteal(ms,half,stealRunner,true);
    }else{
      mlog(ms,ms.inning,half,B[0].name+'は盗塁失敗…',false);
      if(B[0].side==='p') ensureB(ms,B[0].pid).cs++;
      B[0]=null; ms.outs++;
      cineCaptureSteal(ms,half,stealRunner,false);
      if(ms.outs>=3){ if(!playerBat&&ps)ps.outs++; consumeStamina(ms,playerBat,pitRole,pitSta,1,false,0); ms.batIdxNote=true; return; }
      if(!playerBat&&ps)ps.outs++;
    }
  }

  const res=resolvePA(bt,pit,fat);
  let runsPA=0, outsGained=0, reached=false, text='', hl=false, isDP=false, isSF=false, ballInfo=null, singleAdvance=null;

  const scoreRun=(runner)=>{
    const idx=ms.inning-1;
    const arr= playerBat? ms.score.p : ms.score.n;
    arr[idx]=(typeof arr[idx]==='number'?arr[idx]:0)+1;
    runsPA++;
    if(runner && runner.side==='p') ensureB(ms,runner.pid).runs++;
    if(playerBat && ms.inning>=9 && pTot(ms)>nTot(ms)) ms._wo=true;
  };
  const runnerObj=()=>({pid:bt.pid,name:bt.name,speed:bt.speed,side:bt.side});

  if(res==='K'){
    outsGained=1; ms.outs++;
    text=pick(['空振り三振','見逃し三振']);
    if(bs){bs.pa++;bs.ab++;bs.so++;}
    if(ps){ps.outs++;ps.so++;}
  }
  else if(res==='BB'||res==='HBP'){
    reached=true;
    text= res==='BB'?'四球を選ぶ':'死球';
    if(B[0]){ if(B[1]){ if(B[2]) scoreRun(B[2]); B[2]=B[1]; } B[1]=B[0]; }
    B[0]=runnerObj();
    if(bs){bs.pa++; if(res==='BB')bs.bb++; else bs.hbp++; bs.rbi+=runsPA;}
    if(ps && res==='BB') ps.bb++;
    if(ps) ps.r+=runsPA;
  }
  else if(res==='HR'){
    reached=true; hl=true;
    let cnt=1;
    [2,1,0].forEach(i=>{ if(B[i]){scoreRun(B[i]);B[i]=null;cnt++;} });
    scoreRun(runnerObj());
    text= cnt>1? '◆'+cnt+'ランホームラン！！' : '◆ソロホームラン！！';
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.hr++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.hr++;ps.r+=runsPA;}
  }
  else if(res==='3B'){
    reached=true;
    ballInfo=createBattedBallInfo(res,bt);
    resolveTripleAdvance(B,bt,ballInfo,scoreRun);
    text='フェンス直撃の三塁打！';
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    text=extraBaseHitText(res,ballInfo,runsPA);
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.d3++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else if(res==='2B'){
    reached=true;
    ballInfo=createBattedBallInfo(res,bt);
    resolveDoubleAdvance(B,bt,ballInfo,outsBefore,scoreRun);
    text=pick(['左中間を破る二塁打','右中間への二塁打','フェンス直撃の二塁打']);
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    text=extraBaseHitText(res,ballInfo,runsPA);
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.d2++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else if(res==='1B'){
    reached=true;
    ballInfo=createBattedBallInfo(res,bt);
    const singleCtx={ms,half,outsNow:ms.outs};
    singleAdvance=resolveSingleAdvance(B,bt,ballInfo,outsBefore,scoreRun,singleCtx);
    if(singleAdvance && typeof singleAdvance.outsAfter==='number' && singleAdvance.outsAfter>ms.outs){
      const addOuts = Math.min(3,singleAdvance.outsAfter) - ms.outs;
      ms.outs = Math.min(3,singleAdvance.outsAfter);
      outsGained += addOuts;
      if(ps) ps.outs += addOuts;
    }
    text=singleHitText(ballInfo,runsPA);
    text=appendSingleSecondRunnerText(text,singleAdvance && singleAdvance.secondRunnerDecision);
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else{ // OUT
    if(B[0] && ms.outs<2 && rnd()<0.30){
      // 併殺: 打者＋1塁走者(2塁封殺)がアウト。他走者は1つ進塁(必要なら生還)。
      const obDP=ms.outs;
      isDP=true; outsGained=2; ms.outs+=2;
      if(obDP===0 && B[2]) scoreRun(B[2]); // 満塁併殺(2アウト目)→3塁走者生還
      B[2] = B[1] || null;                 // 2塁走者→3塁
      B[1] = null; B[0] = null;            // 1塁走者は2塁で封殺
      text='併殺打…';
      ballInfo={fieldZone:'IF_L', traj:'grounder', depth:'infield', fieldedBy:'SS'};
      if(bs){bs.pa++;bs.ab++;bs.gidp++;}
      if(ps)ps.outs+=2;
    }
    else if(B[2] && ms.outs<2 && rnd()<0.28){
      isSF=true; outsGained=1; ms.outs++;
      scoreRun(B[2]); B[2]=null;
      text='犠牲フライ';
      ballInfo={fieldZone:'CF', traj:'fly', depth:'medium', fieldedBy:'CF'};
      if(bs){bs.pa++;bs.sf++;bs.rbi+=runsPA;}
      if(ps){ps.outs++;ps.r+=runsPA;}
    }
    else{
      outsGained=1; ms.outs++;
      const play=pick(OUT_FIELD_PLAYS); // 文・方向・処理野手を一致させる
      text=play.text;
      ballInfo={fieldZone:play.zone, traj:play.traj, depth: play.traj==='grounder'?'infield':'shallow', fieldedBy:play.pos};
      if(bs){bs.pa++;bs.ab++;}
      if(ps)ps.outs++;
    }
  }
  if(runsPA>0){ if(!['1B','2B','3B'].includes(res)) text+='（'+runsPA+'点）'; hl=true; }
  mlog(ms,ms.inning,half,bt.name+'：'+text,hl,baseState);
  cineSnap(ms,half,bt,res,{runs:runsPA,baseState,scoreBefore,scoreBeforeSnap,basesBefore:basesBeforeSnap,outsBefore,pitcherName: playerBat ? opp.pit.name : getPlayer(ms.pitcher).name, outcomeText:text, ballInfo, runnerMovementOverrides:singleAdvance&&singleAdvance.moves, wasDP:isDP, wasSF:isSF, isWalkoff:ms._wo});

  consumeStamina(ms,playerBat,pitRole,pitSta,outsGained,reached,runsPA);

  // 代走チェック(打者が出塁した場合)
  if(playerBat && reached && ms.outs<3 && !ms._wo) pinchRunCheck(ms,bt.pid);

  if(playerBat) ms.batIdx.p++; else ms.batIdx.n++;
}
function consumeStamina(ms,playerBat,role,staAb,outs,reached,runs){
  let c=(outs*2+(reached?3:0)+runs*2)*(1-staAb/250);
  if(role==='reliever'||role==='closer') c*=1.5;
  if(playerBat){ ms.npcStamina=Math.max(0,ms.npcStamina-c); }
  else{ ms.stamina[ms.pitcher]=Math.max(0,ms.stamina[ms.pitcher]-c); }
}

function inferMatchHalf(ms){
  const i=(ms.inning||1)-1;
  return typeof ms.score.p[i]==='number' || ms.score.p[i]==='X' ? 'bottom' : 'top';
}
function ensureMatchHalf(ms){
  if(!ms.half) ms.half=inferMatchHalf(ms);
  return ms.half;
}
function updateMatchChunk(ms){
  while(ms.chunk<3 && ms.inning>[3,6,9][ms.chunk]) ms.chunk++;
}
function prepareCurrentHalf(ms){
  const half=ensureMatchHalf(ms);
  const i=ms.inning-1;
  if(half==='top'){
    if(typeof ms.score.n[i]!=='number'){
      ms.score.n[i]=0;
      autoPitchCheck(ms);
      defenseSubCheck(ms);
    }
  }else if(typeof ms.score.p[i]!=='number'){
    ms.score.p[i]=0;
  }
}
function finishCurrentPA(ms){
  if(ms._wo){
    ms._wo=false;
    mlog(ms,ms.inning,'sys','サヨナラ勝ち！！',true);
    finalizeMatch(ms);
    return;
  }
  if(ms.outs<3) return;
  const half=ensureMatchHalf(ms);
  const i=ms.inning;
  ms.outs=0; ms.bases=[null,null,null];
  if(half==='top'){
    if(i>=9 && pTot(ms)>nTot(ms)){
      ms.score.p[i-1]='X';
      finalizeMatch(ms);
      return;
    }
    ms.half='bottom';
    if(typeof ms.score.p[i-1]!=='number') ms.score.p[i-1]=0;
    return;
  }
  if(i>=9 && pTot(ms)!==nTot(ms)){ finalizeMatch(ms); return; }
  if(i>=12){ finalizeMatch(ms); return; }
  ms.inning++;
  ms.half='top';
  updateMatchChunk(ms);
  if(ms.inning===7 && !ms.decisionUsed) maybeDecision(ms);
}
function playOnePA(ms){

function finalizeMatch(ms){
  if(ms.finished) return;
  ms.finished=true;
  const p=pTot(ms), n=nTot(ms);
  const outcome = p>n?'win': p<n?'lose':'draw';
  const P=save.team.lineup.pitchers;
  // 勝敗投手の簡易判定(v0.1: 勝利=最多アウト投手 / 敗戦=最多失点投手 / S=抑えが勝利試合を締め3点差以内)
  let winP=null,loseP=null,saveP=null;
  const pids=Object.keys(ms.pstats);
  if(outcome==='win' && pids.length){
    winP=pids.reduce((a,b)=>ms.pstats[a].outs>=ms.pstats[b].outs?a:b);
    const last=ms.pitcher;
    if(last===P.closer && winP!==P.closer && (p-n)<=3) saveP=P.closer;
  }
  if(outcome==='lose' && pids.length){
    loseP=pids.reduce((a,b)=>ms.pstats[a].r>=ms.pstats[b].r?a:b);
  }
  // シーズン成績へ反映
  const mult=trainMult();
  const expList=[];
  for(const pid of Object.keys(ms.bstats)){
    const t=ms.bstats[pid], pl=getPlayer(pid); if(!pl||pl.isPitcher) continue;
    const r=pl.sb_;
    r.games++; r.pa+=t.pa; r.ab+=t.ab; r.h+=t.h; r.d2+=t.d2; r.d3+=t.d3; r.hr+=t.hr;
    r.rbi+=t.rbi; r.runs+=t.runs; r.bb+=t.bb; r.hbp+=t.hbp; r.so+=t.so;
    r.sb+=t.sb; r.cs+=t.cs; r.sf+=t.sf; r.gidp+=t.gidp;
    const e=Math.round((15+t.h*8+t.hr*12+t.rbi*5+t.bb*2+t.sb*4+t.runs*3)*mult);
    pl.exp+=e; expList.push({name:pl.name,exp:e});
  }
  for(const pid of pids){
    const t=ms.pstats[pid], pl=getPlayer(pid); if(!pl) continue;
    const r=pl.sp;
    r.games++; r.outs+=t.outs; r.h+=t.h; r.er+=t.r; r.bb+=t.bb; r.so+=t.so; r.hr+=t.hr;
    const isW=pid===winP, isS=pid===saveP;
    if(isW) r.wins++;
    if(pid===loseP) r.losses++;
    if(isS) r.saves++;
    const e=Math.round((15+t.outs*1.5+t.so*3+(isW?20:0)+(isS?15:0))*mult);
    pl.exp+=e; expList.push({name:pl.name,exp:e});
  }
  // 報酬
  const credits = outcome==='win'? BAL.rewardWin+ms.hits.p*6
                : outcome==='draw'? BAL.rewardDraw+ms.hits.p*4
                : BAL.rewardLose+ms.hits.p*4;
  save.team.credits+=credits;
  // MVP
  let mvp='—',best=-1;
  for(const pid of Object.keys(ms.bstats)){
    const t=ms.bstats[pid], sc=t.h+t.hr*2+t.rbi;
    if(sc>best){best=sc;mvp=getPlayer(pid)?getPlayer(pid).name:'—';}
  }
  const oppName=NPC_TEAMS[ms.oppId].name;
  const title = outcome==='win' ? `${oppName} に勝利！` : outcome==='lose' ? `${oppName} に敗北` : `${oppName} と引き分け`;
  ms.result={outcome,p,n,credits,mvp,expList,oppName,
    winP:winP?getPlayer(winP).name:null, saveP:saveP?getPlayer(saveP).name:null};
  UI.modal={kind:'matchResult'};
  save.recentResults.unshift({opp:oppName,score:p+' - '+n,outcome});
  if(save.recentResults.length>10) save.recentResults.length=10;
  addNews(`${mvp} が活躍して ${title}`);
  mlog(ms,ms.inning,'sys','試合終了 '+p+' - '+n+'（'+(outcome==='win'?'勝利':outcome==='lose'?'敗北':'引き分け')+'）',outcome==='win');
}

function seasonSchedule(){ return ['npc1','npc2','npc3','npc1','npc2','npc3']; } // 各球団と2回ずつ=6試合
function defaultSeason(){ return {no:1, schedule:seasonSchedule(), idx:0, results:[], done:false}; }
function ensureSeason(){ if(!save.season || !Array.isArray(save.season.schedule)) save.season=defaultSeason(); return save.season; }
function seasonStandings(){
  const s=ensureSeason();
  const teams=['us','npc1','npc2','npc3'];
  const rec={}; teams.forEach(t=>rec[t]={w:0,l:0,d:0});
  for(const r of s.results){
    if(!r || !rec[r.opp]) continue;
    if(r.outcome==='win'){ rec.us.w++; rec[r.opp].l++; }
    else if(r.outcome==='lose'){ rec.us.l++; rec[r.opp].w++; }
    else { rec.us.d++; rec[r.opp].d++; }
  }
  // NPC同士の対戦は戦力で決定論的に算出(乱数なし)
  const npcs=['npc1','npc2','npc3'];
  for(let i=0;i<npcs.length;i++) for(let j=i+1;j<npcs.length;j++){
    const a=npcs[i], b=npcs[j], pa=NPC_TEAMS[a].power, pb=NPC_TEAMS[b].power;
    for(let g=0;g<2;g++){
      const winner = pa>pb? a : pb>pa? b : (g===0?a:b);
      const loser = winner===a? b : a;
      rec[winner].w++; rec[loser].l++;
    }
  }
  return teams.map(t=>({id:t, name: t==='us'? save.team.name : NPC_TEAMS[t].name,
      w:rec[t].w, l:rec[t].l, d:rec[t].d, pts:rec[t].w*3+rec[t].d}))
    .sort((x,y)=> y.pts-x.pts || y.w-x.w || x.l-y.l);
}
function seasonRecordSelf(){ const s=ensureSeason(); let w=0,l=0,d=0; for(const r of s.results){ if(!r)continue; if(r.outcome==='win')w++; else if(r.outcome==='lose')l++; else d++; } return {w,l,d}; }
function startSeasonGame(){

  if(save.activeMatch && !save.activeMatch.finished){ toast('試合中です'); return; }

  if(s.done || s.idx>=s.schedule.length){ toast('今シーズンは全日程終了です'); return; }
  const opp=s.schedule[s.idx];
