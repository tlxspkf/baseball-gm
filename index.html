<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>銀河ベースボールGM v0.1</title>
<style>
/* ============================================================
   デザイントークン
   黒/濃紺ベース + シアン/青/紫の発光。ゴールドは重要演出のみ。
============================================================ */
:root{
  --bg:#05080f;
  --bg2:#0a1020;
  --panel:#0c1424;
  --panel2:#101b30;
  --line:rgba(72,180,255,.16);
  --line2:rgba(72,180,255,.32);
  --cy:#3fd9ff;
  --bl:#5a8bff;
  --pu:#a47bff;
  --tx:#d9e6f7;
  --mut:#7d90b0;
  --imp:#ffc44d;       /* ゴールド: 重要演出専用 */
  --imp2:#ff8a3d;      /* オレンジ: 重要演出専用 */
  --ok:#54e0a5;
  --warn:#ff7a6b;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(1px 1px at 12% 22%, rgba(190,225,255,.5), transparent 60%),
    radial-gradient(1px 1px at 68% 12%, rgba(190,225,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 64%, rgba(164,123,255,.4), transparent 60%),
    radial-gradient(1px 1px at 30% 80%, rgba(63,217,255,.35), transparent 60%),
    radial-gradient(1200px 700px at 70% -10%, #101d3a 0%, transparent 60%),
    linear-gradient(180deg,#070b16 0%, var(--bg) 100%);
  color:var(--tx);
  font-size:14px;
  line-height:1.55;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  overflow:hidden;
}
#app{
  display:grid;
  grid-template-columns:172px 1fr 312px;
  gap:10px;
  height:100dvh;
  padding:10px;
  padding-left:max(10px, env(safe-area-inset-left));
  padding-right:max(10px, env(safe-area-inset-right));
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
/* ---------- 左ナビ ---------- */
#nav{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.brand{
  border:1px solid var(--line2);border-radius:10px;padding:10px 10px 8px;
  background:linear-gradient(160deg,#0e1830,#0a1222);
}
.brand .eyebrow{font-size:9px;letter-spacing:.32em;color:var(--cy);font-family:var(--num)}
.brand .ttl{font-size:15px;font-weight:800;letter-spacing:.04em;line-height:1.3;
  background:linear-gradient(90deg,var(--cy),var(--bl) 55%,var(--pu));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .cr{margin-top:6px;font-family:var(--num);font-size:13px;color:var(--tx)}
.brand .cr small{color:var(--mut);font-size:10px;letter-spacing:.1em}
.navbtn{
  text-align:left;border:1px solid var(--line);border-radius:10px;
  background:rgba(12,20,36,.85);color:var(--tx);
  padding:11px 12px;font-size:13.5px;cursor:pointer;position:relative;
  display:flex;align-items:center;gap:8px;min-height:44px;width:100%;
}
.navbtn .ic{width:18px;text-align:center;opacity:.9}
.navbtn.on{
  border-color:var(--cy);color:#eaf8ff;
  background:linear-gradient(90deg, rgba(63,217,255,.14), rgba(90,139,255,.05));
  box-shadow:0 0 10px rgba(63,217,255,.18), inset 0 0 10px rgba(63,217,255,.06);
}
.badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:9px;letter-spacing:.1em;color:#06222c;background:var(--cy);
  border-radius:8px;padding:1px 7px;font-weight:700;
  box-shadow:0 0 8px rgba(63,217,255,.6);
}
.navfoot{margin-top:auto;font-size:10px;color:var(--mut);padding:4px 6px;line-height:1.5}
/* ---------- パネル共通 ---------- */
#main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
#side{overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{
  border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(170deg, var(--panel2), var(--panel));
  padding:14px;margin-bottom:10px;
}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ph .eyebrow{font-size:9px;letter-spacing:.3em;color:var(--cy);font-family:var(--num)}
.ph h2{font-size:15px;font-weight:800;letter-spacing:.05em}
.ph .sub{margin-left:auto;font-size:11px;color:var(--mut)}
h3.sec{font-size:12px;color:var(--bl);letter-spacing:.12em;margin:12px 0 6px;font-weight:700}
.mut{color:var(--mut);font-size:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.imp{color:var(--imp);text-shadow:0 0 8px rgba(255,196,77,.45)}
/* ---------- ボタン ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line2);border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#13223e,#0d1729);color:var(--tx);
  padding:10px 16px;font-size:13.5px;min-height:44px;font-weight:600;
}
.btn.pri{
  border-color:var(--cy);color:#04141c;font-weight:800;
  background:linear-gradient(180deg,#6fe6ff,#2db4dd);
  box-shadow:0 0 14px rgba(63,217,255,.35);
}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,122,107,.55);background:linear-gradient(180deg,#3a1720,#1b0d14);color:#ffd8d2;}
.btn.sm{min-height:34px;padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.35;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ---------- カード/チップ ---------- */
.chip{
  display:inline-block;font-size:10px;border:1px solid var(--line2);
  border-radius:6px;padding:1px 7px;color:var(--cy);letter-spacing:.06em;vertical-align:1px;
}
.chip.t-flame{color:#ff8d72;border-color:rgba(255,141,114,.4)}
.chip.t-ice{color:#7ad9ff;border-color:rgba(122,217,255,.4)}
.chip.t-machine{color:#9fb4ff;border-color:rgba(159,180,255,.4)}
.chip.t-gravity{color:#c08bff;border-color:rgba(192,139,255,.4)}
.chip.t-phantom{color:#ff9be0;border-color:rgba(255,155,224,.4)}
.stars{color:var(--imp);font-size:11px;letter-spacing:.1em}
.card{
  border:1px solid var(--line);border-radius:10px;background:rgba(10,17,32,.7);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
}
.news-item{
  border:1px solid rgba(72,180,255,.16);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  background:linear-gradient(180deg,rgba(63,217,255,.06),rgba(9,15,28,.95));
  font-size:13px;line-height:1.6;
}
.player-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.player-card{border:1px solid rgba(72,180,255,.16);border-radius:14px;background:linear-gradient(180deg,rgba(63,217,255,.08),rgba(9,15,28,.95));padding:12px;}
.player-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.player-top .badge{background:rgba(255,196,77,.12);color:var(--imp);font-size:11px;padding:3px 8px;border-radius:999px;}
.player-name{font-size:16px;font-weight:800;margin-bottom:4px}
.player-title{font-size:12px;color:var(--mut);margin-bottom:8px}
.player-note{font-size:12px;color:var(--tx);line-height:1.5}
.card.sel{border-color:var(--cy);box-shadow:0 0 10px rgba(63,217,255,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* ---------- スロット(編成) ---------- */
.slot{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;background:rgba(9,15,28,.75);padding:8px 10px;margin-bottom:6px;
  min-height:48px;cursor:pointer;
}
.slot .no{font-family:var(--num);color:var(--bl);width:20px;text-align:right;font-size:13px}
.slot .nm{font-weight:700;font-size:13.5px}
.slot .pos{
  font-family:var(--num);font-size:11px;border:1px solid var(--line2);border-radius:6px;
  padding:2px 7px;color:var(--cy);cursor:pointer;min-width:36px;text-align:center;
}
.slot .warnp{color:var(--warn);font-size:11px}
.slot .tail{margin-left:auto;display:flex;align-items:center;gap:6px}
.rolechip{
  font-size:10.5px;border:1px solid rgba(164,123,255,.45);color:var(--pu);
  border-radius:6px;padding:2px 8px;cursor:pointer;
}
/* ---------- ゲージ ---------- */
.gauge{height:8px;border-radius:5px;background:#0a1222;border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--cy));border-radius:5px}
.gauge.low i{background:linear-gradient(90deg,#a04a3c,var(--warn))}
.gr{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.gr .lbl{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gauge{flex:1}
.gr .val{width:34px;text-align:right}
/* ---------- スコアボード ---------- */
.broadcast{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
  font-family:var(--num);font-size:10px;letter-spacing:.28em;color:var(--cy);
}
.broadcast .live{
  background:linear-gradient(90deg,var(--bl),var(--pu));color:#fff;
  transform:skewX(-12deg);padding:2px 10px;border-radius:3px;letter-spacing:.2em;font-weight:700;
}
.broadcast .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
table.sb{width:100%;border-collapse:collapse;font-family:var(--num);font-size:12.5px}
table.sb th,table.sb td{
  border:1px solid var(--line);padding:4px 2px;text-align:center;min-width:24px;
}
table.sb th{color:var(--mut);font-weight:400;font-size:10px}
table.sb td.tm{text-align:left;padding-left:8px;min-width:86px;font-family:inherit;font-size:12px;font-weight:700}
table.sb td.rh{color:var(--cy);font-weight:700}
table.sb td.cur{background:rgba(63,217,255,.12)}
/* ---------- ダイヤモンド ---------- */
.field{position:relative;width:170px;height:130px;margin:10px auto 4px}
.fline{
  position:absolute;left:50%;top:62%;width:92px;height:92px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid rgba(63,217,255,.35);
  background:linear-gradient(135deg, rgba(63,217,255,.05), transparent);
}
.base{
  position:absolute;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid var(--cy);background:#0a1222;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx);
}
.base.on{background:var(--cy);box-shadow:0 0 14px rgba(63,217,255,.9);}
.fmeta{text-align:center;font-size:12px;color:var(--mut);display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.field-card{border:1px solid rgba(63,217,255,.14);border-radius:14px;padding:12px;background:linear-gradient(180deg,rgba(63,217,255,.06),rgba(10,17,32,.96));margin:10px 0}
.field-card .fmeta{font-size:12px;color:var(--tx);}
.reward-card{border:1px solid rgba(255,196,77,.18);border-radius:12px;background:rgba(255,196,77,.06);padding:10px;margin:10px 0;color:#fff;font-size:13px}
.log-sep{padding:8px 0 4px;color:var(--cy);font-size:12px;font-weight:700;border-bottom:1px solid rgba(63,217,255,.16);margin-top:10px}
.log-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(63,217,255,.15);color:var(--cy);margin-right:6px}
.log p{padding:8px 0 6px;border-bottom:1px dashed rgba(72,180,255,.08);transition:color .2s,transform .2s}
.log{
  font-size:12px;line-height:1.65;max-height:46vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text;
  padding-right:4px;
}
.log p{padding:8px 0 6px;border-bottom:1px dashed rgba(72,180,255,.08);transition:color .2s,transform .2s}
.log p strong{color:var(--tx)}
.log p.impact{color:#b9f7ff;font-weight:700;text-shadow:0 0 8px rgba(63,217,255,.35)}
.log p.impact::before{content:'◆';margin-right:6px;color:var(--imp)}
.log p.sysl{color:var(--pu)}
.log p.final{padding-bottom:10px;margin-top:4px;border-color:rgba(255,196,77,.25)}
.tip-list{display:grid;gap:8px;margin-top:8px}
.tip-item{border:1px solid rgba(72,180,255,.16);border-radius:10px;background:linear-gradient(180deg,rgba(63,217,255,.08),rgba(12,20,36,.9));padding:12px;display:flex;align-items:flex-start;gap:10px}
.tip-item .marker{width:8px;height:8px;border-radius:50%;background:var(--cy);margin-top:5px;flex-shrink:0}
.tip-item strong{display:block;color:#eaf8ff;margin-bottom:4px}
.match-result{border:1px solid rgba(255,196,77,.25);border-radius:14px;padding:14px;background:rgba(255,221,146,.06);box-shadow:0 0 18px rgba(255,196,77,.15)}
.match-result .label{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;background:rgba(255,196,77,.12);color:var(--imp);font-weight:700;margin-bottom:10px}
.match-result .label.win{background:rgba(63,217,255,.18);color:#b9f7ff}
.match-result .label.lose{background:rgba(255,122,107,.14);color:var(--warn)}
.match-result .label.draw{background:rgba(148,132,255,.14);color:var(--pu)}
.match-result .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,196,77,.18)}
.match-result .stat:last-child{border-bottom:none}
.scout-card{border:1px solid rgba(255,196,77,.2);border-radius:14px;background:linear-gradient(180deg,rgba(255,196,77,.06),rgba(12,20,36,.9));padding:16px;margin:12px 0;position:relative;overflow:hidden}
.scout-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right, rgba(255,196,77,.22), transparent 35%);opacity:.8;pointer-events:none}
.scout-card .rarity{font-family:var(--num);letter-spacing:.18em;color:var(--imp);margin-bottom:8px}
.scout-card .newtag{display:inline-block;padding:3px 8px;border-radius:999px;background:rgba(63,217,255,.18);color:#b9f7ff;font-size:11px;font-weight:700;margin-bottom:8px}
.scout-card .dupetag{display:inline-block;padding:3px 8px;border-radius:999px;background:rgba(255,122,107,.18);color:var(--warn);font-size:11px;font-weight:700;margin-bottom:8px}
.scout-card .pl-name{font-size:18px;font-weight:800;letter-spacing:.01em;margin-bottom:6px}
.scout-card .pl-details{display:flex;flex-wrap:wrap;gap:10px;font-size:12px}
.scout-card.goldfx{animation:glowStar .9s ease forwards}
@keyframes glowStar{0%{transform:scale(0.98);filter:blur(1px);opacity:.8}50%{transform:scale(1.02);filter:blur(0);opacity:1}100%{transform:scale(1);opacity:1}}
.material-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.material-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(10,17,32,.82);display:flex;justify-content:space-between;align-items:center;gap:10px}
.material-card strong{color:var(--tx)}
.material-card span{font-family:var(--num);color:var(--cy)}
.material-card.rare{border-color:rgba(255,196,77,.35);box-shadow:0 0 8px rgba(255,196,77,.18)}
.gauge-outer{border:1px solid var(--line);border-radius:10px;background:#08111f;padding:8px;margin-top:8px}
.gauge-inner{height:12px;border-radius:8px;overflow:hidden;background:#08111f}
.gauge-inner i{width:0%;height:100%;background:linear-gradient(90deg, var(--bl), var(--cy));transition:width .3s ease}
.gauge-note{font-size:12px;color:var(--mut);margin-top:6px}
.milestone{border:1px solid rgba(63,217,255,.15);border-radius:10px;padding:10px;background:rgba(63,217,255,.04);margin-top:8px;color:#c2ecff}
.milestone strong{color:var(--cy)}
/* ---------- テーブル(成績) ---------- */
table.st{width:100%;border-collapse:collapse;font-size:12.5px}
table.st th{color:var(--mut);font-weight:400;font-size:11px;border-bottom:1px solid var(--line2);padding:5px 4px;text-align:right}
table.st td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:right}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st tr.sel td{background:rgba(63,217,255,.08)}
table.st tbody tr{cursor:pointer}
/* ---------- モーダル ---------- */
#modal-root{position:fixed;inset:0;display:none;z-index:50}
#modal-root.show{display:block}
.mback{position:absolute;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(2px)}
.mbox{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,92vw);max-height:84vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line2);border-radius:14px;padding:16px;
  background:linear-gradient(165deg,#101c34,#0a1222);
  box-shadow:0 0 40px rgba(63,217,255,.12);
}
.mbox.goldfx{border-color:var(--imp);box-shadow:0 0 46px rgba(255,196,77,.35);animation:goldin .9s ease}
@keyframes goldin{0%{box-shadow:0 0 0 rgba(255,196,77,0)}45%{box-shadow:0 0 70px rgba(255,196,77,.7)}100%{box-shadow:0 0 46px rgba(255,196,77,.35)}}
.effect-card{border:1px solid rgba(72,180,255,.18);border-radius:14px;background:linear-gradient(180deg,rgba(63,217,255,.06),rgba(9,15,28,.95));padding:14px;margin:12px 0;}
.effect-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:8px;}
.effect-row span{color:var(--mut);}
.effect-text{font-size:14px;line-height:1.7;padding:12px 0;border-top:1px solid rgba(72,180,255,.1);border-bottom:1px solid rgba(72,180,255,.1);margin:12px 0;color:#eef7ff;}
.effect-result{font-size:13px;color:var(--cy);font-weight:700;text-align:right;}
.pickrow{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;margin-bottom:6px;cursor:pointer;min-height:46px;background:rgba(9,15,28,.7);
}
.pickrow:active{border-color:var(--cy)}
/* ---------- トースト/縦画面警告 ---------- */
#toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:#13223e;border:1px solid var(--cy);color:var(--tx);
  border-radius:10px;padding:9px 18px;font-size:13px;display:none;z-index:80;
  box-shadow:0 0 16px rgba(63,217,255,.3);
}
#toast.show{display:block}
#portrait-warn{
  position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:2;padding:30px;
}
@media (orientation: portrait){ #portrait-warn{display:grid} }
textarea.io{
  width:100%;height:120px;background:#070d18;color:var(--tx);border:1px solid var(--line2);
  border-radius:8px;padding:8px;font-family:var(--num);font-size:11px;
  user-select:text;-webkit-user-select:text;
}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed rgba(72,180,255,.08)}
.kv b{font-family:var(--num)}
.note{font-size:11px;color:var(--mut);line-height:1.6;margin-top:6px}
.lockline{font-size:11px;color:var(--mut)}
.lockline .pct{font-family:var(--num);color:var(--pu)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- シネマティック演出 ---------- */
.mbox.cine{width:min(720px,94vw);padding:16px;overflow:hidden;}
.cine-box{display:grid;gap:12px;}
.cine-scorebar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;}
.cine-inning,.cine-score,.cine-count{border:1px solid rgba(63,217,255,.18);border-radius:8px;background:rgba(6,14,28,.78);padding:8px 10px;}
.cine-inning{font-size:12px;color:#d8ebff;font-weight:800;letter-spacing:.04em;}
.cine-score{font-family:var(--num);font-size:18px;font-weight:900;color:#fff;min-width:104px;text-align:center;}
.cine-count{font-family:var(--num);font-size:11px;color:var(--mut);display:grid;gap:3px;min-width:110px;}
.cine-count-row{display:flex;align-items:center;gap:5px;justify-content:space-between;}
.cine-dot{width:8px;height:8px;border-radius:50%;background:rgba(220,235,255,.16);border:1px solid rgba(220,235,255,.22);display:inline-block;}
.cine-dot.on{background:var(--imp);border-color:var(--imp);box-shadow:0 0 10px rgba(255,196,77,.55);}
.cine-titleband{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(255,196,77,.18);border-radius:10px;background:linear-gradient(90deg,rgba(255,196,77,.13),rgba(63,217,255,.05));padding:10px 12px;}

function rnd(){ // mulberry32: save.rngState を進める
  let t = save.rngState = (save.rngState + 0x6D2B79F5) | 0;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rint(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function wpick(items){ // items: [{w,...}]
  const tot=items.reduce((s,x)=>s+x.w,0); let r=rnd()*tot;
  for(const x of items){ r-=x.w; if(r<=0) return x; }
  return items[items.length-1];
}

function clampN(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtAvg(v){ if(!isFinite(v))return '-'; const s=v.toFixed(3); return v<1? s.replace(/^0/,'') : s; }
function fmt2(v){ return isFinite(v)? v.toFixed(2) : '-'; }
function batView(r){
  const tb=(r.h-r.d2-r.d3-r.hr)+2*r.d2+3*r.d3+4*r.hr;
  const avg=r.ab>0? r.h/r.ab : NaN;
  const obpD=r.ab+r.bb+r.hbp+r.sf;
  const obp=obpD>0? (r.h+r.bb+r.hbp)/obpD : NaN;
  const slg=r.ab>0? tb/r.ab : NaN;
  return {avg,obp,slg,ops:(isFinite(obp)&&isFinite(slg))?obp+slg:NaN};
}
function pitView(r){
  const ip=r.outs/3;
  return {ip, era:ip>0? r.er*9/ip:NaN, whip:ip>0?(r.bb+r.h)/ip:NaN,
    k9:ip>0? r.so*9/ip:NaN, bb9:ip>0? r.bb*9/ip:NaN};
}
function fmtIp(outs){ return Math.floor(outs/3)+(outs%3? '.'+(outs%3):''); }
function teamPower(){
  let b=0,bc=0,p=0,pc=0;
  for(const pl of save.players){
    if(pl.isPitcher){ p+=(pl.ab.velocity+pl.ab.control+pl.ab.breaking+pl.ab.stamina+pl.ab.mental)/5; pc++; }
    else{ b+=(pl.ab.contact+pl.ab.power+pl.ab.speed+pl.ab.defense+pl.ab.eye)/5; bc++; }
  }
  return Math.round((bc?b/bc:0)*0.6+(pc?p/pc:0)*0.4);
}

function fatF(pct){ return pct>=50?1: pct>=25?0.95: pct>=10?0.85:0.72; }

function ensureB(ms,pid){ if(!ms.bstats[pid]) ms.bstats[pid]={pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,runs:0,bb:0,hbp:0,so:0,sb:0,cs:0,sf:0,gidp:0}; return ms.bstats[pid]; }
function ensureP(ms,pid){ if(!ms.pstats[pid]) ms.pstats[pid]={outs:0,h:0,r:0,bb:0,so:0,hr:0}; return ms.pstats[pid]; }
function mlog(ms,inn,half,text,hl,bases){ ms.log.push({inn,half,text,hl:!!hl,bases:bases||''}); }
function tot(arr){ return arr.reduce((s,v)=>s+(typeof v==='number'?v:0),0); }
function pTot(ms){ return tot(ms.score.p); }
function nTot(ms){ return tot(ms.score.n); }
function halfLabel(inn,half){ return half==='sys'? '' : '【'+inn+'回'+(half==='top'?'表':'裏')+'】'; }

function switchPitcher(ms,pid,why){
  ms.pitcher=pid;
  if(!ms.usedPitchers.includes(pid)) ms.usedPitchers.push(pid);
  ensureP(ms,pid);
  mlog(ms,ms.inning,'sys','【継投】'+getPlayer(pid).name+'がマウンドへ('+why+')',false);
  cineCaptureChange(ms,'継投',getPlayer(pid).name,why);
}
function pAvail(ms,pid){ return pid && !ms.usedPitchers.includes(pid); }

function autoPitchCheck(ms){
  const P=save.team.lineup.pitchers, pol=save.team.pitchingPolicy;
  const i=ms.inning, lead=pTot(ms)-nTot(ms), cur=ms.pitcher, st=ms.stamina[cur];
  if(pol.useCloserOnLead && i>=9 && lead>=1 && lead<=3 && pAvail(ms,P.closer) && cur!==P.closer){
    switchPitcher(ms,P.closer,'抑え投入'); return;
  }
  if(pol.preset==='earlyRelief' && i>=7 && cur===P.starter && pAvail(ms,P.relief1)){
    switchPitcher(ms,P.relief1,'早めの継投'); return;
  }
  const startLimit = ms.starterLocked?12 : (pol.preset==='longStarter'?20:35);
  if(cur===P.starter && st<startLimit && pAvail(ms,P.relief1)){
    switchPitcher(ms,P.relief1,'スタミナ低下'); return;
  }
  const relLimit = pol.preset==='longStarter'?20:35;
  if(cur===P.relief1 && st<relLimit && pAvail(ms,P.relief2)){
    switchPitcher(ms,P.relief2,'スタミナ低下'); return;
  }
}
function defenseSubCheck(ms){
  if(ms.inning!==8) return;
  if(pTot(ms)<=nTot(ms)) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='defenseSub');
  if(!slot) return;
  const cand=getPlayer(slot.pid);
  let worstIdx=-1,worst=999;
  ms.order.forEach((pid,idx)=>{
    if(ms.positions[pid]==='DH') return;
    const d=getPlayer(pid).ab.defense;
    if(d<worst){worst=d;worstIdx=idx;}
  });
  if(worstIdx<0 || cand.ab.defense < worst+BAL.dsDiff) return;
  const outPid=ms.order[worstIdx];
  ms.positions[cand.id]=ms.positions[outPid]; delete ms.positions[outPid];
  ms.order[worstIdx]=cand.id; slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'守備固め',inP:cand.name,outP:getPlayer(outPid).name});
  mlog(ms,ms.inning,'sys','【守備固め】'+cand.name+'('+getPlayer(outPid).name+'に代えて)',false);
  cineCaptureChange(ms,'守備固め',cand.name,getPlayer(outPid).name+'に代えて');
}
function pinchHitCheck(ms){
  if(ms.inning<7) return;
  const diff=pTot(ms)-nTot(ms);
  if(diff>0 || diff<-3) return;
  if(!ms.bases[1] && !ms.bases[2]) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='pinchHitter');
  if(!slot) return;
  const idx=ms.batIdx.p%9, curPid=ms.order[idx];
  const cur=getPlayer(curPid), cand=getPlayer(slot.pid);
  if(cand.ab.contact+cand.ab.power < cur.ab.contact+cur.ab.power+BAL.phDiff) return;
  ms.positions[cand.id]=ms.positions[curPid]; delete ms.positions[curPid];
  ms.order[idx]=cand.id; slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'代打',inP:cand.name,outP:cur.name});
  mlog(ms,ms.inning,'sys','【代打】'+cand.name+'('+cur.name+'に代えて)',false);
  cineCaptureChange(ms,'代打',cand.name,cur.name+'に代えて');
}
function pinchRunCheck(ms,batPid){
  if(ms.inning<7) return;
  const diff=Math.abs(pTot(ms)-nTot(ms));
  if(diff>2) return;
  const bi=ms.bases.findIndex(r=>r && r.pid===batPid);
  if(bi<0) return;
  const runner=ms.bases[bi];
  if(runner.speed>=60) return;
  const slot=ms.bench.find(b=>!b.used && b.role==='pinchRunner');
  if(!slot) return;
  const cand=getPlayer(slot.pid);
  if(cand.ab.speed < runner.speed+BAL.prDiff) return;
  const idx=ms.order.indexOf(batPid);
  if(idx>=0){
    ms.positions[cand.id]=ms.positions[batPid]; delete ms.positions[batPid];
    ms.order[idx]=cand.id;
  }
  ms.bases[bi]={pid:cand.id,name:cand.name,speed:cand.ab.speed,side:'p'};
  slot.used=true; ensureB(ms,cand.id);
  ms.benchEvents.push({inn:ms.inning,type:'代走',inP:cand.name,outP:runner.name});
  mlog(ms,ms.inning,'sys','【代走】'+cand.name+'('+runner.name+'に代えて)',false);
  cineCaptureChange(ms,'代走',cand.name,runner.name+'に代えて');
}

function resolvePA(bt,pit,fat){
  const pv=(pit.velocity*0.5+pit.breaking*0.5)*fat;
  const pc=pit.control*fat;
  const kP=clampN(0.16+(pv-bt.contact)*0.0022,0.07,0.34);
  const bbP=clampN(0.08+(bt.eye-pc)*0.0018,0.025,0.17);
  const hbpP=0.008;
  const r=rnd();
  if(r<kP) return 'K';
  if(r<kP+bbP) return 'BB';
  if(r<kP+bbP+hbpP) return 'HBP';
  const hitP=clampN(0.30+(bt.contact-pv)*0.0022,0.18,0.44);
  if(rnd()<hitP){
    const r2=rnd();
    const hrP=clampN(0.04+(bt.power-45)*0.005,0.02,0.32);
    const tpP=0.015+bt.speed*0.0004;
    const dbP=0.16+bt.power*0.0012;
    if(r2<hrP) return 'HR';
    if(r2<hrP+tpP) return '3B';
    if(r2<hrP+tpP+dbP) return '2B';
    return '1B';
  }
  return 'OUT';
}

function doPA(ms,half){
  const playerBat = half==='bottom';
  const opp=oppData(ms.oppId);
  const baseState = ms.bases.map(r=>r? (r.side==='p'?getPlayer(r.pid).name:r.name) : '-').join(' / ');
  const scoreBefore = pTot(ms) - nTot(ms);
  // 投手側
  let pit,fat,pitPid=null,pitRole='starter',pitSta;
  if(playerBat){ pit=opp.pit; pitSta=opp.pit.stamina; fat=fatF(ms.npcStamina); }
  else{
    const pl=getPlayer(ms.pitcher);
    pit=pl.ab; pitSta=pl.ab.stamina; pitPid=pl.id; pitRole=pl.role; fat=fatF(ms.stamina[pitPid]);
  }
  // 打者側(代打チェック→決定)
  if(playerBat) pinchHitCheck(ms);
  let bt;
  if(playerBat){
    const pid=ms.order[ms.batIdx.p%9]; const pl=getPlayer(pid);
    bt={pid,name:pl.name,contact:pl.ab.contact,power:pl.ab.power,speed:pl.ab.speed,eye:pl.ab.eye,side:'p'};
  }else{
    const b=opp.bats[ms.batIdx.n%9];
    bt={pid:null,name:b.name,contact:b.contact,power:b.power,speed:b.speed,eye:b.eye,side:'n'};
  }
  const bs = playerBat? ensureB(ms,bt.pid) : null;
  const ps = (!playerBat && pitPid)? ensureP(ms,pitPid) : null;

  // 盗塁試行(1塁のみ・2アウト未満・俊足)
  const B=ms.bases;
  if(B[0] && !B[1] && !B[2] && ms.outs<2 && B[0].speed>=68 && rnd()<0.08){
    const stealRunner = B[0];
    const ok=rnd()<clampN(0.45+B[0].speed*0.004,0.5,0.85);
    if(ok){
      mlog(ms,ms.inning,half,B[0].name+'が二盗成功！',false);
      if(B[0].side==='p') ensureB(ms,B[0].pid).sb++;
      B[1]=B[0]; B[0]=null;
      cineCaptureSteal(ms,half,stealRunner,true);
    }else{
      mlog(ms,ms.inning,half,B[0].name+'は盗塁失敗…',false);
      if(B[0].side==='p') ensureB(ms,B[0].pid).cs++;
      B[0]=null; ms.outs++;
      cineCaptureSteal(ms,half,stealRunner,false);
      if(ms.outs>=3){ if(!playerBat&&ps)ps.outs++; consumeStamina(ms,playerBat,pitRole,pitSta,1,false,0); ms.batIdxNote=true; return; }
      if(!playerBat&&ps)ps.outs++;
    }
  }

  const res=resolvePA(bt,pit,fat);
  let runsPA=0, outsGained=0, reached=false, text='', hl=false, isDP=false, isSF=false;

  const scoreRun=(runner)=>{
    const idx=ms.inning-1;
    const arr= playerBat? ms.score.p : ms.score.n;
    arr[idx]=(typeof arr[idx]==='number'?arr[idx]:0)+1;
    runsPA++;
    if(runner && runner.side==='p') ensureB(ms,runner.pid).runs++;
    if(playerBat && ms.inning>=9 && pTot(ms)>nTot(ms)) ms._wo=true;
  };
  const runnerObj=()=>({pid:bt.pid,name:bt.name,speed:bt.speed,side:bt.side});

  if(res==='K'){
    outsGained=1; ms.outs++;
    text=pick(['空振り三振','見逃し三振']);
    if(bs){bs.pa++;bs.ab++;bs.so++;}
    if(ps){ps.outs++;ps.so++;}
  }
  else if(res==='BB'||res==='HBP'){
    reached=true;
    text= res==='BB'?'四球を選ぶ':'死球';
    if(B[0]){ if(B[1]){ if(B[2]) scoreRun(B[2]); B[2]=B[1]; } B[1]=B[0]; }
    B[0]=runnerObj();
    if(bs){bs.pa++; if(res==='BB')bs.bb++; else bs.hbp++; bs.rbi+=runsPA;}
    if(ps && res==='BB') ps.bb++;
    if(ps) ps.r+=runsPA;
  }
  else if(res==='HR'){
    reached=true; hl=true;
    let cnt=1;
    [2,1,0].forEach(i=>{ if(B[i]){scoreRun(B[i]);B[i]=null;cnt++;} });
    scoreRun(runnerObj());
    text= cnt>1? '◆'+cnt+'ランホームラン！！' : '◆ソロホームラン！！';
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.hr++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.hr++;ps.r+=runsPA;}
  }
  else if(res==='3B'){
    reached=true;
    [2,1,0].forEach(i=>{ if(B[i]){scoreRun(B[i]);B[i]=null;} });
    B[2]=runnerObj();
    text='フェンス直撃の三塁打！';
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.d3++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else if(res==='2B'){
    reached=true;
    if(B[2]){scoreRun(B[2]);B[2]=null;}
    if(B[1]){scoreRun(B[1]);B[1]=null;}
    if(B[0]){
      const r1=B[0]; B[0]=null;
      if(r1.speed>=60 && rnd()<0.45) scoreRun(r1); else B[2]=r1;
    }
    B[1]=runnerObj();
    text=pick(['左中間を破る二塁打','右中間への二塁打','フェンス直撃の二塁打']);
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.d2++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else if(res==='1B'){
    reached=true;
    if(B[2]){scoreRun(B[2]);B[2]=null;}
    if(B[1]){
      const r2=B[1]; B[1]=null;
      if(rnd()<0.35+r2.speed*0.004) scoreRun(r2); else B[2]=r2;
    }
    if(B[0]){ B[1]=B[0]; B[0]=null; }
    B[0]=runnerObj();
    text=pick(['レフト前ヒット','センター前ヒット','ライト前ヒット']);
    if(playerBat)ms.hits.p++; else ms.hits.n++;
    if(bs){bs.pa++;bs.ab++;bs.h++;bs.rbi+=runsPA;}
    if(ps){ps.h++;ps.r+=runsPA;}
  }
  else{ // OUT
    if(B[0] && ms.outs<2 && rnd()<0.30){
      isDP=true; outsGained=2; ms.outs+=2; B[0]=null;
      text='併殺打…';
      if(bs){bs.pa++;bs.ab++;bs.gidp++;}
      if(ps)ps.outs+=2;
    }
    else if(B[2] && ms.outs<2 && rnd()<0.28){
      isSF=true; outsGained=1; ms.outs++;
      scoreRun(B[2]); B[2]=null;
      text='犠牲フライ';
      if(bs){bs.pa++;bs.sf++;bs.rbi+=runsPA;}
      if(ps){ps.outs++;ps.r+=runsPA;}
    }
    else{
      outsGained=1; ms.outs++;
      text=pick(['ショートゴロ','セカンドゴロ','サードゴロ','センターフライ','レフトフライ','ファーストゴロ']);
      if(bs){bs.pa++;bs.ab++;}
      if(ps)ps.outs++;
    }
  }
  if(runsPA>0){ text+='（'+runsPA+'点）'; hl=true; }
  mlog(ms,ms.inning,half,bt.name+'：'+text,hl,baseState);
  cineSnap(ms,half,bt,res,{runs:runsPA,baseState,scoreBefore,pitcherName: playerBat ? opp.pit.name : getPlayer(ms.pitcher).name, outcomeText:text, wasDP:isDP, wasSF:isSF, isWalkoff:ms._wo});

  consumeStamina(ms,playerBat,pitRole,pitSta,outsGained,reached,runsPA);

  // 代走チェック(打者が出塁した場合)
  if(playerBat && reached && !ms._wo) pinchRunCheck(ms,bt.pid);

  if(playerBat) ms.batIdx.p++; else ms.batIdx.n++;
}
function consumeStamina(ms,playerBat,role,staAb,outs,reached,runs){
  let c=(outs*2+(reached?3:0)+runs*2)*(1-staAb/250);
  if(role==='reliever'||role==='closer') c*=1.5;
  if(playerBat){ ms.npcStamina=Math.max(0,ms.npcStamina-c); }
  else{ ms.stamina[ms.pitcher]=Math.max(0,ms.stamina[ms.pitcher]-c); }
}

function simHalf(ms,half){
  while(ms.outs<3 && !ms.finished){
    doPA(ms,half);
    if(ms._wo){
      ms._wo=false;
      mlog(ms,ms.inning,'sys','サヨナラ勝ち！！',true);
      finalizeMatch(ms);
      return;
    }
  }
  ms.outs=0; ms.bases=[null,null,null];
}
function playOneInning(ms){
  const i=ms.inning;
  if(typeof ms.score.n[i-1]!=='number') ms.score.n[i-1]=0;
  autoPitchCheck(ms);
  defenseSubCheck(ms);
  simHalf(ms,'top');
  if(ms.finished) return;
  if(i>=9 && pTot(ms)>nTot(ms)){ ms.score.p[i-1]='X'; finalizeMatch(ms); return; }
  if(typeof ms.score.p[i-1]!=='number') ms.score.p[i-1]=0;
  simHalf(ms,'bottom');
  if(ms.finished) return;
  if(i>=9 && pTot(ms)!==nTot(ms)){ finalizeMatch(ms); return; }
  if(i>=12){ finalizeMatch(ms); return; }
  ms.inning++;
}
function maybeDecision(ms){
  if(ms.decisionUsed || ms.finished) return;
  const P=save.team.lineup.pitchers;
  if(ms.pitcher!==P.starter) return;
  if(ms.stamina[P.starter]>=BAL.decideStamina) return;
  const opts=[{id:'continue',label:'続投する',hint:'残スタミナ '+Math.round(ms.stamina[P.starter])+'%'}];
  if(pAvail(ms,P.relief1)) opts.push({id:P.relief1,label:'中継ぎ1：'+getPlayer(P.relief1).name,hint:'スタミナ100%'});
  if(pAvail(ms,P.relief2)) opts.push({id:P.relief2,label:'中継ぎ2：'+getPlayer(P.relief2).name,hint:'スタミナ100%'});
  if(opts.length<2) return;
  ms.pendingDecision={type:'relief',options:opts};
  mlog(ms,6,'sys','── 6回終了。先発のスタミナが低下しています。継投を判断してください ──',false);
}
function resolveDecision(opt){
  const ms=save.activeMatch;
  if(!ms || !ms.pendingDecision) return;
  ms.pendingDecision=null; ms.decisionUsed=true;
  if(opt==='continue'){ ms.starterLocked=true; mlog(ms,6,'sys','【判断】先発が続投',false); }
  else switchPitcher(ms,opt,'監督判断');
  persist(); render();
}
function advanceMatch(full){
  const ms=save.activeMatch;
  if(!ms || ms.finished || ms.pendingDecision) return;
  const startLog = ms.log.length;
  while(true){
    const target = ms.chunk<3 ? [3,6,9][ms.chunk] : ms.inning;
    while(!ms.finished && ms.inning<=target) playOneInning(ms);
    if(!ms.finished && ms.chunk<3) ms.chunk++;
    if(!ms.finished && ms.chunk===2 && !ms.decisionUsed) maybeDecision(ms);
    if(ms.finished || ms.pendingDecision || !full) break;
    if(ms.chunk<3) continue;
    // 延長: fullの場合は決着まで1イニングずつ
  }
  if(ms.log.length>startLog){
    buildCinematicQueue(ms,startLog);
    if(ms.effectQueue && ms.effectQueue.length){
      UI.modal={kind:'matchEffect'};
    }
  }
  persist(); render();
}
function finalizeMatch(ms){
  if(ms.finished) return;
  ms.finished=true;
  const p=pTot(ms), n=nTot(ms);
  const outcome = p>n?'win': p<n?'lose':'draw';
  const P=save.team.lineup.pitchers;
  // 勝敗投手の簡易判定(v0.1: 勝利=最多アウト投手 / 敗戦=最多失点投手 / S=抑えが勝利試合を締め3点差以内)
  let winP=null,loseP=null,saveP=null;
  const pids=Object.keys(ms.pstats);
  if(outcome==='win' && pids.length){
    winP=pids.reduce((a,b)=>ms.pstats[a].outs>=ms.pstats[b].outs?a:b);
    const last=ms.pitcher;
    if(last===P.closer && winP!==P.closer && (p-n)<=3) saveP=P.closer;
  }
  if(outcome==='lose' && pids.length){
    loseP=pids.reduce((a,b)=>ms.pstats[a].r>=ms.pstats[b].r?a:b);
  }
  // シーズン成績へ反映
  const mult=trainMult();
  const expList=[];
  for(const pid of Object.keys(ms.bstats)){
    const t=ms.bstats[pid], pl=getPlayer(pid); if(!pl||pl.isPitcher) continue;
    const r=pl.sb_;
    r.games++; r.pa+=t.pa; r.ab+=t.ab; r.h+=t.h; r.d2+=t.d2; r.d3+=t.d3; r.hr+=t.hr;
    r.rbi+=t.rbi; r.runs+=t.runs; r.bb+=t.bb; r.hbp+=t.hbp; r.so+=t.so;
    r.sb+=t.sb; r.cs+=t.cs; r.sf+=t.sf; r.gidp+=t.gidp;
    const e=Math.round((15+t.h*8+t.hr*12+t.rbi*5+t.bb*2+t.sb*4+t.runs*3)*mult);
    pl.exp+=e; expList.push({name:pl.name,exp:e});
  }
  for(const pid of pids){
    const t=ms.pstats[pid], pl=getPlayer(pid); if(!pl) continue;
    const r=pl.sp;
    r.games++; r.outs+=t.outs; r.h+=t.h; r.er+=t.r; r.bb+=t.bb; r.so+=t.so; r.hr+=t.hr;
    const isW=pid===winP, isS=pid===saveP;
    if(isW) r.wins++;
    if(pid===loseP) r.losses++;
    if(isS) r.saves++;
    const e=Math.round((15+t.outs*1.5+t.so*3+(isW?20:0)+(isS?15:0))*mult);
    pl.exp+=e; expList.push({name:pl.name,exp:e});
  }
  // 報酬
  const credits = outcome==='win'? BAL.rewardWin+ms.hits.p*6
                : outcome==='draw'? BAL.rewardDraw+ms.hits.p*4
                : BAL.rewardLose+ms.hits.p*4;
  save.team.credits+=credits;
  // MVP
  let mvp='—',best=-1;
  for(const pid of Object.keys(ms.bstats)){
    const t=ms.bstats[pid], sc=t.h+t.hr*2+t.rbi;
    if(sc>best){best=sc;mvp=getPlayer(pid)?getPlayer(pid).name:'—';}
  }
  const oppName=NPC_TEAMS[ms.oppId].name;
  const title = outcome==='win' ? `${oppName} に勝利！` : outcome==='lose' ? `${oppName} に敗北` : `${oppName} と引き分け`;
  ms.result={outcome,p,n,credits,mvp,expList,oppName,
    winP:winP?getPlayer(winP).name:null, saveP:saveP?getPlayer(saveP).name:null};
  UI.modal={kind:'matchResult'};
  save.recentResults.unshift({opp:oppName,score:p+' - '+n,outcome});
  if(save.recentResults.length>10) save.recentResults.length=10;
  addNews(`${mvp} が活躍して ${title}`);
  mlog(ms,ms.inning,'sys','試合終了 '+p+' - '+n+'（'+(outcome==='win'?'勝利':outcome==='lose'?'敗北':'引き分け')+'）',outcome==='win');
}
function closeMatch(){ save.activeMatch=null; persist(); render(); }
function buildMatchEffects(ms,startIndex){
  const events=[];
  for(let i=startIndex;i<ms.log.length;i++){
    if(events.length>=3) break;
    const entry=ms.log[i];
    const txt=entry.text;
    const meta={label:'PLAY',type:'normal',actor:'',pitcher:'',bases:entry.bases||'',desc:txt, result:txt};
    if(/ホームラン/.test(txt)){
      meta.label='HOMERUN'; meta.type='homerun';
    } else if(/三塁打|二塁打/.test(txt)){
      meta.label='CLUTCH'; meta.type='extra';
    } else if(/逆転|同点|サヨナラ/.test(txt)){
      meta.label='CLUTCH'; meta.type='clutch';
    } else if(/ピンチ|三振|併殺/.test(txt)){
      meta.label='PINCH'; meta.type='pinch';
    } else if(/点/.test(txt) && /点/.test(txt)){
      meta.label='+RUNS'; meta.type='score';
    } else if(/代打|継投|代走/.test(txt)){
      meta.label='CHANGE'; meta.type='change';
    } else {
      continue;
    }
    const names = txt.split('：');
    if(names.length>1){ meta.actor=names[0]; }
    meta.pitcher = '相手投手';
    events.push(meta);
  }
  if(events.length===0){
    events.push({label:'CALM',type:'calm',actor:'',pitcher:'',bases:'',desc:'静かな立ち上がり。両チームとも慎重に攻めている。',result:'次のイニングへ'});
  }
  ms.effectQueue = events;
  ms.effectIndex = 0;
}
function nextMatchEffect(){
  const ms=save.activeMatch;
  if(!ms || !ms.effectQueue) return;
  ms.effectIndex = (ms.effectIndex||0) + 1;
  if(ms.effectIndex >= ms.effectQueue.length){
    if(ms.finished) { UI.modal={kind:'matchResult'}; }
    else { UI.modal={kind:'matchSummary'}; }

}

const CINE_MAX_EVENTS = 3;
const CINE_MIN_PRIO = 35;
const CINE_SIGNATURES = {};

function ensureCinematic(ms){
  if(!ms) return;
  if(!Object.prototype.hasOwnProperty.call(ms,'cineRaw')){

function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function cineScoreSnap(ms){ return {p:pTot(ms),n:nTot(ms)}; }
function cineBasesSnap(ms){

}
function cineBaseTextFromSnap(bases){

function cineHalfText(half){

function cineBasesFromText(text){
  const bases = [null,null,null];
  const s = String(text||'');
  [1,2,3].forEach(n=>{
    const m = s.match(new RegExp(n+'塁[:：]?([^/]+)'));
    if(m){
      const name = m[1].trim();
      if(name && name !== '--' && name !== '-' && name !== '—') bases[n-1] = name;

function cineDisplayLabel(evt){
  if(!evt) return 'PLAY';
  if(evt.displayLabel) return evt.displayLabel;
  if(evt.type==='walkoff') return 'WALK-OFF';
  if(evt.type==='homerun') return evt.runs>=4 ? 'GRAND SLAM' : 'HOME RUN';
  if(evt.type==='score') return evt.runs ? `${evt.runs}-RUN HIT` : '+RUNS';
  if(evt.type==='sf') return 'SAC FLY';
  if(evt.type==='dp') return 'DOUBLE PLAY';
  if(evt.type==='k') return 'STRIKEOUT';
  if(evt.type==='steal') return 'STEAL';

  return evt.label || 'PLAY';
}
function cineHeadline(evt){
  const runs = evt && evt.runs ? Number(evt.runs) : 0;
  const raw = String(evt.desc || evt.result || '');
  const play = raw.includes('が ') ? raw.split('が ').slice(1).join('が ').split('。')[0] : raw.split('。')[0];
  if(evt.type==='homerun') return runs>1 ? `${runs}点ホームラン` : 'ホームラン';
  if(evt.type==='score') return runs>0 ? `${play.replace(/（.*?）/g,'')}で${runs}点追加` : '得点';
  if(evt.type==='sf') return runs>0 ? `犠牲フライで${runs}点` : '犠牲フライ';
  if(evt.type==='dp') return '併殺打';
  if(evt.type==='k') return '三振';
  if(evt.type==='steal') return '盗塁成功';
  if(evt.type==='stealFail') return '盗塁失敗';
  return play || evt.desc || evt.result || cineDisplayLabel(evt);
}
function cineTrajectoryClass(evt){
  if(!evt) return '';
  if(evt.type==='homerun') return 'homerun';
  if(['triple','double','score','sf'].includes(evt.type)) return 'hit';
  if(evt.type==='k') return 'k';
  if(evt.type==='steal' || evt.type==='stealFail') return 'steal';
  if(evt.type==='dp') return 'dp';

}
function cineBattedBallInfo(evt){
  const text = `${evt.resultText||''} ${evt.desc||''} ${evt.label||''}`;
  const extraBaseHit = /二塁打|三塁打/.test(text);
  let fieldZone = 'center';
  let depth = 'medium';
  let battedBallType = 'liner';
  if(/レフト|左翼|左中間/.test(text)) fieldZone = /左中間/.test(text) ? 'leftCenter' : 'left';
  else if(/ライト|右翼|右中間/.test(text)) fieldZone = /右中間/.test(text) ? 'rightCenter' : 'right';
  else if(/センター|中堅/.test(text)) fieldZone = 'center';
  else if(!extraBaseHit && /サード|三塁/.test(text)) fieldZone = 'infieldLeft';
  else if(/ショート|遊撃/.test(text)) fieldZone = 'infieldLeft';
  else if(!extraBaseHit && /セカンド|二塁/.test(text)) fieldZone = 'infieldRight';
  else if(/ファースト|一塁/.test(text)) fieldZone = 'infieldRight';

  if(evt.type==='homerun' || /ホームラン/.test(text)){ battedBallType = 'homer'; depth = 'deep'; }
  else if(/フライ|犠牲フライ/.test(text) || evt.type==='sf'){ battedBallType = 'fly'; depth = /フェンス|深/.test(text) ? 'deep' : 'medium'; }
  else if(/ゴロ/.test(text)){ battedBallType = 'grounder'; depth = 'infield'; }
  else if(/三塁打/.test(text)){ battedBallType = 'liner'; depth = 'deep'; if(fieldZone==='center') fieldZone='rightCenter'; }
  else if(/二塁打|フェンス/.test(text)){ battedBallType = 'liner'; depth = 'deep'; if(fieldZone==='center') fieldZone='leftCenter'; }
  else if(/前ヒット|ヒット/.test(text)){ battedBallType = 'liner'; depth = 'shallow'; }
  else return null;

  const points = {
    left:{shallow:[-58,-96],medium:[-78,-124],deep:[-88,-154]},
    leftCenter:{shallow:[-36,-106],medium:[-58,-132],deep:[-68,-160]},
    center:{shallow:[0,-108],medium:[0,-138],deep:[0,-168]},
    rightCenter:{shallow:[36,-106],medium:[58,-132],deep:[68,-160]},
    right:{shallow:[58,-96],medium:[78,-124],deep:[88,-154]},
    infieldLeft:{infield:[-45,-55],shallow:[-45,-55],medium:[-48,-66],deep:[-58,-82]},
    infieldCenter:{infield:[0,-62],shallow:[0,-62],medium:[0,-78],deep:[0,-95]},
    infieldRight:{infield:[45,-55],shallow:[45,-55],medium:[48,-66],deep:[58,-82]},
  };
  const zonePoints = points[fieldZone] || points.center;
  const point = zonePoints[depth] || zonePoints.medium || points.center.medium;
  const x = point[0], y = point[1];
  const len = Math.max(1,Math.round(Math.sqrt(x*x+y*y)));
  const rot = Math.round(Math.atan2(y,x) * 180 / Math.PI);
  return {fieldZone,depth,battedBallType,x,y,len,rot};
}
function cineBattedStyle(info){
  if(!info) return '';
  return `--x:${info.x}px;--y:${info.y}px;--len:${info.len}px;--rot:${info.rot}deg`;
}
function cineOutDots(outs){
  const o = typeof outs === 'number' ? Math.max(0,Math.min(3,outs)) : 0;
  return [0,1,2].map(i=>`<span class="cine-dot${i<o?' on':''}"></span>`).join('');
}
function pushCinematicEvent(ms,evt){
  ensureCinematic(ms);
  if(!evt || typeof evt !== 'object') return;
  if(!evt.scoreAfter) evt.scoreAfter = cineScoreSnap(ms);
  if(!evt.basesAfter) evt.basesAfter = cineBasesSnap(ms);
  if(typeof evt.outsAfter !== 'number') evt.outsAfter = ms.outs || 0;
  if(typeof evt.inning !== 'number') evt.inning = ms.inning || 1;
  if(!evt.half) evt.half = 'sys';
  evt.cine = true;
  evt.seq = ms.cineRaw.length;
  ms.cineRaw.push(evt);
}
function cineCapturePA(ms,half,bt,res,info){
  ensureCinematic(ms);
  if(!ms || !bt) return;
  const scoreBefore = info.scoreBefore || 0;
  const scoreDiffAfter = pTot(ms) - nTot(ms);
  const actor = bt.name || '打者';
  const pitcher = info.pitcherName || '相手投手';
  const scoreSnap = cineScoreSnap(ms);
  const basesSnap = cineBasesSnap(ms);
  const baseAfter = cineBaseTextFromSnap(basesSnap);
  const tags = [];
  let label = 'PLAY';
  let type = 'calm';
  let prio = 0;
  let theme = '';
  if(info.isWalkoff){ label='WALK-OFF'; type='walkoff'; prio=130; theme='t-walkoff'; tags.push('サヨナラ'); }
  else if(res==='HR'){ label=info.runs>=4?'GRAND SLAM':'HOME RUN'; type='homerun'; prio=100 + (bt.power>=62?10:0); theme='t-homerun'; }
  else if(res==='3B'){ label='TRIPLE'; type='triple'; prio=60; }
  else if(res==='2B'){ label='DOUBLE'; type='double'; prio=52; }
  else if(info.wasSF){ label='SAC FLY'; type='sf'; prio=50; }
  else if(info.runs>0){ label=`${info.runs}-RUN HIT`; type='score'; prio=48 + Math.min(info.runs*4,12); theme='t-score'; }
  else if(info.wasDP){ label='DOUBLE PLAY'; type='dp'; prio=48; }
  else if(res==='K' && /1塁|2塁|3塁/.test(info.baseState || '')){ label='STRIKEOUT'; type='k'; prio=44; theme='t-k'; }
  else { return; }
  if(scoreBefore < 0 && scoreDiffAfter >= 0){ tags.push('逆転'); prio += 25; }
  else if(scoreBefore === 0 && scoreDiffAfter > 0){ tags.push('先制'); prio += 10; }
  else if(scoreBefore > 0 && scoreDiffAfter === 0){ tags.push('同点'); prio += 10; }
  if(info.runs > 0) tags.push('得点');

  const resultText = info.outcomeText||info.resultText||res;
  const ballInfo = cineBattedBallInfo({type,label,desc,resultText,runs:info.runs||0});
  pushCinematicEvent(ms,{label,displayLabel:label,type,inning:ms.inning,half,actor,pitcher,bases:baseAfter,basesAfter:basesSnap,outsAfter:ms.outs,scoreAfter:scoreSnap,runs:info.runs||0,desc,result,resultText,battedBallType:ballInfo&&ballInfo.battedBallType,fieldZone:ballInfo&&ballInfo.fieldZone,depth:ballInfo&&ballInfo.depth,prio,theme,tags});
}

function buildCinematicQueue(ms,startIndex){
  ensureCinematic(ms);
  const candidates = (ms.cineRaw||[]).filter(evt=>typeof evt.prio==='number' && evt.prio>=CINE_MIN_PRIO);
  ms.cineRaw.length = 0;
  if(candidates.length){
    candidates.sort((a,b)=>{ const diff=b.prio-a.prio; return diff || (a.seq - b.seq); });
    ms.effectQueue = candidates.slice(0,CINE_MAX_EVENTS);
    ms.effectIndex = 0;
    return;
  }
  buildMatchEffects(ms,startIndex);
}

/* ===== 6. 探索エンジン ===================================== */
function aptFactor(planet,pids){
  let sum=0;
  for(const pid of pids){
    const pl=getPlayer(pid);
    let sc=0;
    for(const [bk,pk,w] of planet.apt){
      const v = pl.isPitcher? pl.ab[pk] : pl.ab[bk];
      sc+=(v||0)*w;
    }
    if(pl.type===planet.type) sc*=1.1;
    sum+=sc;
  }
  const avg=clampN(sum/pids.length,0,100);
  return 0.8+avg/100*0.5;
}
function unlockedDrops(planetId){
  const sr=save.planetProgress[planetId].surveyRate;
  return PLANETS[planetId].drops.filter(d=>sr>=d.u);
}
function startExpedition(planetId,pids){
  const pl=PLANETS[planetId];
  const ex={
    planetId, party:pids.slice(), apt:aptFactor(pl,pids),
    step:0, total:rint(5,8),
    results:[], pend:null,
    gains:{}, survey:0,
    finished:false, retreated:false, result:null,
  };
  save.activeExpedition=ex;
  save.lastParty=pids.slice();
  persist();
}
function gainMat(ex,mid,qty){ ex.gains[mid]=(ex.gains[mid]||0)+qty; }
function dropOnce(ex){
  const sr=save.planetProgress[ex.planetId].surveyRate;
  const ent=wpick(unlockedDrops(ex.planetId));
  const qty=Math.max(1,Math.round(rint(ent.min,ent.max)*ex.apt*(1+sr*0.002)));
  gainMat(ex,ent.m,qty);
  return {mid:ent.m,qty};
}
function openExploreEffect(desc){
  const ex=save.activeExpedition;
  if(!ex) return;
  const pl=PLANETS[ex.planetId];
  UI.modal={kind:'exploreEffect',res:{desc, gains:ex.gains, survey:ex.survey, planet:pl.name}};
  render();
}
function stepExpedition(){
  const ex=save.activeExpedition;
  if(!ex || ex.finished || ex.pend) return;
  ex.step++; ex.survey+=BAL.surveyStep;
  const pl=PLANETS[ex.planetId];
  const r=rnd();
  if(r<0.25){
    const okP=clampN(0.35+(ex.apt-0.8)*1.2,0.35,0.9);
    ex.pend={
      text:pick(pl.events),
      okP,
      options:[
        {id:'safe',label:'安全に調査する',hint:'素材を確実に獲得 / 調査率+'+BAL.surveySafe+'%'},
        {id:'deep',label:'深部へ進む',hint:'レア素材の可能性(成功率'+Math.round(okP*100)+'%)'},
        {id:'data',label:'データだけ回収する',hint:'素材なし / 調査率+'+BAL.surveyData+'%'},
      ],
    };
    ex.results.push({step:ex.step,text:'❖ '+ex.pend.text,ev:true});
    persist();
    UI.modal={kind:'exploreChoice',pend:ex.pend,planet:pl.name};
    render();
    return;
  }
  let message='';
  if(r<0.45){
    message=pick(STEP_NOTHING);
    ex.results.push({step:ex.step,text:message});
  }
  else{
    const d=dropOnce(ex);
    message=MATERIALS[d.mid].name+' ×'+d.qty+' を採取';
    ex.results.push({step:ex.step,text:message});
  }
  if(ex.step>=ex.total) finishExpedition(true);
  persist();
  openExploreEffect(message);
}
function chooseExpedition(optId){
  const ex=save.activeExpedition;
  if(!ex || !ex.pend) return;
  const pl=PLANETS[ex.planetId];
  let txt='';
  if(optId==='safe'){
    const bases=pl.drops.filter(d=>d.u===0);
    const ent=pick(bases);
    const qty=2+(ex.apt>1.05?1:0);
    gainMat(ex,ent.m,qty);
    ex.survey+=BAL.surveySafe;
    txt='慎重に調査。'+MATERIALS[ent.m].name+' ×'+qty+' を確保（調査率+'+BAL.surveySafe+'%）';
  }
  else if(optId==='deep'){
    if(rnd()<ex.pend.okP){
      const un=unlockedDrops(ex.planetId);
      const rare=un.reduce((a,b)=>MATERIALS[a.m].r>=MATERIALS[b.m].r?a:b);
      const qty=rint(2,3);
      gainMat(ex,rare.m,qty);
      txt='深部調査に成功！ '+MATERIALS[rare.m].name+' ×'+qty+' を発見！';
    }else{
      if(rnd()<0.5){
        const bases=pl.drops.filter(d=>d.u===0);
        const ent=pick(bases);
        gainMat(ex,ent.m,1);
        txt='深部で迷ったが、'+MATERIALS[ent.m].name+' ×1 だけ拾って引き返した。';
      }else{
        txt='深部は崩落していた。収穫なし。';
      }
    }
  }
  else{
    ex.survey+=BAL.surveyData;
    txt='周辺データをスキャン（調査率+'+BAL.surveyData+'%）';
  }
  ex.pend=null;
  ex.results.push({step:ex.step,text:'→ '+txt});
  if(ex.step>=ex.total) finishExpedition(true);
  persist();
  UI.modal={kind:'exploreEffect',res:{desc:txt,gains:ex.gains,survey:ex.survey,planet:pl.name}};
  render();
}
function retreatExpedition(){
  const ex=save.activeExpedition;
  if(!ex || ex.finished) return;
  ex.pend=null;
  finishExpedition(false);
  persist();
}
function finishExpedition(completed){
  const ex=save.activeExpedition;
  if(!ex || ex.finished) return;
  ex.finished=true; ex.retreated=!completed;
  const keep = completed? 1 : BAL.retreatKeep;
  const final={};
  for(const mid of Object.keys(ex.gains)){
    const q=Math.ceil(ex.gains[mid]*keep);
    if(q>0){ final[mid]=q; save.inventory.materials[mid]=(save.inventory.materials[mid]||0)+q; }
  }
  const sGain=ex.survey+(completed?BAL.surveyDone:0);
  const prog=save.planetProgress[ex.planetId];
  const before=prog.surveyRate;
  prog.surveyRate=Math.min(100,before+sGain);
  const unlocked=[];
  for(const th of [30,60]){
    if(before<th && prog.surveyRate>=th){
      const ent=PLANETS[ex.planetId].drops.find(d=>d.u===th);
      unlocked.push('調査率'+th+'%達成！ 新素材「'+MATERIALS[ent.m].name+'」の反応を検知');
    }
  }
  ex.result={completed,final,sGain,rate:prog.surveyRate,unlocked};
  if(Object.keys(final).length){
    const found = Object.entries(final).map(([mid,q])=>`${MATERIALS[mid].name} ×${q}`).join(' / ');
    addNews(`探索完了: ${PLANETS[ex.planetId].name} で ${found} を獲得`);
  }
}
function closeExpedition(){ save.activeExpedition=null; persist(); render(); }

/* ===== 7. スカウト/育成/施設 =============================== */
function doScout(){
  if(save.activeMatch && !save.activeMatch.finished){ toast('試合中はスカウトできません'); return; }
  if(save.team.credits<SCOUT_COST){ toast('クレジットが足りません'); return; }
  save.team.credits-=SCOUT_COST;
  const r=rnd();
  const rar = r<0.15?3 : r<0.50?2 : 1;
  const cand=SCOUT_POOL.filter(id=>PLAYER_MASTER[id].rarity===rar);
  const mid=pick(cand);
  let res;
  if(save.scout.pulledIds.includes(mid)){
    const td=SCOUT_DUPE_TD[rar];
    save.inventory.trainingData+=td;
    res={mid,rar,dupe:true,td};
  }else{
    save.scout.pulledIds.push(mid);
    save.players.push(instantiate(mid));
    res={mid,rar,dupe:false};
  }
  persist(); // 演出前に保存(引き直し防止)
  UI.modal={kind:'scoutResult',res};
  addNews(`${PLAYER_MASTER[mid].name} をスカウト${res.dupe?'し、訓練データに変換':'しました'}`);
  render();
}
function needExp(level){ return 40+(level-1)*30; }
function levelCost(level){ return 60+level*25; }
function canLevelUp(p){
  return p.level<LEVCAP[p.rarity] && p.exp>=needExp(p.level) && save.team.credits>=levelCost(p.level);
}
function levelUp(pid){
  const p=getPlayer(pid);
  if(!p || !canLevelUp(p)){ toast('経験値またはクレジットが不足しています'); return; }
  p.exp-=needExp(p.level);
  save.team.credits-=levelCost(p.level);
  p.level++;
  const g=GROWTH[p.role], cap=ABCAP[p.rarity];
  for(const k of Object.keys(g)){
    if(p.ab[k]!==undefined) p.ab[k]=Math.min(cap,p.ab[k]+g[k]);
  }
  persist();
  toast(p.name+' が Lv'+p.level+' に成長！');
  render();
}
function useTraining(pid){
  const p=getPlayer(pid);
  if(!p || save.inventory.trainingData<1){ toast('訓練データがありません'); return; }
  save.inventory.trainingData--;
  p.exp+=BAL.tdExp;
  persist(); render();
}
function facCost(fid){
  const f=FACILITIES[fid], lv=save.facilities[fid];
  if(lv>=f.max) return null;
  return f.costs[lv+1];
}
function canUpgrade(fid){
  const c=facCost(fid);
  if(!c) return false;
  if(save.team.credits<c.cr) return false;
  for(const m of Object.keys(c.mats)) if((save.inventory.materials[m]||0)<c.mats[m]) return false;
  return true;
}
function upgradeFacility(fid){
  if(!canUpgrade(fid)){ toast('強化に必要な素材かクレジットが不足しています'); return; }
  const c=facCost(fid);
  save.team.credits-=c.cr;
  for(const m of Object.keys(c.mats)) save.inventory.materials[m]-=c.mats[m];
  save.facilities[fid]++;
  persist();
  const lv=save.facilities[fid];
  toast(FACILITIES[fid].name+' が Lv'+lv+' になりました'+(lv>=FACILITIES[fid].max?'（最大）':''));
  render();
}
function sellPrice(mid){ return Math.round(SELL_BASE[MATERIALS[mid].r]*(1+0.1*(save.facilities.workshop-1))); }
function sellMaterial(mid){
  if((save.inventory.materials[mid]||0)<1) return;
  save.team.credits += sellPrice(mid);
  save.inventory.materials[mid] -= 1;
  persist();
  toast(MATERIALS[mid].name + ' を売却しました');
  render();
}

  }
  if(save.inventory.trainingData>0) tips.push({title:'育成できる',desc:`訓練データが ${save.inventory.trainingData} あります。選手を強化できます`});
  if(save.activeMatch && !save.activeMatch.finished) tips.push({title:'試合進行中',desc:'対戦中の試合を再開して勝利を目指しましょう'});
  const tipHtml = tips.length ? `<div class="tip-list">${tips.map(t=>`<div class="tip-item"><span class="marker"></span><div><strong>${esc(t.title)}</strong><div>${esc(t.desc)}</div></div></div>`).join('')}</div>` : '<p class="note">次に何をするか迷ったら、試合・探索・スカウトから始めてみてください。</p>';
  let active='';
  if(save.activeMatch){
    const ms = save.activeMatch;
    const state = ms.finished ? '終了' : `${ms.inning}回 ${ms.outs}アウト`;
    active += `<div class="panel"><div class="ph"><div><span class="eyebrow">進行中の試合</span><h2>${esc(NPC_TEAMS[ms.oppId].short)} 戦</h2></div></div><p>${state}</p><div class="btnrow"><button class="btn pri" onclick="setScreen('match')">試合画面へ</button></div></div>`;
  }
  if(save.activeExpedition){
    const ex = save.activeExpedition;
    const planet = PLANETS[ex.planetId];
    active += `<div class="panel"><div class="ph"><div><span class="eyebrow">進行中の探索</span><h2>${esc(planet.name)}</h2></div></div><p>ステップ ${ex.step}/${ex.total}  調査率 ${ex.survey}%</p><div class="btnrow"><button class="btn pri" onclick="setScreen('explore')">探索画面へ</button></div></div>`;
  }
  const newsHtml = save.news.length ? save.news.map(n => `<div class="news-item">${esc(n.text)}</div>`).join('') : '<p class="note">チームニュースはここに表示されます。</p>';
  const hero = save.players.slice(0,3).map(p => summaryCard(p)).join('');
  main.innerHTML = `
    <section class="panel">
      <div class="ph"><div><span class="eyebrow">ホーム</span><h2>アストロ・パイオニアーズ</h2></div><div class="sub">${esc(save.team.name)}</div></div>
      <div class="kv"><b>クレジット</b><span>${save.team.credits}</span></div>
      <div class="kv"><b>訓練データ</b><span>${save.inventory.trainingData}</span></div>
      <div class="btnrow">
        <button class="btn pri" onclick="setScreen('match')">試合</button>
        <button class="btn pri" onclick="setScreen('explore')">探索</button>
        <button class="btn pri" onclick="setScreen('scout')">スカウト</button>
        <button class="btn pri" onclick="setScreen('save')">保存</button>
      </div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">おすすめ行動</span><h2>次にやること</h2></div></div>${tipHtml}</section>
    ${active}
    <section class="panel"><div class="ph"><div><span class="eyebrow">銀河スポーツニュース</span><h2>最新情報</h2></div></div>${newsHtml}</section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">注目選手</span><h2>最近の活躍</h2></div></div><div class="player-grid">${hero}</div></section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">最近の結果</span><h2>直近の試合</h2></div></div>${recent}</section>
  `;
}

function renderMatch(){
  const main = document.getElementById('main');
  if(!save.activeMatch){
    const options = Object.keys(NPC_TEAMS).map(id => `
      <button class="btn${UI.oppSel===id?' pri':''}" onclick="selectOpp('${id}')">${esc(NPC_TEAMS[id].name)}</button>`).join('');
    main.innerHTML = `
      <section class="panel"><div class="ph"><div><span class="eyebrow">試合</span><h2>対戦相手を選択</h2></div></div>${options}
        <div class="btnrow"><button class="btn pri" onclick="startMatch(UI.oppSel)">対戦開始</button></div>
      </section>
    `;
    return;
  }
  const ms = save.activeMatch;
  const score = `${pTot(ms)} - ${nTot(ms)}`;
  const status = ms.finished ? '試合終了' : `${ms.inning}回 ${ms.outs}アウト`;
  const currentHalf = !ms.finished && typeof ms.score.p[ms.inning-1] === 'number' ? 'bottom' : 'top';
  const currentBatter = !ms.finished ? (currentHalf==='bottom' ? getPlayer(ms.order[ms.batIdx.p%9]).name : oppData(ms.oppId).bats[ms.batIdx.n%9].name) : '—';
  const offense = !ms.finished ? (currentHalf==='bottom' ? save.team.name : NPC_TEAMS[ms.oppId].name) : '—';
  const baseHtml = `
    <div class="field">
      <div class="fline"></div>
      <div class="base${ms.bases[0]?' on':''}" style="left:88%;top:50%">1B</div>
      <div class="base${ms.bases[1]?' on':''}" style="left:50%;top:12%">2B</div>
      <div class="base${ms.bases[2]?' on':''}" style="left:12%;top:50%">3B</div>
    </div>
    <div class="fmeta"><div>攻撃: ${esc(offense)}</div><div>打者: ${esc(currentBatter)}</div></div>
  `;
  const result = ms.finished ? `<div class="match-result"><div class="label ${ms.result.outcome==='win'?'win':ms.result.outcome==='lose'?'lose':'draw'}">${esc(ms.result.outcome.toUpperCase())}</div><div class="stat"><span>スコア</span><strong>${score}</strong></div><div class="stat"><span>相手</span><strong>${esc(ms.result.oppName)}</strong></div><div class="stat"><span>MVP</span><strong>${esc(ms.result.mvp||'—')}</strong></div><div class="stat"><span>獲得CR</span><strong>${ms.result.credits}</strong></div></div>` : '';
  const actionButtons = ms.finished ? `<button class="btn pri" onclick="closeMatch()">試合を閉じる</button>` : `<button class="btn pri" onclick="advanceMatch(false)">次へ進める</button><button class="btn" onclick="advanceMatch(true)">一気に決着</button>`;
  const logItems = ms.log.slice(-18);
  let currentGroup = 0;
  const log = logItems.map(item => {
    const text = (item.half==='sys'? '' : halfLabel(item.inn,item.half)) + item.text;
    const isImpact = /◆|ホームラン|逆転|同点|ピンチ|チャンス|サヨナラ|勝利|敗北|四球|得点/.test(text);
    const group = item.inn<=3 ? 1 : item.inn<=6 ? 2 : 3;
    let marker = '';
    if(group !== currentGroup){
      currentGroup = group;
      marker = `<p class="log-sep">${group===1?'1回表〜3回裏':'4回表〜6回裏'}</p>`;
    }
    const label = isImpact ? `<span class="log-label">${/ホームラン/.test(text)?'HOMERUN':/逆転|勝利/.test(text)?'CLUTCH':/同点|ピンチ/.test(text)?'PINCH':'CHANCE'}</span>` : '';
    const cls = [item.hl ? 'hl' : '', isImpact ? 'impact' : ''].filter(Boolean).join(' ');
    return marker + `<p${cls?` class="${cls}"`:''}>${label}${esc(text)}</p>`;
  }).join('');
  main.innerHTML = `
    <section class="panel"><div class="ph"><div><span class="eyebrow">試合</span><h2>${esc(NPC_TEAMS[ms.oppId].name)} 戦</h2></div><div class="sub">${status}</div></div>
      <div class="kv"><b>スコア</b><span>${score}</span></div>
      ${result}
      ${!ms.finished ? `<div class="field-card">${baseHtml}</div>` : ''}
      <div class="btnrow">${actionButtons}</div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">ログ</span><h2>直近プレイ</h2></div></div><div class="log">${log || '<p>まだプレイされていません。</p>'}</div></section>
  `;
}

function renderExplore(){
  const main = document.getElementById('main');
  if(save.activeExpedition){
    const ex = save.activeExpedition;
    const planet = PLANETS[ex.planetId];
    const results = ex.results.map(r => `<p${r.ev?' class="impact"':''}>${esc(r.text)}</p>`).join('');
    const action = ex.finished ? '<button class="btn pri" onclick="closeExpedition()">探索を閉じる</button>' : ex.pend ? `<button class="btn pri" onclick="chooseExpedition('safe')">A. 安全に調査する</button><button class="btn pri" onclick="chooseExpedition('deep')">B. 深部へ進む</button><button class="btn pri" onclick="chooseExpedition('data')">C. データだけ回収する</button>` : `<button class="btn pri" onclick="stepExpedition()">次のステップ</button><button class="btn" onclick="retreatExpedition()">撤退する</button>`;
    const gainsHtml = Object.entries(ex.gains).map(([mid,q]) => `<div class="material-card${MATERIALS[mid].r===3?' rare':''}"><strong>${esc(MATERIALS[mid].name)}</strong><span>×${q}</span></div>`).join('') || '<p class="note">素材はまだ獲得されていません。</p>';
    const gauge = `<div class="gauge-outer"><div class="gauge-inner"><i style="width:${clampN(ex.survey,0,100)}%"></i></div></div><div class="gauge-note">調査率 ${ex.survey}%</div>`;
    const milestone = ex.result && ex.result.unlocked && ex.result.unlocked.length ? `<div class="milestone">${esc(ex.result.unlocked.join(' / '))}</div>` : '';
    main.innerHTML = `
      <section class="panel"><div class="ph"><div><span class="eyebrow">探索</span><h2>${esc(planet.name)}</h2></div><div class="sub">ステップ ${ex.step}/${ex.total}</div></div>
        <div class="kv"><b>獲得素材</b><span>${Object.values(ex.gains).reduce((s,q)=>s+q,0)||0} 個</span></div>
        ${gainsHtml ? `<div class="material-grid">${gainsHtml}</div>` : ''}
        ${gauge}
        ${milestone}
        <div class="reward-card">報酬: ${Object.entries(ex.gains).map(([mid,q])=>`🔹 ${esc(MATERIALS[mid].name)} ×${q}`).join(' / ')} ${ex.sGain?` | 調査率+${ex.sGain}%` : ''}</div>
        <div class="btnrow">${action}</div>
      </section>
      <section class="panel"><div class="ph"><div><span class="eyebrow">探索ログ</span><h2>進行記録</h2></div></div><div class="log">${results || '<p>まだ記録がありません。</p>'}</div></section>
    `;
    return;
  }
  const planets = Object.keys(PLANETS).map(id => {
    const pl = PLANETS[id];
    return `<button class="btn${UI.expPlanet===id?' pri':''}" onclick="selectExpPlanet('${id}')">${esc(pl.name)}</button>`;
  }).join('');
  const party = save.players.filter(p => !p.isPitcher);
  const partyButtons = party.map(p => `<button class="btn${UI.expParty.includes(p.id)?' pri':''}" onclick="toggleExpParty('${p.id}')">${esc(p.name)} (${esc(p.pos[0])})</button>`).join('');
  main.innerHTML = `
    <section class="panel"><div class="ph"><div><span class="eyebrow">探索</span><h2>惑星を選択</h2></div></div>${planets}</section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">パーティ</span><h2>編成を選ぶ</h2></div></div>${partyButtons || '<p>編成できる選手がいません。</p>'}<div class="btnrow"><button class="btn pri" onclick="startExpeditionParty()">探索開始</button></div></section>
  `;
}

function renderScout(){
  const main = document.getElementById('main');
  const pulled = save.scout.pulledIds.map(id => {
    const pl = PLAYER_MASTER[id];
    return `<div class="card"><div class="kv"><b>${esc(pl.name)}</b><span>${esc(TYPE_INFO[pl.type].label)}</span></div><div class="note">${esc(pl.role)} / ${esc(pl.pos.join('/'))}</div></div>`;
  }).join('') || '<p class="note">まだスカウトしていません。</p>';
  main.innerHTML = `
    <section class="panel"><div class="ph"><div><span class="eyebrow">スカウト</span><h2>新入団選手</h2></div></div>
      <div class="kv"><b>クレジット</b><span>${save.team.credits}</span></div>
      <div class="btnrow"><button class="btn pri" onclick="doScout()">スカウト (${SCOUT_COST}CR)</button></div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">獲得履歴</span><h2>スカウト済み</h2></div></div>${pulled}</section>
  `;
}

function renderSave(){
  const main = document.getElementById('main');
  const json = esc(JSON.stringify(save, null, 2));
  main.innerHTML = `
    <section class="panel"><div class="ph"><div><span class="eyebrow">保存</span><h2>データ管理</h2></div></div>
      <div class="kv"><b>最終更新</b><span>${esc(save.updatedAt)}</span></div>
      <div class="btnrow"><button class="btn pri" onclick="persist(); toast('保存しました');">保存</button><button class="btn" onclick="copySaveText()">データコピー</button></div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">開発用</span><h2>初期スタート</h2></div></div>
      <p class="note">固まった時や作り直し確認用に、現在のセーブを初期状態へ戻します。</p>
      <div class="btnrow"><button class="btn danger" onclick="resetToDefaultSave()">初期スタートに戻す</button></div>
    </section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">バックアップ</span><h2>JSON</h2></div></div>
      <textarea id="save-export" class="io">${json}</textarea>
      <div class="btnrow"><button class="btn pri" onclick="importSaveText()">JSON読み込み</button></div>
    </section>
  `;
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!UI.modal){ root.className=''; root.innerHTML=''; return; }
  let html='';
  if(UI.modal.kind==='matchEffect'){
    const ms = save.activeMatch;
    const idx = ms.effectIndex||0;
    const evt = ms.effectQueue && ms.effectQueue[idx] ? ms.effectQueue[idx] : null;
    if(evt){
      if(evt.cine){
        html = renderCinematicStage(evt,ms);
      } else {
        const effectBg = evt.type==='pinch' ? 'background:radial-gradient(circle at top, rgba(196,77,255,.18), transparent);' : evt.type==='homerun' ? 'background:radial-gradient(circle at top left, rgba(255,196,77,.18), transparent);' : '';
        html = `
        <div class="mback" onclick="closeModal()"></div>
        <div class="mbox" style="${effectBg}">
          <div class="ph"><div><span class="eyebrow">演出ステージ</span><h2>${esc(evt.label)}</h2></div></div>
          <div class="effect-card">
            <div class="effect-row"><span>打者</span><strong>${esc(evt.actor||'—')}</strong></div>
            <div class="effect-row"><span>投手</span><strong>${esc(evt.pitcher||'—')}</strong></div>
            <div class="effect-row"><span>塁状況</span><strong>${esc(evt.bases||'—')}</strong></div>
            <div class="effect-text">${esc(evt.desc)}</div>
            <div class="effect-result">${esc(evt.result)}</div>
          </div>
          <div class="btnrow"><button class="btn pri" onclick="nextMatchEffect()">次の演出へ</button></div>
        </div>
        `;
      }
    }
  } else if(UI.modal.kind==='matchSummary'){
    const ms = save.activeMatch;
    const summaryRows = ms.finished
      ? `<div class="stat"><span>最終スコア</span><strong>${pTot(ms)} - ${nTot(ms)}</strong></div>`
      : `<div class="stat"><span>現在のスコア</span><strong>${pTot(ms)} - ${nTot(ms)}</strong></div>
          <div class="stat"><span>次のイニング</span><strong>${ms.inning+'回'}</strong></div>
          <div class="stat"><span>打者</span><strong>${esc(getPlayer(ms.order[ms.batIdx.p%9]).name)}</strong></div>`;
    html = `
      <div class="mback" onclick="closeMatchSummary()"></div>
      <div class="mbox goldfx">
        <div class="ph"><div><span class="eyebrow">演出完了</span><h2>区切り結果</h2></div></div>
        <div class="match-result">
          ${summaryRows}
        </div>
        <div class="btnrow"><button class="btn pri" onclick="closeMatchSummary()">続ける</button></div>
      </div>
    `;
  } else if(UI.modal.kind==='exploreChoice'){
    const pend = UI.modal.pend||{};
    html = `
      <div class="mback" onclick="closeModal()"></div>
      <div class="mbox">
        <div class="ph"><div><span class="eyebrow">探索決断</span><h2>${esc(UI.modal.planet||'遭遇')}</h2></div></div>
        <div class="effect-card">
          <div class="effect-row"><span>遭遇</span><strong>${esc(pend.text)}</strong></div>
          <div class="effect-row"><span>深度</span><strong>${Math.round(pend.okP*100)}%</strong></div>
        </div>
        <div class="btnrow">
          ${pend.options.map(o=>`<button class="btn pri" onclick="chooseExpedition('${o.id}')">${esc(o.label)}</button>`).join('')}
          <button class="btn" onclick="retreatExpedition()">撤退する</button>
        </div>
      </div>
    `;
  } else if(UI.modal.kind==='exploreEffect'){
    const res = UI.modal.res||{};
    html = `
      <div class="mback" onclick="closeModal()"></div>
      <div class="mbox">
        <div class="ph"><div><span class="eyebrow">探索演出</span><h2>${esc(res.planet||'探索')}</h2></div></div>
        <div class="effect-card">
          <div class="effect-row"><span>イベント</span><strong>${esc(res.desc)}</strong></div>
          <div class="effect-row"><span>報酬</span><strong>${res.gains?Object.entries(res.gains).map(([mid,q])=>`${esc(MATERIALS[mid].name)} ×${q}`).join(' / '):'—'}</strong></div>
          <div class="effect-row"><span>調査率</span><strong>${res.survey}%</strong></div>
        </div>
        <div class="btnrow"><button class="btn pri" onclick="closeModal()">結果へ</button></div>
      </div>
    `;
  } else if(UI.modal.kind==='matchResult'){
    const ms = save.activeMatch;
    const out = ms && ms.result ? ms.result : (UI.modal.res || {});
    const label = out.outcome==='win' ? 'WIN' : out.outcome==='lose' ? 'LOSE' : 'DRAW';
    const styleClass = out.outcome==='win' ? 'win' : out.outcome==='lose' ? 'lose' : 'draw';
    const score = ms ? `${pTot(ms)} - ${nTot(ms)}` : `${out.p||0} - ${out.n||0}`;
    html = `
      <div class="mback" onclick="closeModal()"></div>
      <div class="mbox goldfx">
        <div class="ph"><div><span class="eyebrow">試合結果</span><h2>${esc(label)}</h2></div></div>
        <div class="match-result">
          <div class="label ${styleClass}">${esc(label)}</div>
          <div class="stat"><span>スコア</span><strong>${score}</strong></div>
          <div class="stat"><span>相手</span><strong>${esc(out.oppName||'—')}</strong></div>
          <div class="stat"><span>MVP</span><strong>${esc(out.mvp||'—')}</strong></div>
          <div class="stat"><span>獲得クレジット</span><strong>${out.credits||0}</strong></div>
          <div class="stat"><span>主な活躍</span><strong>${esc(out.expList? out.expList.slice(0,3).map(x=>x.name+' +'+x.exp).join(', '):'—')}</strong></div>
        </div>
        <div class="btnrow"><button class="btn pri" onclick="closeModal()">閉じる</button></div>
      </div>
    `;
  }
  else if(UI.modal.kind==='scoutResult'){
    const res = UI.modal.res || {};
    const lastId = res.mid || save.scout.pulledIds[save.scout.pulledIds.length-1];
    const pl = PLAYER_MASTER[lastId];
    const dupe = res.dupe || false;
    const newTag = !dupe ? '<div class="newtag">NEW</div>' : `<div class="dupetag">被り：訓練データ ${res.td||0}個</div>`;
    html = `
      <div class="mback" onclick="closeModal()"></div>
      <div class="mbox ${pl && pl.rarity===3 ? 'goldfx' : ''}">
        <div class="ph"><div><span class="eyebrow">スカウト結果</span><h2>${esc(pl.name)}</h2></div></div>
        <div class="scout-card${pl && pl.rarity===3 ? ' goldfx' : ''}">
          <div class="rarity">${stars(pl.rarity)}</div>
          ${newTag}
          <div class="pl-name">${esc(pl.name)}</div>
          <div class="pl-details"><span>${esc(TYPE_INFO[pl.type].label)}</span><span>${esc(ROLE_INFO[pl.role]||pl.role)}</span><span>${esc(pl.pos.join('/'))}</span></div>
          <p class="note">${esc(pl.pf)}</p>
        </div>
        <div class="btnrow"><button class="btn pri" onclick="closeModal()">閉じる</button></div>
      </div>
    `;
  }
  else {
    html = `<div class="mback" onclick="closeModal()"></div><div class="mbox"><p>情報がありません。</p><div class="btnrow"><button class="btn pri" onclick="closeModal()">閉じる</button></div></div>`;
  }
  root.className='show'; root.innerHTML=html;
}

function renderSide(){
  const side = document.getElementById('side');
  let html = '<div class="panel"><div class="ph"><div><span class="eyebrow">チーム</span><h2>パワー</h2></div></div>';
  html += `<div class="kv"><b>打撃</b><span>${teamPower()}</span></div>`;
  html += `<div class="kv"><b>施設</b><span>TR${save.facilities.training} A${save.facilities.analytics} WS${save.facilities.workshop}</span></div>`;
  html += '</div>';
  side.innerHTML = html;
}

function render(){
  if(!save) save = loadSave();
  renderNav();
  if(UI.screen==='home') renderHome();
  else if(UI.screen==='match') renderMatch();
  else if(UI.screen==='explore') renderExplore();
  else if(UI.screen==='scout') renderScout();
  else if(UI.screen==='save') renderSave();
  else renderHome();
  renderSide();
  renderModal();
}

function toast(message){
  const toastEl = document.getElementById('toast');
  if(!toastEl) return;
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(UI.toastTimer);
  UI.toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2400);
}

document.addEventListener('DOMContentLoaded', ()=>{
  save = loadSave();
  render();
});
</script>
</body>
</html>
